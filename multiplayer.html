<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Multiplayer Arena | Chess Universe</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="text-slate-100 min-h-screen flex flex-col font-sans select-none antialiased">

  <header class="border-b border-slate-800 bg-slate-900/60 px-4 py-3 flex items-center justify-between sticky top-0 z-40 backdrop-blur-sm">
    <div class="flex items-center gap-2">
      <a href="index.html" class="text-slate-400 hover:text-white text-lg mr-1">←</a>
      <span class="font-bold text-sm tracking-wide text-white">MULTIPLAYER</span>
    </div>
    <a href="index.html" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium px-3 py-1.5 rounded-lg border border-slate-700 transition">Hub</a>
  </header>

  <main class="flex-1 max-w-md w-full mx-auto p-4 space-y-4">

    <!-- Online PvP -->
    <a href="online.html" class="block bg-slate-900 hover:bg-slate-800/80 border border-slate-800 hover:border-sky-500/50 p-5 rounded-2xl transition group shadow-lg">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-4">
          <div class="w-12 h-12 rounded-xl bg-sky-500/10 border border-sky-500/20 flex items-center justify-center text-2xl text-sky-400">
            ⚡
          </div>
          <div>
            <h3 class="text-sm font-bold text-white group-hover:text-sky-400 transition">Random Online Match</h3>
            <p class="text-xs text-slate-400 mt-0.5">Quick matchmaking with random opponents</p>
          </div>
        </div>
        <span class="text-slate-500 text-lg group-hover:translate-x-0.5 transition">→</span>
      </div>
    </a>

    <!-- Friend Duel -->
    <a href="friend.html" class="block bg-slate-900 hover:bg-slate-800/80 border border-slate-800 hover:border-emerald-500/50 p-5 rounded-2xl transition group shadow-lg">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-4">
          <div class="w-12 h-12 rounded-xl bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center text-2xl text-emerald-400">
            👥
          </div>
          <div>
            <h3 class="text-sm font-bold text-white group-hover:text-emerald-400 transition">10-Digit UID Friend Duel</h3>
            <p class="text-xs text-slate-400 mt-0.5">Search friends, room codes & direct WhatsApp invite</p>
          </div>
        </div>
        <span class="text-slate-500 text-lg group-hover:translate-x-0.5 transition">→</span>
      </div>
    </a>

  </main>

  <script type="module">
    import { checkAuthOrRedirect } from './script.js';
    checkAuthOrRedirect();
  </script>
</body>
</html>
