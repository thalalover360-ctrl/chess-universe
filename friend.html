<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Friends Network & Chat | Chess Universe</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">

  <style>
    body {
      background: radial-gradient(circle at top, #14241b 0%, #060e09 100%);
      color: #e2e8f0;
      touch-action: manipulation;
      min-height: 100vh;
      overflow-x: hidden;
    }
    .glass-card {
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(16, 185, 129, 0.18);
    }
    .custom-scroll::-webkit-scrollbar { width: 4px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: rgba(16, 185, 129, 0.35); border-radius: 4px; }
  </style>
</head>
<body class="min-h-screen flex flex-col font-sans select-none pb-12">

  <!-- Header -->
  <header class="border-b border-emerald-950 bg-emerald-950/40 backdrop-blur sticky top-0 z-40 px-3.5 py-2.5 flex items-center justify-between">
    <div class="flex items-center gap-2.5">
      <a href="index.html" class="w-8 h-8 rounded-xl bg-slate-900 border border-slate-800 flex items-center justify-center text-slate-300 hover:text-white transition">
        <i class="fa-solid fa-chevron-left text-xs"></i>
      </a>
      <div>
        <h1 class="text-xs font-black uppercase text-white tracking-wider flex items-center gap-1.5">
          <span>FRIENDS NETWORK</span>
          <span class="text-[9px] bg-purple-500/20 text-purple-400 font-mono px-1.5 py-0.2 rounded border border-purple-500/30">10-DIGIT</span>
        </h1>
        <p class="text-[10px] text-slate-400 font-medium">Add Friends, Chat & Direct Duels</p>
      </div>
    </div>
  </header>

  <main class="max-w-md w-full mx-auto px-3.5 pt-3.5 flex flex-col gap-3.5">

    <!-- My UID Card -->
    <div class="glass-card rounded-3xl p-4 flex items-center justify-between shadow-xl border-purple-500/30">
      <div class="flex items-center gap-3">
        <div class="w-12 h-12 rounded-2xl bg-purple-500/20 border border-purple-500/40 flex items-center justify-center text-xl font-black text-purple-400 shadow-md" id="myAvatar">
          H
        </div>
        <div>
          <h2 id="myNameText" class="text-sm font-black text-white leading-tight">Harsh Singh</h2>
          <div class="text-[11px] font-mono text-slate-400 mt-0.5 flex items-center gap-1.5">
            <span>UID:</span>
            <span id="myUidText" class="text-purple-400 font-black tracking-wider">0000000000</span>
          </div>
        </div>
      </div>
      <button onclick="copyMyUID()" class="px-3 py-1.5 bg-slate-950 hover:bg-slate-800 border border-purple-500/40 rounded-xl text-[10px] font-bold uppercase tracking-wider text-purple-300 flex items-center gap-1.5 transition">
        <i class="fa-regular fa-copy"></i> Copy
      </button>
    </div>

    <!-- 10-Digit Search Bar -->
    <div class="glass-card rounded-3xl p-3.5 flex flex-col gap-2.5 shadow-xl">
      <span class="text-[10px] font-mono uppercase text-slate-400 font-bold">Search Friend By 10-Digit UID</span>
      <div class="flex items-center gap-2">
        <input type="text" id="inputSearchUID" placeholder="Enter 10-Digit UID (e.g. 8830464849)" maxlength="10" class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2 text-xs font-mono text-emerald-400 tracking-wider focus:outline-none focus:border-purple-500">
        <button onclick="searchFriendByUID()" class="px-4 py-2 bg-purple-600 hover:bg-purple-500 text-white font-black rounded-xl text-xs uppercase tracking-wider transition shadow">
          Search
        </button>
      </div>
      <!-- Search Result Display Box -->
      <div id="searchResultBox" class="hidden mt-1 p-3 bg-slate-950 rounded-2xl border border-slate-800 flex items-center justify-between">
        <div class="flex items-center gap-2.5">
          <div class="w-9 h-9 rounded-xl bg-purple-500/20 text-purple-400 font-bold flex items-center justify-center text-xs" id="foundInitial">P</div>
          <div>
            <h4 id="foundName" class="text-xs font-bold text-white leading-tight">Player</h4>
            <span id="foundElo" class="text-[10px] font-mono text-slate-400">1200 Elo</span>
          </div>
        </div>
        <button onclick="sendFriendRequest()" id="btnSendRequest" class="px-3 py-1.5 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black rounded-xl text-[10px] uppercase tracking-wider transition">
          Add Friend
        </button>
      </div>
    </div>

    <!-- Tabs: Friends List / Requests -->
    <div class="flex gap-2">
      <button onclick="switchTab('friends')" id="tabBtnFriends" class="flex-1 py-2 rounded-xl bg-purple-600 text-white text-xs font-bold uppercase tracking-wider transition">Friends</button>
      <button onclick="switchTab('requests')" id="tabBtnRequests" class="flex-1 py-2 rounded-xl bg-slate-900 border border-slate-800 text-slate-400 text-xs font-bold uppercase tracking-wider transition">Requests (<span id="reqCount">0</span>)</button>
    </div>

    <!-- Friends Container -->
    <div id="friendsListContainer" class="flex flex-col gap-2">
      <!-- Populated dynamically -->
      <div class="glass-card rounded-2xl p-4 text-center text-xs text-slate-500 font-mono">
        No friends added yet. Share your UID above!
      </div>
    </div>

    <!-- Requests Container -->
    <div id="requestsListContainer" class="hidden flex flex-col gap-2">
      <div class="glass-card rounded-2xl p-4 text-center text-xs text-slate-500 font-mono">
        No incoming friend requests.
      </div>
    </div>

  </main>
    <!-- 1-on-1 Live Chat Modal Drawer -->
  <div id="chatDrawer" class="hidden fixed inset-0 z-50 bg-black/85 backdrop-blur-sm flex flex-col justify-end p-2">
    <div class="bg-slate-900 border border-purple-500/40 w-full max-w-md mx-auto rounded-3xl p-4 shadow-2xl flex flex-col gap-3 h-[80vh]">
      
      <!-- Chat Header -->
      <div class="flex items-center justify-between border-b border-slate-800 pb-2.5">
        <div class="flex items-center gap-2.5">
          <div class="w-9 h-9 rounded-xl bg-purple-500/20 text-purple-400 font-bold flex items-center justify-center text-xs" id="chatPartnerAvatar">P</div>
          <div>
            <h3 class="text-xs font-black text-white leading-tight" id="chatPartnerName">Chat</h3>
            <span class="text-[9px] font-mono text-emerald-400 font-bold">Online</span>
          </div>
        </div>
        <div class="flex items-center gap-2">
          <button onclick="challengeCurrentFriend()" class="px-2.5 py-1 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black rounded-xl text-[10px] uppercase tracking-wider transition flex items-center gap-1 shadow">
            <i class="fa-solid fa-swords"></i> Duel
          </button>
          <button onclick="closeChatDrawer()" class="w-8 h-8 rounded-xl bg-slate-950 border border-slate-800 text-slate-400 hover:text-white flex items-center justify-center text-xs">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
      </div>

      <!-- Messages Stream -->
      <div id="chatMessagesBox" class="flex-1 overflow-y-auto custom-scroll flex flex-col gap-2 p-1 font-sans text-xs">
        <div class="text-center text-[10px] font-mono text-slate-500 my-auto">Start chatting or send a duel challenge!</div>
      </div>

      <!-- Message Input -->
      <div class="flex items-center gap-2 pt-1 border-t border-slate-800">
        <input type="text" id="chatInputMessage" placeholder="Type a message..." class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-purple-500" onkeydown="if(event.key==='Enter') sendChatMessage()">
        <button onclick="sendChatMessage()" class="w-9 h-9 rounded-xl bg-purple-600 hover:bg-purple-500 text-white flex items-center justify-center text-xs transition">
          <i class="fa-solid fa-paper-plane"></i>
        </button>
      </div>

    </div>
  </div>

  <!-- FIRESTORE FRIENDS & CHAT SYNC SCRIPT -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { getFirestore, doc, setDoc, getDoc, updateDoc, onSnapshot, collection, query, where, getDocs, addDoc, orderBy } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBx79cUd4hX7XzCe8aCPIeqLss1d5nNzaM",
      authDomain: "chess-universe-5a7cb.firebaseapp.com",
      projectId: "chess-universe-5a7cb",
      storageBucket: "chess-universe-5a7cb.firebasestorage.app",
      messagingSenderId: "145519167856",
      appId: "1:145519167856:web:bf124bc275895447fd27b5"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const myName = localStorage.getItem('chess_name') || 'Harsh Singh';
    const myUID = localStorage.getItem('chess_game_uid') || '8830464849';
    const myElo = parseInt(localStorage.getItem('chess_rating'), 10) || 1200;

    document.getElementById('myNameText').innerText = myName;
    document.getElementById('myAvatar').innerText = myName.charAt(0).toUpperCase();
    document.getElementById('myUidText').innerText = myUID;

    let foundUserCache = null;
    let activeChatPartner = null;
    let chatUnsubscribe = null;

    window.copyMyUID = () => {
      navigator.clipboard.writeText(myUID);
      alert("UID copied to clipboard: " + myUID);
    };

    window.switchTab = (tab) => {
      if (tab === 'friends') {
        document.getElementById('tabBtnFriends').className = "flex-1 py-2 rounded-xl bg-purple-600 text-white text-xs font-bold uppercase tracking-wider transition";
        document.getElementById('tabBtnRequests').className = "flex-1 py-2 rounded-xl bg-slate-900 border border-slate-800 text-slate-400 text-xs font-bold uppercase tracking-wider transition";
        document.getElementById('friendsListContainer').classList.remove('hidden');
        document.getElementById('requestsListContainer').classList.add('hidden');
      } else {
        document.getElementById('tabBtnRequests').className = "flex-1 py-2 rounded-xl bg-purple-600 text-white text-xs font-bold uppercase tracking-wider transition";
        document.getElementById('tabBtnFriends').className = "flex-1 py-2 rounded-xl bg-slate-900 border border-slate-800 text-slate-400 text-xs font-bold uppercase tracking-wider transition";
        document.getElementById('requestsListContainer').classList.remove('hidden');
        document.getElementById('friendsListContainer').classList.add('hidden');
      }
    };

    // 1. Search Friend by 10-Digit UID
    window.searchFriendByUID = async () => {
      const qUID = document.getElementById('inputSearchUID').value.trim();
      if (qUID.length !== 10) return alert("Please enter a valid 10-digit UID!");
      if (qUID === myUID) return alert("You cannot add yourself!");

      try {
        const usersRef = collection(db, "users");
        const q = query(usersRef, where("gameUID", "==", qUID));
        const snap = await getDocs(q);

        if (snap.empty) {
          alert("No player found with this 10-digit UID!");
          return;
        }

        const data = snap.docs[0].data();
        foundUserCache = { id: snap.docs[0].id, ...data };

        document.getElementById('foundName').innerText = data.name || "Player";
        document.getElementById('foundInitial').innerText = (data.name || "P").charAt(0).toUpperCase();
        document.getElementById('foundElo').innerText = `${data.rating || 1200} Elo`;
        document.getElementById('searchResultBox').classList.remove('hidden');
      } catch (err) {
        console.error(err);
        alert("Search error: " + err.message);
      }
    };

    // 2. Send Friend Request
    window.sendFriendRequest = async () => {
      if (!foundUserCache) return;
      try {
        await addDoc(collection(db, "friend_requests"), {
          fromUID: myUID,
          fromName: myName,
          fromElo: myElo,
          toUID: foundUserCache.gameUID,
          toName: foundUserCache.name,
          status: "pending",
          createdAt: Date.now()
        });
        alert("Friend request sent!");
        document.getElementById('searchResultBox').classList.add('hidden');
      } catch (err) {
        alert("Error sending request: " + err.message);
      }
    };

    // 3. Listen Incoming Requests
    onSnapshot(query(collection(db, "friend_requests"), where("toUID", "==", myUID), where("status", "==", "pending")), (snap) => {
      document.getElementById('reqCount').innerText = snap.size;
      const container = document.getElementById('requestsListContainer');
      if (snap.empty) {
        container.innerHTML = `<div class="glass-card rounded-2xl p-4 text-center text-xs text-slate-500 font-mono">No incoming requests.</div>`;
        return;
      }
      container.innerHTML = '';
      snap.forEach(docSnap => {
        const req = docSnap.data();
        const card = document.createElement('div');
        card.className = "glass-card rounded-2xl p-3 flex items-center justify-between";
        card.innerHTML = `
          <div class="flex items-center gap-2.5">
            <div class="w-8 h-8 rounded-xl bg-purple-500/20 text-purple-400 font-bold flex items-center justify-center text-xs">${req.fromName.charAt(0)}</div>
            <div>
              <h4 class="text-xs font-bold text-white">${req.fromName}</h4>
              <span class="text-[10px] font-mono text-slate-400">${req.fromElo} Elo</span>
            </div>
          </div>
          <div class="flex items-center gap-1.5">
            <button onclick="acceptRequest('${docSnap.id}', '${req.fromUID}', '${req.fromName}', ${req.fromElo})" class="px-2.5 py-1 bg-emerald-500 text-slate-950 font-bold rounded-xl text-[10px]">Accept</button>
          </div>
        `;
        container.appendChild(card);
      });
    });

    window.acceptRequest = async (docId, fUID, fName, fElo) => {
      await updateDoc(doc(db, "friend_requests", docId), { status: "accepted" });
      await addDoc(collection(db, "friendships"), {
        uids: [myUID, fUID],
        user1: { uid: myUID, name: myName, elo: myElo },
        user2: { uid: fUID, name: fName, elo: fElo },
        createdAt: Date.now()
      });
    };

    // 4. Listen Active Friends
    onSnapshot(query(collection(db, "friendships"), where("uids", "array-contains", myUID)), (snap) => {
      const container = document.getElementById('friendsListContainer');
      if (snap.empty) {
        container.innerHTML = `<div class="glass-card rounded-2xl p-4 text-center text-xs text-slate-500 font-mono">No friends added yet. Share your UID above!</div>`;
        return;
      }
      container.innerHTML = '';
      snap.forEach(docSnap => {
        const data = docSnap.data();
        const friend = data.user1.uid === myUID ? data.user2 : data.user1;
        const card = document.createElement('div');
        card.className = "glass-card rounded-2xl p-3 flex items-center justify-between";
        card.innerHTML = `
          <div class="flex items-center gap-2.5">
            <div class="w-9 h-9 rounded-xl bg-purple-500/20 text-purple-400 font-bold flex items-center justify-center text-xs">${friend.name.charAt(0)}</div>
            <div>
              <h4 class="text-xs font-bold text-white">${friend.name}</h4>
              <span class="text-[10px] font-mono text-slate-400">UID: ${friend.uid} • ${friend.elo} Elo</span>
            </div>
          </div>
          <div class="flex items-center gap-1.5">
            <button onclick="openChatWith('${friend.uid}', '${friend.name}')" class="px-2.5 py-1.5 bg-slate-900 border border-purple-500/40 text-purple-300 font-bold rounded-xl text-[10px] flex items-center gap-1">
              <i class="fa-regular fa-message"></i> Chat
            </button>
            <button onclick="challengeDirect('${friend.uid}', '${friend.name}', ${friend.elo})" class="px-2.5 py-1.5 bg-emerald-500 text-slate-950 font-black rounded-xl text-[10px]">
              Duel ⚔️
            </button>
          </div>
        `;
        container.appendChild(card);
      });
    });

    // 5. Chat System
    window.openChatWith = (fUID, fName) => {
      activeChatPartner = { uid: fUID, name: fName };
      document.getElementById('chatPartnerName').innerText = fName;
      document.getElementById('chatPartnerAvatar').innerText = fName.charAt(0).toUpperCase();
      document.getElementById('chatDrawer').classList.remove('hidden');

      const chatId = [myUID, fUID].sort().join('_');
      const q = query(collection(db, "chats", chatId, "messages"), orderBy("timestamp", "asc"));

      if (chatUnsubscribe) chatUnsubscribe();
      chatUnsubscribe = onSnapshot(q, (snap) => {
        const box = document.getElementById('chatMessagesBox');
        box.innerHTML = '';
        snap.forEach(d => {
          const m = d.data();
          const isMe = m.senderUID === myUID;
          const bubble = document.createElement('div');
          bubble.className = `p-2 rounded-2xl max-w-[75%] ${isMe ? 'ml-auto bg-purple-600 text-white rounded-br-none' : 'mr-auto bg-slate-950 border border-slate-800 text-slate-200 rounded-bl-none'}`;
          bubble.innerHTML = `<div>${m.text}</div><div class="text-[9px] opacity-60 text-right mt-0.5">${new Date(m.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</div>`;
          box.appendChild(bubble);
        });
        box.scrollTop = box.scrollHeight;
      });
    };

    window.closeChatDrawer = () => {
      document.getElementById('chatDrawer').classList.add('hidden');
      if (chatUnsubscribe) chatUnsubscribe();
    };

    window.sendChatMessage = async () => {
      const input = document.getElementById('chatInputMessage');
      const text = input.value.trim();
      if (!text || !activeChatPartner) return;
      input.value = '';

      const chatId = [myUID, activeChatPartner.uid].sort().join('_');
      await addDoc(collection(db, "chats", chatId, "messages"), {
        senderUID: myUID,
        senderName: myName,
        text: text,
        timestamp: Date.now()
      });
    };

    window.challengeDirect = (fUID, fName, fElo) => {
      const roomId = "DUEL-" + Math.floor(1000 + Math.random() * 9000);
      window.location.href = `game.html?mode=pvp&room=${roomId}&side=white&oppName=${encodeURIComponent(fName)}&oppElo=${fElo}`;
    };

    window.challengeCurrentFriend = () => {
      if (activeChatPartner) challengeDirect(activeChatPartner.uid, activeChatPartner.name, 1200);
    };
  </script>
</body>
</html>
