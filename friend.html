<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Friends Hub | Chess Universe</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">

  <style>
    body {
      background: radial-gradient(circle at top, #14241b 0%, #060e09 100%);
      color: #e2e8f0;
      touch-action: manipulation;
    }
    .glass-card {
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(16, 185, 129, 0.18);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col font-sans select-none pb-12">

  <!-- Header -->
  <header class="border-b border-emerald-950 bg-emerald-950/40 backdrop-blur sticky top-0 z-40 px-3 py-2.5 flex items-center justify-between">
    <div class="flex items-center gap-2.5">
      <a href="index.html" class="w-8 h-8 rounded-xl bg-slate-900 border border-slate-800 flex items-center justify-center text-slate-300 hover:text-white transition">
        <i class="fa-solid fa-chevron-left text-xs"></i>
      </a>
      <div>
        <h1 class="text-xs font-black uppercase text-white tracking-wider flex items-center gap-1.5">
          <span>Friends Network</span>
          <span class="text-[9px] bg-emerald-500/20 text-emerald-400 font-mono px-1.5 py-0.2 rounded border border-emerald-500/30">10-DIGIT UID</span>
        </h1>
        <p class="text-[10px] text-slate-400 font-medium">Add Friends & Direct Duel</p>
      </div>
    </div>
    <div class="flex items-center gap-1 bg-slate-950 border border-amber-500/40 px-2.5 py-1 rounded-xl font-mono text-xs">
      <span>🪙</span>
      <span id="friendCoinsDisplay" class="font-bold text-amber-400">350</span>
    </div>
  </header>

  <main class="max-w-md w-full mx-auto px-3 pt-3 flex flex-col gap-3.5">

    <!-- My UID Share Card -->
    <div class="glass-card rounded-2xl p-3 flex items-center justify-between">
      <div>
        <span class="text-[9px] uppercase font-bold text-slate-400 block tracking-wider">Your Permanent Game UID</span>
        <div id="myUidText" class="font-mono text-sm font-black text-emerald-400 tracking-wider">Loading...</div>
      </div>
      <button onclick="copyMyUid()" class="px-3 py-1.5 bg-slate-950 hover:bg-slate-800 border border-slate-800 rounded-xl text-xs font-bold text-slate-300 flex items-center gap-1.5 transition">
        <i class="fa-regular fa-copy text-emerald-400"></i> Copy
      </button>
    </div>

    <!-- Search / Add Friend by UID -->
    <div class="glass-card rounded-3xl p-4 flex flex-col gap-3 shadow-xl">
      <h3 class="text-xs font-black uppercase tracking-wider text-white flex items-center gap-2">
        <i class="fa-solid fa-user-plus text-emerald-400"></i>
        <span>Add Friend by 10-Digit UID</span>
      </h3>
      <div class="flex items-center gap-2">
        <input type="tel" id="inputFriendUid" maxlength="10" placeholder="Enter Friend's 10-Digit UID" class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-xs text-emerald-400 font-mono tracking-widest focus:outline-none focus:border-emerald-500">
        <button onclick="searchAndAddFriend()" id="btnFindFriend" class="px-4 py-2.5 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black rounded-xl text-xs uppercase tracking-wider transition">
          Add
        </button>
      </div>
    </div>

    <!-- Friends Roster List -->
    <div class="glass-card rounded-3xl p-4 flex flex-col gap-3 shadow-xl">
      <div class="flex items-center justify-between border-b border-slate-800/80 pb-2">
        <h3 class="text-xs font-black uppercase tracking-wider text-slate-300">
          Saved Friends (<span id="friendsCount">0</span>)
        </h3>
      </div>
      <div id="friendsListContainer" class="flex flex-col gap-2 max-h-72 overflow-y-auto custom-scroll pr-1">
        <div class="text-center py-6 text-xs text-slate-500 font-medium">
          No friends added yet. Enter a 10-digit UID above!
        </div>
      </div>
    </div>

  </main>
    <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { getFirestore, doc, getDoc, updateDoc, arrayUnion } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBx79cUd4hX7XzCe8aCPIeqLss1d5nNzaM",
      authDomain: "chess-universe-5a7cb.firebaseapp.com",
      projectId: "chess-universe-5a7cb",
      storageBucket: "chess-universe-5a7cb.firebasestorage.app",
      messagingSenderId: "145519167856",
      appId: "1:145519167856:web:bf124bc275895447fd27b5"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const myName = localStorage.getItem('chess_name') || 'Player';
    const myUID = localStorage.getItem('chess_game_uid') || '0000000000';
    const myFirebaseUid = localStorage.getItem('chess_firebase_uid') || '';
    const myCoins = parseInt(localStorage.getItem('chess_coins'), 10) || 350;

    document.getElementById('myUidText').innerText = myUID;
    document.getElementById('friendCoinsDisplay').innerText = myCoins;

    window.copyMyUid = () => {
      navigator.clipboard.writeText(myUID);
      alert("Game UID copied to clipboard: " + myUID);
    };

    // Load Local + Firestore Friends
    function getStoredFriends() {
      try {
        return JSON.parse(localStorage.getItem('chess_friends_cache') || '[]');
      } catch (e) {
        return [];
      }
    }

    function renderFriendsUI() {
      const list = getStoredFriends();
      const container = document.getElementById('friendsListContainer');
      document.getElementById('friendsCount').innerText = list.length;

      if (list.length === 0) {
        container.innerHTML = `<div class="text-center py-6 text-xs text-slate-500 font-medium">No friends added yet. Enter a 10-digit UID above!</div>`;
        return;
      }

      container.innerHTML = '';
      list.forEach((fr, idx) => {
        const item = document.createElement('div');
        item.className = "p-2.5 bg-slate-950 rounded-2xl border border-slate-800 flex items-center justify-between";
        item.innerHTML = `
          <div class="flex items-center gap-2.5">
            <div class="w-8 h-8 rounded-xl bg-slate-900 border border-slate-800 flex items-center justify-center text-emerald-400 font-bold text-xs">
              ${fr.name.charAt(0).toUpperCase()}
            </div>
            <div>
              <h4 class="text-xs font-black text-white leading-tight">${fr.name}</h4>
              <span class="text-[9px] font-mono text-slate-400">${fr.uid} • ${fr.rating || 1200} Elo</span>
            </div>
          </div>
          <button onclick="duelFriend('${fr.uid}', '${encodeURIComponent(fr.name)}', ${fr.rating || 1200})" class="px-3 py-1.5 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black rounded-xl text-[10px] uppercase tracking-wider transition">
            Duel ⚔️
          </button>
        `;
        container.appendChild(item);
      });
    }

    window.searchAndAddFriend = async () => {
      const uid = document.getElementById('inputFriendUid').value.trim();
      if (!uid || uid.length !== 10 || isNaN(uid)) {
        alert("Please enter a valid 10-digit Game UID!");
        return;
      }
      if (uid === myUID) {
        alert("You cannot add yourself as a friend!");
        return;
      }

      const btn = document.getElementById('btnFindFriend');
      btn.innerText = "...";
      btn.disabled = true;

      try {
        const uidDocRef = doc(db, "uids", uid);
        const uidSnap = await getDoc(uidDocRef);

        if (uidSnap.exists()) {
          const friendData = uidSnap.data();
          const newFriend = {
            name: friendData.name || "Player",
            uid: uid,
            rating: friendData.rating || 1200
          };

          let current = getStoredFriends();
          if (current.some(f => f.uid === uid)) {
            alert("This friend is already in your list!");
          } else {
            current.push(newFriend);
            localStorage.setItem('chess_friends_cache', JSON.stringify(current));

            if (myFirebaseUid) {
              try {
                await updateDoc(doc(db, "users", myFirebaseUid), {
                  friends: arrayUnion(uid)
                });
              } catch (e) {}
            }

            alert(`Added ${newFriend.name} to your friends!`);
            document.getElementById('inputFriendUid').value = '';
            renderFriendsUI();
          }
        } else {
          alert("No player found with UID: " + uid);
        }
      } catch (err) {
        console.error(err);
        alert("Search error: " + err.message);
      } finally {
        btn.innerText = "Add";
        btn.disabled = false;
      }
    };

    window.duelFriend = (uid, name, rating) => {
      window.location.href = `multiplayer.html?challengeUid=${uid}&name=${name}&elo=${rating}`;
    };

    renderFriendsUI();
  </script>
</body>
</html>
