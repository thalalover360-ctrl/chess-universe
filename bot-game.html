<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quick Practice Sandbox | Chess Universe</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
  <script src="script.js" defer></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-between p-4">

  <!-- Top Simple Nav -->
  <header class="w-full max-w-4xl flex items-center justify-between py-3 border-b border-slate-800">
    <div class="flex items-center gap-2">
      <span class="text-2xl text-emerald-400">♞</span>
      <h1 class="text-xl font-extrabold text-amber-400">AI PRACTICE SANDBOX</h1>
    </div>
    <div class="flex gap-2">
      <a href="bots.html" class="bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg text-xs font-semibold">Bots Lounge</a>
      <a href="index.html" class="bg-emerald-600 hover:bg-emerald-500 px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-950">Lobby</a>
    </div>
  </header>

  <!-- Sandbox Main Arena -->
  <main class="w-full max-w-md my-auto flex flex-col items-center gap-4">
    <!-- Status & Selector -->
    <div class="w-full flex justify-between items-center bg-slate-900 border border-slate-800 p-3 rounded-xl">
      <span id="sandboxStatus" class="text-xs font-bold text-emerald-400">Your Turn (White)</span>
      <select id="sandboxDifficulty" class="bg-slate-800 text-xs px-2 py-1 rounded border border-slate-700 focus:outline-none">
        <option value="easy">Easy (Bob)</option>
        <option value="medium" selected>Medium (Tactician)</option>
        <option value="hard">Hard (Supremo360)</option>
      </select>
    </div>

    <!-- Board -->
    <div id="sandboxBoard" class="chessboard-box"></div>

    <!-- Quick Tools -->
    <div class="w-full grid grid-cols-2 gap-3">
      <button id="btnUndo" class="btn-secondary py-2.5 rounded-xl text-xs font-bold">↺ Undo Move</button>
      <button id="btnReset" class="btn-primary py-2.5 rounded-xl text-xs font-bold">↻ New Board</button>
    </div>
  </main>

  <footer class="text-xs text-slate-500 py-2">
    Chess Universe • Instant Offline Sandbox
  </footer>

  <script>
    const game = new Chess();
    const boardEl = $('#sandboxBoard');

    function onDragStart(source, piece) {
      if (game.game_over()) return false;
      if (piece.search(/^b/) !== -1) return false; // Player is white
    }

    function makeAIMove() {
      if (game.game_over()) return;
      const moves = game.moves({ verbose: true });
      if (moves.length === 0) return;

      const diff = document.getElementById('sandboxDifficulty').value;
      let move = null;

      if (diff === 'easy') {
        move = moves[Math.floor(Math.random() * moves.length)];
      } else if (diff === 'medium') {
        const captures = moves.filter(m => m.captured);
        move = captures.length ? captures[0] : moves[Math.floor(Math.random() * moves.length)];
      } else {
        // Hard
        moves.sort((a, b) => (b.captured ? 10 : 0) - (a.captured ? 10 : 0));
        move = moves[0];
      }

      game.move(move);
      board.position(game.fen());
      updateStatus();
    }

    function onDrop(source, target) {
      const move = game.move({
        from: source,
        to: target,
        promotion: 'q'
      });
      if (move === null) return 'snapback';

      updateStatus();
      setTimeout(makeAIMove, 300);
    }

    function updateStatus() {
      const st = document.getElementById('sandboxStatus');
      if (game.in_checkmate()) st.innerText = "Checkmate!";
      else if (game.in_draw()) st.innerText = "Draw!";
      else if (game.in_check()) st.innerText = "Check!";
      else st.innerText = game.turn() === 'w' ? "Your Turn (White)" : "Bot Thinking...";
    }

    const board = Chessboard('sandboxBoard', {
      draggable: true,
      position: 'start',
      pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png',
      onDragStart: onDragStart,
      onDrop: onDrop,
      onSnapEnd: () => board.position(game.fen())
    });

    $(window).resize(board.resize);

    document.getElementById('btnUndo').onclick = () => {
      game.undo(); // Undo AI
      game.undo(); // Undo User
      board.position(game.fen());
      updateStatus();
    };

    document.getElementById('btnReset').onclick = () => {
      game.reset();
      board.start();
      updateStatus();
    };
  </script>
</body>
</html>
