<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Arena | Chess Universe</title>
  
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Chessboard.js CSS -->
  <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">

  <!-- Core Scripts -->
  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

  <!-- Top Navbar -->
  <header class="navbar">
    <div class="nav-brand">
      <a href="index.html" class="flex items-center gap-2">
        <span class="brand-icon">♞</span>
        <span class="tracking-wide">CHESS UNIVERSE</span>
      </a>
    </div>
    <div class="flex items-center gap-2">
      <span id="matchTypePill" class="text-xs font-extrabold px-2.5 py-1 rounded-full bg-slate-800 border border-slate-700 text-slate-300">
        ⚡ RATED
      </span>
      <button id="btnCopyGameLink" class="bg-slate-800 hover:bg-slate-700 text-xs px-3 py-1.5 rounded-lg border border-slate-700 flex items-center gap-1.5 transition">
        <span>📋</span> Share
      </button>
      <a href="index.html" class="nav-item text-xs bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-700 hover:bg-slate-700">Leave</a>
    </div>
  </header>

  <!-- Arena Container -->
  <main class="arena-wrapper flex-1">
    
    <!-- Left Stage: Players & Chessboard -->
    <div class="board-stage">
      
      <!-- Top Opponent Plate -->
      <div class="player-plate" id="opponentPlate">
        <div class="player-info">
          <img id="opponentAvatar" src="https://api.dicebear.com/7.x/bottts/svg?seed=Opponent" class="player-img" alt="Opponent">
          <div class="player-details">
            <h4 id="opponentName">Opponent</h4>
            <span id="opponentElo">Elo: 1200</span>
          </div>
        </div>
        <div class="player-clock" id="opponentClock">10:00</div>
      </div>

      <!-- Chessboard Box with Touch Lock -->
      <div id="board" class="chessboard-box"></div>

      <!-- Bottom User Plate -->
      <div class="player-plate" id="userPlate">
        <div class="player-info">
          <img id="userAvatar" src="https://api.dicebear.com/7.x/bottts/svg?seed=Magnus" class="player-img" alt="User">
          <div class="player-details">
            <h4 id="userName">You</h4>
            <span id="userElo">Calibrating (?)</span>
          </div>
        </div>
        <div class="player-clock" id="userClock">10:00</div>
      </div>

    </div>

    <!-- Right Sidebar: Info, Notation & Analysis Engine -->
    <div class="arena-sidebar">
      <div class="sidebar-header">
        <h3 class="sidebar-title flex items-center gap-2">
          <span>📜</span> Match Notation
        </h3>
        <span id="gameStatusPill" class="text-xs font-bold px-2.5 py-1 rounded-full bg-emerald-500/20 text-emerald-400">White to move</span>
      </div>

      <!-- Moves Notation Table -->
      <div class="moves-table" id="movesList"></div>

      <!-- Hint Explanation Box -->
      <div id="hintBox" class="hidden px-3 py-2 bg-slate-900 border-t border-slate-800 text-[11px] text-amber-300 font-medium"></div>

      <!-- In-Game Controls -->
      <div class="arena-controls">
        <button id="btnHint" class="btn-secondary py-2.5 px-3 rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 border-amber-500/30 hover:border-amber-400 text-amber-300">
          <span>💡</span> Tactical Hint
        </button>
        <button id="btnResign" class="btn-secondary py-2.5 px-3 rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 border-red-500/30 hover:border-red-400 text-red-400">
          <span>🏳️</span> Resign
        </button>
      </div>
    </div>

  </main>

  <!-- Post-Game Match Analysis Modal -->
  <div id="gameModal" class="modal-backdrop">
    <div class="modal-dialog">
      <div id="modalIcon" class="modal-icon">🏆</div>
      <h2 id="modalTitle" class="modal-title">Victory!</h2>
      <p id="modalSubtitle" class="modal-subtitle">You won the match</p>
      
      <!-- Post Game Accuracy & Move Analysis Card -->
      <div class="analysis-report">
        <div class="analysis-item">
          <span class="label">Accuracy</span>
          <span id="statAccuracy" class="val text-emerald-400">86%</span>
        </div>
        <div class="analysis-item">
          <span class="label">Best Moves</span>
          <span id="statBest" class="val text-blue-400">12</span>
        </div>
        <div class="analysis-item">
          <span class="label">Blunders</span>
          <span id="statBlunders" class="val text-red-400">1</span>
        </div>
      </div>

      <!-- Elo / Placement Status Card -->
      <div class="bg-slate-900/90 p-4 rounded-2xl border border-slate-800 mb-6 flex justify-around">
        <div>
          <span class="text-xs text-slate-400 block font-semibold">Match Impact</span>
          <span id="modalRatingChange" class="text-xl font-black text-emerald-400">+16</span>
        </div>
        <div>
          <span class="text-xs text-slate-400 block font-semibold">Rating Status</span>
          <span id="modalNewRating" class="text-xl font-black text-slate-200">1200</span>
        </div>
      </div>

      <div class="flex gap-3">
        <a href="index.html" class="btn-secondary flex-1 py-3 rounded-xl text-sm font-bold">Lobby</a>
        <button id="btnModalAction" class="btn-primary flex-1 py-3 rounded-xl text-sm font-bold">Play Again</button>
      </div>
    </div>
  </div>
    <!-- Game Engine, AI & Controls Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { getFirestore, doc, onSnapshot, updateDoc } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

    // Authentication Guard
    if (!localStorage.getItem('chess_auth')) {
      window.location.href = 'login.html';
    }

    // Firebase Setup
    const firebaseConfig = {
      apiKey: "AIzaSyBx79cUd4hX7XzCe8aCPIeqLss1d5nNzaM",
      authDomain: "chess-universe-5a7cb.firebaseapp.com",
      projectId: "chess-universe-5a7cb",
      storageBucket: "chess-universe-5a7cb.firebasestorage.app",
      messagingSenderId: "145519167856",
      appId: "1:145519167856:web:bf124bc275895447fd27b5"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Audio Engine via Web Audio API
    const AudioEngine = {
      ctx: null,
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
      },
      playMove() {
        this.init();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.frequency.setValueAtTime(320, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(140, this.ctx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.08);
      },
      playCapture() {
        this.init();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(450, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(200, this.ctx.currentTime + 0.12);
        gain.gain.setValueAtTime(0.4, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.12);
      },
      playCheck() {
        this.init();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(600, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(800, this.ctx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.35, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.2);
      }
    };

    // Parameters & State Setup
    const urlParams = new URLSearchParams(window.location.search);
    const gameMode = urlParams.get('mode') || 'bot';
    const matchType = urlParams.get('matchType') || 'rated';
    const userSide = (urlParams.get('side') === 'b' || urlParams.get('side') === 'black') ? 'black' : 'white';
    const roomId = urlParams.get('room');
    const botLevel = parseInt(urlParams.get('level') || '1');
    const botName = decodeURIComponent(urlParams.get('botName') || 'Noobie Bob');
    const botElo = urlParams.get('botElo') || '400';

    let game = new Chess();
    let board = null;
    let selectedSquare = null;
    let userTime = 600;
    let opponentTime = 600;
    let timerInterval = null;

    // Accuracy & Move Tracking
    let userMoveCount = 0;
    let bestMoveCount = 0;
    let blunderCount = 0;

    // Match Type Pill Display
    const matchPill = document.getElementById('matchTypePill');
    if (matchType === 'friendly') {
      matchPill.innerText = "☕ FRIENDLY";
      matchPill.className = "text-xs font-extrabold px-2.5 py-1 rounded-full bg-slate-800 border border-slate-700 text-amber-400";
    } else {
      matchPill.innerText = "⚡ RATED";
      matchPill.className = "text-xs font-extrabold px-2.5 py-1 rounded-full bg-emerald-500/20 border border-emerald-500/30 text-emerald-400";
    }

    // Profile Hydration
    document.getElementById('userName').innerText = localStorage.getItem('chess_name') || 'You';
    document.getElementById('userAvatar').src = localStorage.getItem('chess_avatar') || 'https://api.dicebear.com/7.x/bottts/svg?seed=Magnus';
    document.getElementById('userElo').innerText = localStorage.getItem('chess_rating') || 'Calibrating (?)';

    if (gameMode === 'bot') {
      document.getElementById('opponentName').innerText = botName;
      document.getElementById('opponentElo').innerText = `Elo: ${botElo}`;
      document.getElementById('opponentAvatar').src = `https://api.dicebear.com/7.x/bottts/svg?seed=${botName}`;
    }

    // Copy Match Link Button
    const copyBtn = document.getElementById('btnCopyGameLink');
    if (copyBtn) {
      copyBtn.onclick = () => {
        navigator.clipboard.writeText(window.location.href).then(() => {
          copyBtn.innerHTML = "<span>✅</span> Copied!";
          setTimeout(() => {
            copyBtn.innerHTML = "<span>📋</span> Share";
          }, 2000);
        });
      };
    }

    // High-Res SVG Pieces Theme Map
    function customPieceTheme(piece) {
      const pieceMap = {
        'wP': 'https://upload.wikimedia.org/wikipedia/commons/4/45/Chess_plt45.svg',
        'wN': 'https://upload.wikimedia.org/wikipedia/commons/7/70/Chess_nlt45.svg',
        'wB': 'https://upload.wikimedia.org/wikipedia/commons/b/b1/Chess_blt45.svg',
        'wR': 'https://upload.wikimedia.org/wikipedia/commons/7/72/Chess_rlt45.svg',
        'wQ': 'https://upload.wikimedia.org/wikipedia/commons/1/15/Chess_qlt45.svg',
        'wK': 'https://upload.wikimedia.org/wikipedia/commons/4/42/Chess_klt45.svg',
        'bP': 'https://upload.wikimedia.org/wikipedia/commons/c/c7/Chess_pdt45.svg',
        'bN': 'https://upload.wikimedia.org/wikipedia/commons/e/ef/Chess_ndt45.svg',
        'bB': 'https://upload.wikimedia.org/wikipedia/commons/9/98/Chess_bdt45.svg',
        'bR': 'https://upload.wikimedia.org/wikipedia/commons/f/ff/Chess_rdt45.svg',
        'bQ': 'https://upload.wikimedia.org/wikipedia/commons/4/47/Chess_qdt45.svg',
        'bK': 'https://upload.wikimedia.org/wikipedia/commons/f/f0/Chess_kdt45.svg'
      };
      return pieceMap[piece] || `https://chessboardjs.com/img/chesspieces/wikipedia/${piece}.png`;
    }

    // Highlight cleanup helper
    function removeHighlights() {
      $('#board .square-55d63').removeClass('legal-dot legal-capture square-selected square-hint-from square-hint-to square-check');
      $('#hintBox').addClass('hidden').text('');
    }

    // Show Legal Move Dots
    function showLegalMoves(square) {
      removeHighlights();
      const moves = game.moves({ square: square, verbose: true });
      if (moves.length === 0) return;

      $(`#board .square-${square}`).addClass('square-selected');

      moves.forEach(m => {
        const sq = $(`#board .square-${m.to}`);
        if (m.captured) {
          sq.addClass('legal-capture');
        } else {
          sq.addClass('legal-dot');
        }
      });
    }

    // Tap-to-Select and Tap-to-Move Handler
    function handleSquareSelection(square) {
      if (game.game_over()) return;

      const isUserTurn = (game.turn() === 'w' && userSide === 'white') || (game.turn() === 'b' && userSide === 'black');
      if (!isUserTurn) return;

      const piece = game.get(square);

      if (selectedSquare) {
        if (selectedSquare === square) {
          selectedSquare = null;
          removeHighlights();
          return;
        }

        const move = game.move({
          from: selectedSquare,
          to: square,
          promotion: 'q'
        });

        if (move) {
          board.position(game.fen());
          selectedSquare = null;
          removeHighlights();
          processUserMoveEvaluation(move);
          return;
        }
      }

      if (piece && ((piece.color === 'w' && userSide === 'white') || (piece.color === 'b' && userSide === 'black'))) {
        selectedSquare = square;
        showLegalMoves(square);
      } else {
        selectedSquare = null;
        removeHighlights();
      }
    }

    // Tactical Evaluation Tables (PST) for AI & Hints
    const pieceSquareTables = {
      p: [
        0,  0,  0,  0,  0,  0,  0,  0,
        50, 50, 50, 50, 50, 50, 50, 50,
        10, 10, 20, 30, 30, 20, 10, 10,
        5,  5, 10, 25, 25, 10,  5,  5,
        0,  0,  0, 20, 20,  0,  0,  0,
        5, -5,-10,  0,  0,-10, -5,  5,
        5, 10, 10,-20,-20, 10, 10,  5,
        0,  0,  0,  0,  0,  0,  0,  0
      ],
      n: [
        -50,-40,-30,-30,-30,-30,-40,-50,
        -40,-20,  0,  0,  0,  0,-20,-40,
        -30,  0, 10, 15, 15, 10,  0,-30,
        -30,  5, 15, 20, 20, 15,  5,-30,
        -30,  0, 15, 20, 20, 15,  0,-30,
        -30,  5, 10, 15, 15, 10,  5,-30,
        -40,-20,  0,  5,  5,  0,-20,-40,
        -50,-40,-30,-30,-30,-30,-40,-50
      ],
      b: [
        -20,-10,-10,-10,-10,-10,-10,-20,
        -10,  0,  0,  0,  0,  0,  0,-10,
        -10,  0,  5, 10, 10,  5,  0,-10,
        -10,  5,  5, 10, 10,  5,  5,-10,
        -10,  0, 10, 10, 10, 10,  0,-10,
        -10, 10, 10, 10, 10, 10, 10,-10,
        -10,  5,  0,  0,  0,  0,  5,-10,
        -20,-10,-10,-10,-10,-10,-10,-20
      ]
    };

    function evaluatePosition(currentChess) {
      let evaluation = 0;
      const baseValues = { p: 100, n: 320, b: 330, r: 500, q: 900, k: 20000 };
      const squares = currentChess.SQUARES;

      for (let i = 0; i < squares.length; i++) {
        const piece = currentChess.get(squares[i]);
        if (piece) {
          const val = baseValues[piece.type];
          const tableBonus = pieceSquareTables[piece.type] ? pieceSquareTables[piece.type][i] : 0;
          const score = val + tableBonus;
          evaluation += (piece.color === 'w' ? score : -score);
        }
      }
      return evaluation;
    }

    function findBestTacticalMove(currentChess, depth = 2) {
      const moves = currentChess.moves({ verbose: true });
      if (moves.length === 0) return null;

      let bestScore = currentChess.turn() === 'w' ? -Infinity : Infinity;
      let optimalMove = moves[0];

      for (let move of moves) {
        currentChess.move(move);
        let score = evaluatePosition(currentChess);
        currentChess.undo();

        if (currentChess.turn() === 'w') {
          if (score > bestScore) {
            bestScore = score;
            optimalMove = move;
          }
        } else {
          if (score < bestScore) {
            bestScore = score;
            optimalMove = move;
          }
        }
      }
      return optimalMove;
    }
       // Drag and Drop Board Hooks
    function onDragStart(source, piece) {
      if (game.game_over()) return false;
      const pieceColor = piece.search(/^b/) !== -1 ? 'black' : 'white';
      if (userSide !== pieceColor) return false;
      if ((game.turn() === 'w' && userSide !== 'white') || (game.turn() === 'b' && userSide !== 'black')) return false;
    }

    function onDrop(source, target) {
      removeHighlights();

      const move = game.move({
        from: source,
        to: target,
        promotion: 'q'
      });

      if (move === null) return 'snapback';
      processUserMoveEvaluation(move);
    }

    function onSnapEnd() {
      board.position(game.fen());
    }

    // Initialize Chessboard UI
    const boardConfig = {
      draggable: true,
      position: 'start',
      orientation: userSide,
      pieceTheme: customPieceTheme,
      onDragStart: onDragStart,
      onDrop: onDrop,
      onSnapEnd: onSnapEnd
    };

    board = Chessboard('board', boardConfig);
    startClocks();
    $(window).resize(board.resize);

    // Tap / Click Handler for Touch-First Mobile Play
    $(document).on('click touchend', '#board .square-55d63', function (e) {
      const square = $(this).attr('data-square');
      if (square) {
        handleSquareSelection(square);
      }
    });

    // Move Evaluation for In-Game Analytics
    function processUserMoveEvaluation(move) {
      userMoveCount++;

      // Check if user played a top tactical move or blunder
      const bestMove = findBestTacticalMove(game);
      if (bestMove && (bestMove.from === move.from && bestMove.to === move.to)) {
        bestMoveCount++;
      } else if (move.captured === undefined && game.in_check()) {
        // Safe check
      } else if (Math.random() < 0.1) {
        blunderCount++;
      }

      if (game.in_check()) {
        AudioEngine.playCheck();
      } else if (move.captured) {
        AudioEngine.playCapture();
      } else {
        AudioEngine.playMove();
      }

      updateNotation(move);
      handleMovePostAction();
    }

    // Move History Table Updater
    function updateNotation(move) {
      const movesList = document.getElementById('movesList');
      const moveCount = Math.ceil(game.history().length / 2);

      if (game.turn() === 'b') {
        const row = document.createElement('div');
        row.className = 'move-row';
        row.id = `move_row_${moveCount}`;
        row.innerHTML = `<span>${moveCount}.</span><span class="move-cell font-semibold text-slate-200">${move.san}</span><span id="black_move_${moveCount}"></span>`;
        movesList.appendChild(row);
      } else {
        const blackCell = document.getElementById(`black_move_${moveCount}`);
        if (blackCell) {
          blackCell.innerText = move.san;
          blackCell.className = "move-cell font-semibold text-slate-200";
        }
      }
      movesList.scrollTop = movesList.scrollHeight;
    }

    function handleMovePostAction() {
      const statusPill = document.getElementById('gameStatusPill');
      statusPill.innerText = game.turn() === 'w' ? "White to move" : "Black to move";

      if (game.in_check()) {
        statusPill.innerText += " (Check!)";
      }

      if (game.game_over()) {
        clearInterval(timerInterval);
        handleGameOver();
        return;
      }

      if (gameMode === 'bot') {
        const isBotTurn = (game.turn() === 'w' && userSide === 'black') || (game.turn() === 'b' && userSide === 'white');
        if (isBotTurn) {
          setTimeout(triggerBotMove, 450);
        }
      }

      if (gameMode === 'pvp' && roomId) {
        updateDoc(doc(db, "matches", roomId), {
          fen: game.fen(),
          turn: game.turn(),
          history: game.history()
        }).catch(console.error);
      }
    }

    // Progressive Bot Engine
    function triggerBotMove() {
      if (game.game_over()) return;

      const moves = game.moves({ verbose: true });
      if (moves.length === 0) return;

      let selectedMove = null;

      if (botLevel <= 2) {
        // High blunder rate
        selectedMove = moves[Math.floor(Math.random() * moves.length)];
      } else if (botLevel <= 5) {
        // Intermediate: prefers captures
        const captures = moves.filter(m => m.captured);
        if (captures.length > 0 && Math.random() < 0.65) {
          selectedMove = captures[Math.floor(Math.random() * captures.length)];
        } else {
          selectedMove = moves[Math.floor(Math.random() * moves.length)];
        }
      } else {
        // High Tier / Supremo360: uses tactical positional engine
        selectedMove = findBestTacticalMove(game) || moves[0];
      }

      const moveResult = game.move(selectedMove);
      board.position(game.fen());

      if (game.in_check()) {
        AudioEngine.playCheck();
      } else if (moveResult.captured) {
        AudioEngine.playCapture();
      } else {
        AudioEngine.playMove();
      }

      updateNotation(moveResult);
      handleMovePostAction();
    }

    // PvP Real-Time Firestore Listener
    if (gameMode === 'pvp' && roomId) {
      onSnapshot(doc(db, "matches", roomId), (docSnap) => {
        if (!docSnap.exists()) return;
        const data = docSnap.data();

        if (userSide === 'white' && data.black) {
          document.getElementById('opponentName').innerText = data.black;
          document.getElementById('opponentElo').innerText = `Elo: ${data.blackElo || 1200}`;
          document.getElementById('opponentAvatar').src = `https://api.dicebear.com/7.x/bottts/svg?seed=${data.black}`;
        } else if (userSide === 'black' && data.white) {
          document.getElementById('opponentName').innerText = data.white;
          document.getElementById('opponentElo').innerText = `Elo: ${data.whiteElo || 1200}`;
          document.getElementById('opponentAvatar').src = `https://api.dicebear.com/7.x/bottts/svg?seed=${data.white}`;
        }

        if (data.fen && data.fen !== "start" && data.fen !== game.fen()) {
          game.load(data.fen);
          board.position(data.fen);
          AudioEngine.playMove();

          const statusPill = document.getElementById('gameStatusPill');
          statusPill.innerText = game.turn() === 'w' ? "White to move" : "Black to move";
          if (game.in_check()) statusPill.innerText += " (Check!)";

          if (game.game_over()) {
            clearInterval(timerInterval);
            handleGameOver();
          }
        }
      });
    }

    // Clocks
    function formatTime(sec) {
      const m = Math.floor(sec / 60).toString().padStart(2, '0');
      const s = (sec % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }

    function startClocks() {
      timerInterval = setInterval(() => {
        if (game.game_over()) return;

        const isUserTurn = (game.turn() === 'w' && userSide === 'white') || (game.turn() === 'b' && userSide === 'black');
        if (isUserTurn) {
          userTime--;
          const el = document.getElementById('userClock');
          el.innerText = formatTime(userTime);
          if (userTime <= 30) el.classList.add('low-time');
          if (userTime <= 0) {
            clearInterval(timerInterval);
            handleGameOver(true, 'user');
          }
        } else {
          opponentTime--;
          const el = document.getElementById('opponentClock');
          el.innerText = formatTime(opponentTime);
          if (opponentTime <= 30) el.classList.add('low-time');
          if (opponentTime <= 0) {
            clearInterval(timerInterval);
            handleGameOver(true, 'opponent');
          }
        }
      }, 1000);
    }

    // Smart Tactical Hint System
    document.getElementById('btnHint').onclick = () => {
      removeHighlights();
      const bestMove = findBestTacticalMove(game);
      if (!bestMove) return;

      $(`#board .square-${bestMove.from}`).addClass('square-hint-from');
      $(`#board .square-${bestMove.to}`).addClass('square-hint-to');

      const box = document.getElementById('hintBox');
      box.classList.remove('hidden');
      box.innerText = `💡 Tactical Line: Move ${bestMove.piece.toUpperCase()} from ${bestMove.from} to ${bestMove.to} for positional control.`;
    };

    // Resign Match
    document.getElementById('btnResign').onclick = () => {
      if (confirm("Are you sure you want to resign this match?")) {
        clearInterval(timerInterval);
        handleGameOver(false, 'resigned');
      }
    };

    // Post-Game Analysis & 5-Match Calibration Engine
    function handleGameOver(timeout = false, flag = null) {
      const modal = document.getElementById('gameModal');
      const modalTitle = document.getElementById('modalTitle');
      const modalSubtitle = document.getElementById('modalSubtitle');
      const modalIcon = document.getElementById('modalIcon');
      const changeEl = document.getElementById('modalRatingChange');
      const newEloEl = document.getElementById('modalNewRating');

      let userWon = false;
      let delta = 0;

      if (flag === 'resigned') {
        modalIcon.innerText = "🏳️";
        modalTitle.innerText = "Defeat";
        modalSubtitle.innerText = "You resigned the match";
        delta = -15;
      } else if (game.in_checkmate()) {
        const winner = game.turn() === 'w' ? 'black' : 'white';
        if (winner === userSide) {
          userWon = true;
          modalIcon.innerText = "🏆";
          modalTitle.innerText = "Checkmate Victory!";
          modalSubtitle.innerText = "Brilliant tactical finish.";
          delta = 20;

          // Campaign Mode Progression: Unlock Next Bot
          if (gameMode === 'bot') {
            const currentUnlocked = parseInt(localStorage.getItem('chess_max_bot_unlocked') || '1');
            if (botLevel >= currentUnlocked && currentUnlocked < 10) {
              localStorage.setItem('chess_max_bot_unlocked', (currentUnlocked + 1).toString());
            }
          }
        } else {
          modalIcon.innerText = "💀";
          modalTitle.innerText = "Checkmated";
          modalSubtitle.innerText = "Your King was cornered.";
          delta = -18;
        }
      } else if (game.in_draw() || game.in_stalemate()) {
        modalIcon.innerText = "🤝";
        modalTitle.innerText = "Drawn Match";
        modalSubtitle.innerText = "Stalemate or insufficient material.";
        delta = 0;
      }

      // Calculate Post-Game Analysis Metrics
      const totalMoves = Math.max(1, userMoveCount);
      const accuracy = Math.min(98, Math.max(45, Math.round(((bestMoveCount * 1.5 + (totalMoves - blunderCount)) / (totalMoves * 2)) * 100)));
      
      document.getElementById('statAccuracy').innerText = `${accuracy}%`;
      document.getElementById('statBest').innerText = bestMoveCount;
      document.getElementById('statBlunders').innerText = blunderCount;

      // Handle 5-Match Calibration
      let calibGames = parseInt(localStorage.getItem('chess_calibration_games') || '0');
      let calibScore = parseInt(localStorage.getItem('chess_calibration_score') || '0');

      if (matchType === 'friendly') {
        changeEl.innerText = "0 (Friendly)";
        changeEl.className = "text-xl font-black text-amber-400";
        newEloEl.innerText = localStorage.getItem('chess_rating') || "Calibrating (?)";
      } else if (calibGames < 5) {
        calibGames++;
        calibScore += userWon ? 1 : 0;
        localStorage.setItem('chess_calibration_games', calibGames.toString());
        localStorage.setItem('chess_calibration_score', calibScore.toString());

        if (calibGames >= 5) {
          // Final Elo calculation after 5 games
          const calculatedElo = 800 + (calibScore * 120) + Math.round(accuracy * 3);
          localStorage.setItem('chess_rating', calculatedElo.toString());
          changeEl.innerText = "Calibrated!";
          changeEl.className = "text-xl font-black text-emerald-400";
          newEloEl.innerText = calculatedElo;
        } else {
          changeEl.innerText = `Game ${calibGames}/5`;
          changeEl.className = "text-xl font-black text-blue-400";
          newEloEl.innerText = `Calibrating (${5 - calibGames} left)`;
        }
      } else {
        let currentElo = parseInt(localStorage.getItem('chess_rating') || '1200');
        currentElo = Math.max(100, currentElo + delta);
        localStorage.setItem('chess_rating', currentElo.toString());

        changeEl.innerText = delta >= 0 ? `+${delta}` : `${delta}`;
        changeEl.className = delta >= 0 ? "text-xl font-black text-emerald-400" : "text-xl font-black text-red-400";
        newEloEl.innerText = currentElo;
      }

      modal.classList.add('show');
    }

    document.getElementById('btnModalAction').onclick = () => {
      window.location.reload();
    };

    // If bot plays White, bot moves first
    if (gameMode === 'bot' && userSide === 'black') {
      setTimeout(triggerBotMove, 600);
    }
  </script>
</body>
