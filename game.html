<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chess Universe | Play</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 16px;
  background: #0b1019;
  color: #f4f7ff;
  font-family: Arial, sans-serif;
}

header {
  max-width: 900px;
  margin: 0 auto 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
}

h1 {
  font-size: clamp(20px, 5vw, 30px);
  margin: 0;
}

a {
  color: #66f5c7;
  text-decoration: none;
}

.app {
  max-width: 900px;
  margin: auto;
  display: grid;
  grid-template-columns: minmax(0, 1.5fr) minmax(210px, .8fr);
  gap: 18px;
  align-items: start;
}

#board {
  display: grid;
  grid-template-columns: repeat(8, minmax(0, 1fr));
  width: 100%;
  aspect-ratio: 1;
  border: 4px solid #263348;
  border-radius: 5px;
  overflow: hidden;
}

.sq {
  min-width: 0;
  min-height: 0;
  border: 0;
  padding: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  position: relative;
  aspect-ratio: 1;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.light {
  background: #e8edf2;
}

.dark {
  background: #71945a;
}

.sq.selected {
  box-shadow: inset 0 0 0 4px #ffd166;
}

.sq.legal::after {
  content: "";
  position: absolute;
  width: 24%;
  height: 24%;
  border-radius: 50%;
  background: #17223566;
}

.sq.capture::after {
  content: "";
  position: absolute;
  inset: 4%;
  border: 4px solid #e45c5c;
  border-radius: 50%;
  background: transparent;
}

.piece {
  position: relative;
  z-index: 1;
  display: block;
  font-family: "DejaVu Sans", "Segoe UI Symbol",
               "Noto Sans Symbols 2", "Arial Unicode MS",
               sans-serif;
  font-size: clamp(25px, 6.5vw, 58px);
  line-height: 1;
  pointer-events: none;
  user-select: none;
}

.white {
  color: #fff;
  -webkit-text-stroke: 1px #20232b;
  text-shadow: 0 1px 2px #20232b;
}

.black {
  color: #20232b;
  text-shadow: 0 1px 1px #fff4;
}

.panel {
  background: #151e2b;
  border: 1px solid #2a374a;
  border-radius: 14px;
  padding: 17px;
  min-width: 0;
}

#status {
  font-weight: bold;
  font-size: 19px;
  margin: 0 0 8px;
}

#message {
  font-size: 13px;
  color: #aebbd0;
  line-height: 1.5;
  min-height: 38px;
}

.controls {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-top: 14px;
}

button.action {
  background: #26354a;
  color: #fff;
  border: 0;
  border-radius: 8px;
  padding: 12px 8px;
  cursor: pointer;
  font-weight: bold;
}

button.action.primary {
  background: #66f5c7;
  color: #0b1713;
}

button.action:active {
  transform: scale(.98);
}

h2 {
  font-size: 13px;
  color: #aebbd0;
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-top: 22px;
}

#history {
  font: 13px/1.8 monospace;
  overflow-wrap: anywhere;
  max-height: 180px;
  overflow: auto;
}

.small {
  color: #8292a8;
  font-size: 11px;
  line-height: 1.6;
  margin-top: 18px;
}

@media (max-width: 650px) {
  body {
    padding: 12px;
  }

  .app {
    grid-template-columns: minmax(0, 1fr);
    gap: 14px;
  }

  .panel {
    padding: 14px;
  }

  .piece {
    font-size: clamp(27px, 10vw, 55px);
  }

  header {
    margin-bottom: 14px;
  }
}
</style>
</head>

<body>

<header>
  <h1>♟ Chess Universe</h1>
  <a href="index.html">← Home</a>
</header>

<main class="app">

  <div id="board" aria-label="Chess board"></div>

  <section class="panel">

    <p id="status">Loading chess engine...</p>
    <p id="message">Preparing your battlefield...</p>

    <div class="controls">
      <button class="action primary" id="new">New Game</button>
      <button class="action" id="undo">Undo Move</button>
      <button class="action" id="flip">Flip Board</button>
    </div>

    <h2>Move History</h2>
    <div id="history">No moves yet.</div>

    <p class="small">
      Chess Universe · Local two-player chess.
      Online multiplayer will be added separately.
    </p>

  </section>
</main>

<script>
const board = document.getElementById("board");
const statusBox = document.getElementById("status");
const messageBox = document.getElementById("message");
const historyBox = document.getElementById("history");

const icons = {
  w: {
    k: "♔",
    q: "♕",
    r: "♖",
    b: "♗",
    n: "♘",
    p: "♙"
  },
  b: {
    k: "♚",
    q: "♛",
    r: "♜",
    b: "♝",
    n: "♞",
    p: "♟"
  }
};

let game = null;
let selected = null;
let legal = [];
let flipped = false;
let engineReady = false;

function loadChessEngine(urls, index = 0) {
  if (typeof window.Chess === "function") {
    initializeGame();
    return;
  }

  if (index >= urls.length) {
    statusBox.textContent = "Chess engine failed to load";
    messageBox.textContent =
      "Internet connection may be unavailable. Refresh the page and try again.";
    return;
  }

  statusBox.textContent = "Loading chess engine...";
  messageBox.textContent =
    "Connecting to chess engine (" + (index + 1) + "/" + urls.length + ")";

  const script = document.createElement("script");
  script.src = urls[index];
  script.async = true;

  script.onload = function () {
    if (typeof window.Chess === "function") {
      initializeGame();
    } else {
      script.remove();
      loadChessEngine(urls, index + 1);
    }
  };

  script.onerror = function () {
    script.remove();
    loadChessEngine(urls, index + 1);
  };

  document.head.appendChild(script);
}

function initializeGame() {
  if (engineReady) return;

  try {
    game = new window.Chess();
    engineReady = true;
    startGame();
  } catch (error) {
    statusBox.textContent = "Could not start chess";
    messageBox.textContent = "Please refresh the page and try again.";
  }
}

function startGame() {
  if (!engineReady) return;

  game.reset();
  selected = null;
  legal = [];
  flipped = false;
  render();
}

function getSquares() {
  let files = ["a","b","c","d","e","f","g","h"];
  let ranks = [8,7,6,5,4,3,2,1];

  if (flipped) {
    files = files.slice().reverse();
    ranks = ranks.slice().reverse();
  }

  return ranks.flatMap(rank =>
    files.map(file => file + rank)
  );
}

function render() {
  if (!game) return;

  board.innerHTML = "";

  const squares = getSquares();

  squares.forEach((square, index) => {
    const piece = game.get(square);
    const cell = document.createElement("button");

    cell.type = "button";
    cell.className = "sq " +
      ((Math.floor(index / 8) + index % 8) % 2 === 0
        ? "light"
        : "dark");

    cell.setAttribute("aria-label", square);

    if (selected === square) {
      cell.classList.add("selected");
    }

    if (legal.some(move => move.to === square)) {
      cell.classList.add("legal");

      if (piece) {
        cell.classList.add("capture");
      }
    }

    if (piece) {
      const span = document.createElement("span");

      span.className =
        "piece " + (piece.color === "w" ? "white" : "black");

      span.textContent = icons[piece.color][piece.type];
      cell.appendChild(span);
    }

    cell.addEventListener("click", () => choose(square));
    board.appendChild(cell);
  });

  updateStatus();
  updateHistory();
}

function updateStatus() {
  const turn = game.turn() === "w" ? "White" : "Black";

  if (game.isCheckmate()) {
    statusBox.textContent = "Checkmate!";
    messageBox.textContent =
      (game.turn() === "w" ? "Black" : "White") + " wins!";
  } else if (game.isDraw()) {
    statusBox.textContent = "Draw!";
    messageBox.textContent = "The game has ended in a draw.";
  } else {
    statusBox.textContent = turn + " to move";
    messageBox.textContent = game.isCheck()
      ? "Check! Find a legal move."
      : "Select a piece, then select a highlighted square.";
  }
}

function updateHistory() {
  const moves = game.history();

  historyBox.textContent = moves.length
    ? moves.map((move, i) =>
        (i % 2 === 0 ? (Math.floor(i / 2) + 1) + ". " : "") + move
      ).join(" ")
    : "No moves yet.";
}

function choose(square) {
  if (!game || game.game_over()) return;

  if (selected && legal.some(move => move.to === square)) {
    const move = game.move({
      from: selected,
      to: square,
      promotion: "q"
    });

    if (move) {
      selected = null;
      legal = [];
      render();
      return;
    }
  }

  const piece = game.get(square);

  if (piece && piece.color === game.turn()) {
    selected = square;
    legal = game.moves({
      square: square,
      verbose: true
    });
  } else {
    selected = null;
    legal = [];
  }

  render();
}

document.getElementById("new").addEventListener("click", () => {
  if (engineReady) startGame();
});

document.getElementById("undo").addEventListener("click", () => {
  if (!engineReady) return;

  if (game.history().length > 0) {
    game.undo();
  }

  selected = null;
  legal = [];
  render();
});

document.getElementById("flip").addEventListener("click", () => {
  if (!engineReady) return;

  flipped = !flipped;
  render();
});

loadChessEngine([
  "https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js",
  "https://cdn.jsdelivr.net/npm/chess.js@0.10.3/chess.min.js"
]);
</script>

</body>
</html>
