<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Chess Universe | Battle Arena</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
  <link rel="stylesheet" href="style.css">
  <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
  <script src="script.js"></script>
</head>
<body class="min-h-screen flex flex-col font-sans select-none items-center justify-between pb-4">

  <!-- Opponent Bar -->
  <header class="w-full max-w-md px-3 pt-3 flex flex-col gap-1.5">
    <div class="glass-panel px-3 py-2 flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <a href="bots.html" class="w-8 h-8 rounded-xl bg-slate-950 border border-slate-800 flex items-center justify-center text-slate-300 hover:text-white">
          <i class="fa-solid fa-chevron-left text-xs"></i>
        </a>
        <div class="flex items-center gap-2">
          <div class="w-8 h-8 rounded-xl bg-slate-950 border border-slate-800 flex items-center justify-center font-bold text-xs" id="oppAvatar">🤖</div>
          <div>
            <h2 id="oppName" class="text-xs font-black text-white leading-tight">Master Bot</h2>
            <div class="flex items-center gap-1.5 mt-0.5">
              <span id="oppElo" class="text-[10px] text-emerald-400 font-mono font-bold">1400 Elo</span>
              <span id="oppMaterialDiff" class="material-lead-badge text-slate-400"></span>
            </div>
          </div>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <div id="oppClock" class="clock-display text-sm">10:00</div>
      </div>
    </div>
    <!-- Opponent Captured Pieces Tray -->
    <div id="oppCapturedTray" class="captured-tray px-3"></div>
  </header>

  <!-- Chessboard View -->
  <main class="w-full max-w-md px-2 flex flex-col items-center justify-center my-auto">
    <div id="boardContainer">
      <div id="chessBoard"></div>
    </div>
  </main>

  <!-- Player Bar & Controls -->
  <footer class="w-full max-w-md px-3 flex flex-col gap-2">
    <!-- Player Captured Pieces Tray -->
    <div id="playerCapturedTray" class="captured-tray px-3"></div>

    <div class="glass-panel px-3 py-2 flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-xl bg-emerald-500/20 border border-emerald-500/40 flex items-center justify-center font-bold text-xs text-emerald-400" id="playerAvatar">P</div>
        <div>
          <h2 id="playerName" class="text-xs font-black text-white leading-tight">Player</h2>
          <div class="flex items-center gap-1.5 mt-0.5">
            <span id="playerElo" class="text-[10px] text-emerald-400 font-mono font-bold">Rating: 1200</span>
            <span id="playerMaterialDiff" class="material-lead-badge text-emerald-400"></span>
          </div>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="toggleInGameChat()" id="btnChatToggle" class="w-8 h-8 rounded-xl bg-slate-950 border border-slate-800 text-slate-300 flex items-center justify-center text-xs hover:text-white transition relative">
          <i class="fa-regular fa-comment-dots"></i>
          <span id="chatUnreadDot" class="hidden absolute top-1 right-1 w-2 h-2 rounded-full bg-emerald-400"></span>
        </button>
        <div id="playerClock" class="clock-display text-sm">10:00</div>
      </div>
    </div>

    <!-- Move History Strip -->
    <div class="history-strip" id="moveHistoryStrip">
      <span class="text-slate-500 text-[10px] uppercase font-bold shrink-0">Moves:</span>
      <span id="emptyHistoryNotice" class="text-slate-600 text-[10px]">Game start</span>
    </div>

    <!-- Controls -->
    <div class="flex gap-2">
      <button onclick="board.flip()" class="flex-1 py-2 bg-slate-900 hover:bg-slate-800 border border-slate-800 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1.5 text-slate-300">
        <i class="fa-solid fa-repeat"></i> Flip
      </button>

      <button id="btnPeekMove" onclick="togglePeekPreviousMove()" class="flex-1 py-2 bg-slate-900 hover:bg-slate-800 border border-slate-800 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1.5 text-amber-400">
        <i class="fa-solid fa-backward-step"></i> <span id="peekBtnText">Last Move</span>
      </button>

      <button onclick="offerDrawGame()" class="flex-1 py-2 bg-slate-900 hover:bg-slate-800 border border-slate-800 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1.5 text-cyan-300">
        <i class="fa-solid fa-handshake"></i> Draw
      </button>

      <button onclick="resignGame()" class="flex-1 py-2 bg-rose-950/40 hover:bg-rose-900/60 border border-rose-800/80 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1.5 text-rose-300">
        <i class="fa-regular fa-flag"></i> Resign
      </button>
    </div>
  </footer>

  <!-- Promotion Selection Modal -->
  <div id="promotionModal" class="hidden modal-overlay">
    <div class="modal-dialog-box flex flex-col items-center gap-3">
      <h3 class="text-xs font-black uppercase text-emerald-400 tracking-wider">Promote Pawn</h3>
      <div class="grid grid-cols-4 gap-2">
        <button onclick="confirmPromotion('q')" class="promo-piece-option">♛</button>
        <button onclick="confirmPromotion('r')" class="promo-piece-option">♜</button>
        <button onclick="confirmPromotion('b')" class="promo-piece-option">♝</button>
        <button onclick="confirmPromotion('n')" class="promo-piece-option">♞</button>
      </div>
    </div>
  </div>

  <!-- In-Game Chat Drawer -->
  <div id="inGameChatModal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex flex-col justify-end p-2">
    <div class="bg-slate-900 border border-emerald-500/40 w-full max-w-md mx-auto rounded-3xl p-4 shadow-2xl flex flex-col gap-3 h-[60vh]">
      <div class="flex items-center justify-between border-b border-slate-800 pb-2">
        <span class="text-xs font-black uppercase text-white tracking-wider">Match Chat</span>
        <button onclick="toggleInGameChat()" class="w-7 h-7 rounded-lg bg-slate-950 border border-slate-800 text-slate-400 flex items-center justify-center text-xs">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <div id="inGameMessagesContainer" class="flex-1 overflow-y-auto custom-scroll flex flex-col gap-1.5 p-1 text-xs">
        <div class="text-center text-[10px] text-slate-500 my-auto">Chat with opponent during match</div>
      </div>
      <!-- Quick Emotes -->
      <div class="flex gap-1 overflow-x-auto custom-scroll pb-1">
        <button onclick="sendQuickChatMessage('Good luck! ♟️')" class="px-2 py-1 bg-slate-950 border border-slate-800 rounded-lg text-[10px] text-slate-300 shrink-0">GL! ♟️</button>
        <button onclick="sendQuickChatMessage('Well played! 👏')" class="px-2 py-1 bg-slate-950 border border-slate-800 rounded-lg text-[10px] text-slate-300 shrink-0">WP! 👏</button>
        <button onclick="sendQuickChatMessage('Nice move! 🔥')" class="px-2 py-1 bg-slate-950 border border-slate-800 rounded-lg text-[10px] text-slate-300 shrink-0">Nice move! 🔥</button>
        <button onclick="sendQuickChatMessage('Oops! 😅')" class="px-2 py-1 bg-slate-950 border border-slate-800 rounded-lg text-[10px] text-slate-300 shrink-0">Oops! 😅</button>
      </div>
      <div class="flex items-center gap-2 pt-1 border-t border-slate-800">
        <input type="text" id="inputInGameMsg" placeholder="Type message..." class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-emerald-500" onkeydown="if(event.key==='Enter') sendCustomInGameMessage()">
        <button onclick="sendCustomInGameMessage()" class="px-3 py-2 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black rounded-xl text-xs">Send</button>
      </div>
    </div>
  </div>
    <!-- End Game Modal -->
  <div id="gameOverModal" class="hidden modal-overlay">
    <div class="modal-dialog-box flex flex-col items-center text-center gap-3">
      <div id="modalIcon" class="w-14 h-14 rounded-2xl bg-emerald-500/20 border border-emerald-500/40 flex items-center justify-center text-3xl shadow-lg">🏆</div>
      <div>
        <h2 id="highlightWinnerTitle" class="text-base font-black uppercase tracking-wider text-emerald-400">Match Concluded</h2>
        <p id="subReasonText" class="text-xs text-slate-400 font-medium mt-0.5">By Checkmate</p>
      </div>

      <div class="w-full bg-slate-950 border border-slate-800 rounded-2xl p-3 flex items-center justify-around font-mono text-xs">
        <div>
          <span class="text-[9px] text-slate-500 uppercase font-bold block">Rating</span>
          <span id="modalRatingDelta" class="font-black text-emerald-400 text-sm">+16</span>
        </div>
        <div class="h-6 w-px bg-slate-800"></div>
        <div>
          <span class="text-[9px] text-slate-500 uppercase font-bold block">Rewards</span>
          <span id="modalRewards" class="font-black text-amber-400 text-sm">+50 🪙</span>
        </div>
      </div>

      <div class="w-full flex flex-col gap-2 pt-1">
        <button onclick="goToAnalysis()" class="w-full py-2.5 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black rounded-xl text-xs uppercase tracking-wider transition shadow-lg flex items-center justify-center gap-2">
          <i class="fa-solid fa-chart-line"></i> <span>View Real Analysis</span>
        </button>
        <div class="flex gap-2">
          <button onclick="location.reload()" class="flex-1 py-2 bg-slate-800 hover:bg-slate-700 text-white font-bold rounded-xl text-xs transition border border-slate-700">Rematch</button>
          <a href="bots.html" class="flex-1 py-2 bg-slate-950 hover:bg-slate-800 text-slate-300 font-bold rounded-xl text-xs transition border border-slate-800 flex items-center justify-center">Roster</a>
        </div>
      </div>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const mode = urlParams.get('mode') || 'bot';
    const playerSide = (urlParams.get('side') || 'white').toLowerCase();
    const botId = parseInt(urlParams.get('botId') || '5', 10);
    const roomId = urlParams.get('room') || null;

    const BOTS_DATABASE = [
      { id: 1, name: "Pawn Piper", elo: 400, avatar: "🐣", depth: 1, blunderRate: 0.60 },
      { id: 2, name: "Rusty Knight", elo: 700, avatar: "🐴", depth: 2, blunderRate: 0.40 },
      { id: 3, name: "Scholar Sam", elo: 950, avatar: "📖", depth: 3, blunderRate: 0.25 },
      { id: 4, name: "Tactical Tara", elo: 1100, avatar: "🏹", depth: 4, blunderRate: 0.15 },
      { id: 5, name: "Coach Vikram", elo: 1300, avatar: "👓", depth: 6, blunderRate: 0.04 },
      { id: 6, name: "Master Arjun", elo: 1550, avatar: "🛡️", depth: 8, blunderRate: 0.02 },
      { id: 7, name: "Iron Rook", elo: 1750, avatar: "🏰", depth: 10, blunderRate: 0.0 },
      { id: 8, name: "Grandmaster Arya", elo: 2000, avatar: "👑", depth: 12, blunderRate: 0.0 },
      { id: 9, name: "Cyber Magnus", elo: 2300, avatar: "⚡", depth: 14, blunderRate: 0.0 },
      { id: 10, name: "The Immortal Engine", elo: 2600, avatar: "🪐", depth: 16, blunderRate: 0.0 }
    ];

    let currentBot = BOTS_DATABASE.find(b => b.id === botId);
    if (!currentBot) {
      const pName = urlParams.get('botName');
      currentBot = BOTS_DATABASE.find(b => b.name === pName) || BOTS_DATABASE[4];
    }

    const game = new Chess();
    let board = null;
    let whiteTime = 600;
    let blackTime = 600;
    let timerInterval = null;
    let isGameOver = false;

    let selectedSquare = null;
    let legalMovesList = [];
    let lastMove = { from: null, to: null };
    let isPeekingPrevious = false;
    let pendingPromotionMove = null;

    const localPlayerName = localStorage.getItem('chess_name') || 'Harsh';
    let savedElo = parseInt(localStorage.getItem('chess_rating'), 10) || 1200;

    let oppDisplayName = currentBot.name;
    let oppDisplayElo = currentBot.elo;
    let oppDisplayAvatar = currentBot.avatar;

    if (mode === 'pass') {
      oppDisplayName = 'Player 2';
      oppDisplayElo = 'Offline';
      oppDisplayAvatar = '👥';
    } else if (mode === 'pvp' || mode === 'online') {
      oppDisplayName = urlParams.get('oppName') || 'Challenger';
      oppDisplayElo = urlParams.get('oppElo') || '1200';
      oppDisplayAvatar = '⚔️';
    }

    document.getElementById('playerName').innerText = localPlayerName;
    document.getElementById('playerAvatar').innerText = localPlayerName.charAt(0).toUpperCase();
    document.getElementById('playerElo').innerText = 'Rating: ' + savedElo;
    document.getElementById('oppName').innerText = oppDisplayName;
    document.getElementById('oppAvatar').innerText = oppDisplayAvatar;
    document.getElementById('oppElo').innerText = 'Rating: ' + oppDisplayElo;

    function playAudio(type) {
      if (typeof SoundEngine !== 'undefined') {
        if (type === 'capture') SoundEngine.playCapture();
        else if (type === 'check') SoundEngine.playCheck();
        else if (type === 'castle') SoundEngine.playCastle();
        else SoundEngine.playMove();
      }
    }

    // Material Balance & Piece Tray
    const pieceGlyphs = { p: '♙', n: '♘', b: '♗', r: '♖', q: '♕' };
    const pieceVals = { p: 1, n: 3, b: 3, r: 5, q: 9 };

    function updateMaterialAndTrays() {
      const counts = { w: { p:0,n:0,b:0,r:0,q:0 }, b: { p:0,n:0,b:0,r:0,q:0 } };
      game.board().forEach(row => {
        row.forEach(sq => {
          if (sq) counts[sq.color][sq.type]++;
        });
      });

      const maxPieces = { p:8, n:2, b:2, r:2, q:1 };
      let wCaptured = '', bCaptured = '';
      let wScore = 0, bScore = 0;

      ['p','n','b','r','q'].forEach(t => {
        const whiteLost = maxPieces[t] - counts.w[t];
        const blackLost = maxPieces[t] - counts.b[t];
        if (whiteLost > 0) bCaptured += pieceGlyphs[t].repeat(whiteLost);
        if (blackLost > 0) wCaptured += pieceGlyphs[t].repeat(blackLost);
        wScore += counts.w[t] * pieceVals[t];
        bScore += counts.b[t] * pieceVals[t];
      });

      const playerIsWhite = playerSide === 'white';
      document.getElementById('playerCapturedTray').innerText = playerIsWhite ? wCaptured : bCaptured;
      document.getElementById('oppCapturedTray').innerText = playerIsWhite ? bCaptured : wCaptured;

      const diff = playerIsWhite ? (wScore - bScore) : (bScore - wScore);
      document.getElementById('playerMaterialDiff').innerText = diff > 0 ? `+${diff}` : '';
      document.getElementById('oppMaterialDiff').innerText = diff < 0 ? `+${Math.abs(diff)}` : '';
    }

    function appendMoveToHistory(move) {
      document.getElementById('emptyHistoryNotice')?.remove();
      const strip = document.getElementById('moveHistoryStrip');
      const token = document.createElement('span');
      token.className = "move-token latest-move";
      token.innerText = move.san;
      
      const previousLatest = strip.querySelector('.latest-move');
      if (previousLatest) previousLatest.classList.remove('latest-move');

      strip.appendChild(token);
      strip.scrollLeft = strip.scrollWidth;
    }

    // ============================================================
    // POSITIONAL PIECE-SQUARE TABLES (PST) FOR ALPHA-BETA
    // ============================================================
    const PST = {
      p: [
        [0,  0,  0,  0,  0,  0,  0,  0],
        [50, 50, 50, 50, 50, 50, 50, 50],
        [10, 10, 20, 30, 30, 20, 10, 10],
        [5,  5, 10, 25, 25, 10,  5,  5],
        [0,  0,  0, 20, 20,  0,  0,  0],
        [5, -5,-10,  0,  0,-10, -5,  5],
        [5, 10, 10,-20,-20, 10, 10,  5],
        [0,  0,  0,  0,  0,  0,  0,  0]
      ],
      n: [
        [-50,-40,-30,-30,-30,-30,-40,-50],
        [-40,-20,  0,  0,  0,  0,-20,-40],
        [-30,  0, 10, 15, 15, 10,  0,-30],
        [-30,  5, 15, 20, 20, 15,  5,-30],
        [-30,  0, 15, 20, 20, 15,  0,-30],
        [-30,  5, 10, 15, 15, 10,  5,-30],
        [-40,-20,  0,  5,  5,  0,-20,-40],
        [-50,-40,-30,-30,-30,-30,-40,-50]
      ],
      b: [
        [-20,-10,-10,-10,-10,-10,-10,-20],
        [-10,  0,  0,  0,  0,  0,  0,-10],
        [-10,  0,  5, 10, 10,  5,  0,-10],
        [-10,  5,  5, 10, 10,  5,  5,-10],
        [-10,  0, 10, 10, 10, 10,  0,-10],
        [-10, 10, 10, 10, 10, 10, 10,-10],
        [-10,  5,  0,  0,  0,  0,  5,-10],
        [-20,-10,-10,-10,-10,-10,-10,-20]
      ],
      r: [
        [0,  0,  0,  0,  0,  0,  0,  0],
        [5, 10, 10, 10, 10, 10, 10,  5],
        [-5,  0,  0,  0,  0,  0,  0, -5],
        [-5,  0,  0,  0,  0,  0,  0, -5],
        [-5,  0,  0,  0,  0,  0,  0, -5],
        [-5,  0,  0,  0,  0,  0,  0, -5],
        [-5,  0,  0,  0,  0,  0,  0, -5],
        [0,  0,  0,  5,  5,  0,  0,  0]
      ],
      q: [
        [-20,-10,-10, -5, -5,-10,-10,-20],
        [-10,  0,  0,  0,  0,  0,  0,-10],
        [-10,  0,  5,  5,  5,  5,  0,-10],
        [-5,  0,  5,  5,  5,  5,  0, -5],
        [0,  0,  5,  5,  5,  5,  0, -5],
        [-10,  5,  5,  5,  5,  5,  0,-10],
        [-10,  0,  5,  0,  0,  0,  0,-10],
        [-20,-10,-10, -5, -5,-10,-10,-20]
      ],
      k: [
        [-30,-40,-40,-50,-50,-40,-40,-30],
        [-30,-40,-40,-50,-50,-40,-40,-30],
        [-30,-40,-40,-50,-50,-40,-40,-30],
        [-30,-40,-40,-50,-50,-40,-40,-30],
        [-20,-30,-30,-40,-40,-30,-30,-20],
        [-10,-20,-20,-20,-20,-20,-20,-10],
        [20, 20,  0,  0,  0,  0, 20, 20],
        [20, 30, 10,  0,  0, 10, 30, 20]
      ]
    };
        function evaluateBoardStatic(simBoard, turnColor) {
      const vals = { p: 100, n: 320, b: 330, r: 500, q: 900, k: 20000 };
      let score = 0;

      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          const piece = simBoard[r][c];
          if (!piece) continue;

          let val = vals[piece.type] || 0;
          let table = PST[piece.type];
          let posVal = 0;
          if (table) {
            posVal = piece.color === 'w' ? table[r][c] : table[7 - r][c];
          }

          let total = val + posVal;
          if (piece.color === turnColor) score += total;
          else score -= total;
        }
      }
      return score;
    }

    function minimaxAlphaBeta(sim, depth, alpha, beta, isMaximizing, botTurn) {
      if (depth === 0 || sim.game_over()) {
        return evaluateBoardStatic(sim.board(), botTurn);
      }

      const legal = sim.moves({ verbose: true });
      if (isMaximizing) {
        let maxEval = -999999;
        for (let i = 0; i < legal.length; i++) {
          sim.move(legal[i]);
          let ev = minimaxAlphaBeta(sim, depth - 1, alpha, beta, false, botTurn);
          sim.undo();
          maxEval = Math.max(maxEval, ev);
          alpha = Math.max(alpha, ev);
          if (beta <= alpha) break;
        }
        return maxEval;
      } else {
        let minEval = 999999;
        for (let i = 0; i < legal.length; i++) {
          sim.move(legal[i]);
          let ev = minimaxAlphaBeta(sim, depth - 1, alpha, beta, true, botTurn);
          sim.undo();
          minEval = Math.min(minEval, ev);
          beta = Math.min(beta, ev);
          if (beta <= alpha) break;
        }
        return minEval;
      }
    }

    async function runBotEngineTurn() {
      if (game.game_over() || isGameOver) return;
      const moves = game.moves({ verbose: true });
      if (moves.length === 0) return;

      // 1. Blunder dice roll for lower bots
      if (currentBot.blunderRate > 0 && Math.random() < currentBot.blunderRate) {
        executeBotMove(moves[Math.floor(Math.random() * moves.length)]);
        return;
      }

      // 2. High-tier Stockfish Cloud API (depth 10-16)
      if (currentBot.elo >= 1500) {
        try {
          const fenParam = encodeURIComponent(game.fen());
          const controller = new AbortController();
          const timeout = setTimeout(() => controller.abort(), 2200);

          const res = await fetch(`https://stockfish.online/api/s/v2.php?fen=${fenParam}&depth=${currentBot.depth}`, {
            signal: controller.signal
          });
          clearTimeout(timeout);

          if (res.ok) {
            const data = await res.json();
            if (data && data.success && data.bestmove) {
              const uci = data.bestmove.split(' ')[1];
              if (uci) {
                const f = uci.substring(0, 2);
                const t = uci.substring(2, 4);
                const p = uci.length > 4 ? uci.substring(4, 5) : undefined;
                executeBotMove({ from: f, to: t, promotion: p });
                return;
              }
            }
          }
        } catch (e) {
          console.warn("Stockfish Cloud fallback to Local Engine:", e);
        }
      }

      // 3. Fallback Tactical 3-Ply Alpha-Beta Search
      const botTurn = game.turn();
      let bestMove = moves[0];
      let bestScore = -999999;

      for (let i = 0; i < moves.length; i++) {
        game.move(moves[i]);
        let score = minimaxAlphaBeta(game, 2, -999999, 999999, false, botTurn);
        game.undo();

        if (score > bestScore) {
          bestScore = score;
          bestMove = moves[i];
        }
      }

      executeBotMove(bestMove);
    }

    function executeBotMove(mObj) {
      const move = game.move(mObj);
      if (!move) return;

      board.position(game.fen());
      lastMove = { from: move.from, to: move.to };
      renderHighlights();
      appendMoveToHistory(move);
      updateMaterialAndTrays();

      if (game.in_check()) playAudio('check');
      else if (move.flags.includes('k') || move.flags.includes('q')) playAudio('castle');
      else if (move.captured) playAudio('capture');
      else playAudio('move');

      updateClocksUI();
      if (game.game_over()) checkGameResult();
    }

    function removeHints() {
      $('#chessBoard .hint-dot, #chessBoard .hint-capture-ring').remove();
      $('#chessBoard .square-55d63').removeClass('square-selected');
    }

    function renderHighlights() {
      $('#chessBoard .square-55d63').removeClass('highlight-yellow square-in-check');
      if (lastMove.from) $('#chessBoard .square-' + lastMove.from).addClass('highlight-yellow');
      if (lastMove.to) $('#chessBoard .square-' + lastMove.to).addClass('highlight-yellow');

      if (game.in_check()) {
        const turn = game.turn();
        game.board().forEach((row, rIdx) => {
          row.forEach((sq, cIdx) => {
            if (sq && sq.type === 'k' && sq.color === turn) {
              const file = String.fromCharCode(97 + cIdx);
              const rank = 8 - rIdx;
              $('#chessBoard .square-' + file + rank).addClass('square-in-check');
            }
          });
        });
      }
    }

    function showHints(sq) {
      if (isPeekingPrevious) return;
      removeHints();
      selectedSquare = sq;
      $('#chessBoard .square-' + sq).addClass('square-selected');
      legalMovesList = game.moves({ square: sq, verbose: true });

      legalMovesList.forEach(m => {
        const $sq =$('#chessBoard .square-' + m.to);
        if ($sq.length) {
          const el = m.captured ? '<div class="hint-capture-ring"></div>' : '<div class="hint-dot"></div>';
          $sq.append(el);
        }
      });
    }

    function handlePlayerMove(from, to) {
      const moves = game.moves({ verbose: true });
      const promoCandidate = moves.find(m => m.from === from && m.to === to && m.flags.includes('p'));

      if (promoCandidate) {
        pendingPromotionMove = { from, to };
        document.getElementById('promotionModal').classList.remove('hidden');
        return;
      }
      commitPlayerMove(from, to, 'q');
    }

    window.confirmPromotion = (piece) => {
      document.getElementById('promotionModal').classList.add('hidden');
      if (pendingPromotionMove) {
        commitPlayerMove(pendingPromotionMove.from, pendingPromotionMove.to, piece);
        pendingPromotionMove = null;
      }
    };

    function commitPlayerMove(from, to, promoPiece) {
      if (isPeekingPrevious) togglePeekPreviousMove();
      removeHints();
      const move = game.move({ from: from, to: to, promotion: promoPiece });
      if (!move) return false;

      lastMove = { from: from, to: to };
      selectedSquare = null;
      legalMovesList = [];

      board.position(game.fen());
      renderHighlights();
      appendMoveToHistory(move);
      updateMaterialAndTrays();

      if (game.in_check()) playAudio('check');
      else if (move.flags.includes('k') || move.flags.includes('q')) playAudio('castle');
      else if (move.captured) playAudio('capture');
      else playAudio('move');

      updateClocksUI();

      if (mode === 'pvp' && roomId && window.syncMoveToFirestore) {
        window.syncMoveToFirestore(move);
      }

      if (game.game_over()) {
        checkGameResult();
        return true;
      }

      if (mode === 'bot') window.setTimeout(runBotEngineTurn, 450);
      return true;
    }

    // 100% Reliable 3D Neo Pieces from Chess.com
    board = Chessboard('chessBoard', {
      draggable: false,
      position: 'start',
      orientation: playerSide === 'black' ? 'black' : 'white',
      pieceTheme: function (piece) {
        return 'https://images.chesscomfiles.com/chess-themes/pieces/neo/150/' + piece.toLowerCase() + '.png';
      }
    });

    $(window).resize(board.resize);

    $('#chessBoard').on('click touchstart', '.square-55d63', function (e) {
      e.preventDefault();
      if (game.game_over() || isGameOver) return;
      if (isPeekingPrevious) { togglePeekPreviousMove(); return; }

      const sq = $(this).attr('data-square');
      if (!sq) return;

      const isLegal = legalMovesList.some(m => m.to === sq);
      if (selectedSquare && isLegal) {
        handlePlayerMove(selectedSquare, sq);
        return;
      }

      const piece = game.get(sq);
      const turn = game.turn();
      const isMyTurn = (playerSide === 'white' && turn === 'w') || (playerSide === 'black' && turn === 'b') || (mode === 'pass');

      if (piece && piece.color === turn && isMyTurn) {
        showHints(sq);
      } else {
        removeHints();
        selectedSquare = null;
        legalMovesList = [];
      }
    });
                function togglePeekPreviousMove() {
      const history = game.history();
      if (history.length === 0) return alert("No moves played yet!");
      const btnText = document.getElementById('peekBtnText');
      const btn = document.getElementById('btnPeekMove');

      if (!isPeekingPrevious) {
        const tempSim = new Chess();
        for (let i = 0; i < history.length - 1; i++) tempSim.move(history[i]);
        board.position(tempSim.fen());
        removeHints();
        isPeekingPrevious = true;
        btnText.innerText = "Live Board";
        btn.classList.add('border-amber-500/80', 'bg-amber-500/20');
      } else {
        board.position(game.fen());
        renderHighlights();
        isPeekingPrevious = false;
        btnText.innerText = "Last Move";
        btn.classList.remove('border-amber-500/80', 'bg-amber-500/20');
      }
    }

    function updateClocksUI() {
      const pClock = document.getElementById('playerClock');
      const oClock = document.getElementById('oppClock');
      const turn = game.turn();
      const isMyTurn = (playerSide === 'white' && turn === 'w') || (playerSide === 'black' && turn === 'b');

      if (isMyTurn) {
        pClock.classList.add('active-clock');
        oClock.classList.remove('active-clock');
      } else {
        oClock.classList.add('active-clock');
        pClock.classList.remove('active-clock');
      }
    }

    timerInterval = setInterval(() => {
      if (isGameOver) return;
      if (game.turn() === 'w') whiteTime = Math.max(0, whiteTime - 1);
      else blackTime = Math.max(0, blackTime - 1);

      formatClock('playerClock', playerSide === 'white' ? whiteTime : blackTime);
      formatClock('oppClock', playerSide === 'white' ? blackTime : whiteTime);

      if (whiteTime === 0 || blackTime === 0) {
        concludeMatch(whiteTime === 0 ? 'Black' : 'White', 'Timeout');
      }
    }, 1000);

    function formatClock(id, s) {
      const m = Math.floor(s / 60);
      const sec = s % 60;
      const el = document.getElementById(id);
      el.innerText = `${m}:${sec < 10 ? '0' : ''}${sec}`;
      if (s <= 30) el.classList.add('clock-low-time');
      else el.classList.remove('clock-low-time');
    }

    function checkGameResult() {
      if (game.in_checkmate()) {
        concludeMatch(game.turn() === 'b' ? 'White' : 'Black', 'Checkmate');
      } else if (game.in_draw()) {
        concludeMatch('Draw', 'Stalemate / Draw');
      }
    }

    function concludeMatch(winnerColor, reason) {
      if (isGameOver) return;
      isGameOver = true;
      clearInterval(timerInterval);
      removeHints();

      const isWin = (winnerColor.toLowerCase() === playerSide);
      const delta = winnerColor === 'Draw' ? 0 : (isWin ? 16 : -14);
      const newElo = Math.max(100, savedElo + delta);
      localStorage.setItem('chess_rating', newElo);

      const rewardCoins = isWin ? 50 : 15;
      localStorage.setItem('chess_coins', (parseInt(localStorage.getItem('chess_coins') || '350', 10) + rewardCoins));

      const matchReport = {
        outcome: isWin ? "Victory" : (winnerColor === 'Draw' ? "Draw" : "Defeat"),
        won: isWin,
        delta: delta,
        newElo: newElo,
        pgn: game.pgn(),
        moves: game.history(),
        timestamp: Date.now(),
        opponent: oppDisplayName,
        playedSide: playerSide
      };

      try {
        localStorage.setItem('last_match_analysis', JSON.stringify(matchReport));
      } catch (err) {}

      document.getElementById('highlightWinnerTitle').innerText = isWin ? "🎉 Victory!" : "Defeat!";
      document.getElementById('subReasonText').innerText = `By ${reason}`;
      document.getElementById('modalRatingDelta').innerText = `${delta >= 0 ? '+' : ''}${delta} (${newElo})`;
      document.getElementById('modalRewards').innerText = `+${rewardCoins} 🪙`;
      document.getElementById('gameOverModal').classList.remove('hidden');
    }

    function goToAnalysis() { window.location.href = 'analysis.html'; }
    function resignGame() {
      if (confirm('Resign this game?')) {
        concludeMatch(playerSide === 'white' ? 'Black' : 'White', 'Resignation');
      }
    }
    function offerDrawGame() {
      if (mode === 'bot') {
        alert("Bot declined draw offer!");
      } else {
        if (confirm("Offer a draw to opponent?")) concludeMatch('Draw', 'Mutual Agreement');
      }
    }

    window.toggleInGameChat = () => {
      const modal = document.getElementById('inGameChatModal');
      modal.classList.toggle('hidden');
      document.getElementById('chatUnreadDot').classList.add('hidden');
    };

    if (mode === 'bot' && playerSide === 'black') setTimeout(runBotEngineTurn, 600);
    updateClocksUI();
    updateMaterialAndTrays();
  </script>

  <!-- FIREBASE FIRESTORE REALTIME SYNC (PVP & IN-GAME CHAT) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { getFirestore, doc, onSnapshot, updateDoc, addDoc, collection, query, orderBy } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

    if (mode === 'pvp' && roomId) {
      const firebaseConfig = {
        apiKey: "AIzaSyBx79cUd4hX7XzCe8aCPIeqLss1d5nNzaM",
        authDomain: "chess-universe-5a7cb.firebaseapp.com",
        projectId: "chess-universe-5a7cb",
        storageBucket: "chess-universe-5a7cb.firebasestorage.app",
        messagingSenderId: "145519167856",
        appId: "1:145519167856:web:bf124bc275895447fd27b5"
      };

      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);

      // Listen for remote moves
      const roomRef = doc(db, "rooms", roomId);
      onSnapshot(roomRef, (snapshot) => {
        if (snapshot.exists()) {
          const data = snapshot.data();
          if (data.lastMoveBy && data.lastMoveBy !== playerSide && data.fen) {
            if (data.fen !== game.fen()) {
              game.load(data.fen);
              board.position(game.fen());
              lastMove = data.lastMoveCoord || { from: null, to: null };
              renderHighlights();
              updateClocksUI();
              updateMaterialAndTrays();
              if (data.lastMoveSan) {
                appendMoveToHistory({ san: data.lastMoveSan });
              }
              playAudio(data.lastMoveType || 'move');
              if (game.game_over()) checkGameResult();
            }
          }
        }
      });

      // Move sync function
      window.syncMoveToFirestore = async (move) => {
        try {
          await updateDoc(roomRef, {
            fen: game.fen(),
            lastMoveBy: playerSide,
            lastMoveCoord: { from: move.from, to: move.to },
            lastMoveSan: move.san,
            lastMoveType: move.captured ? 'capture' : (game.in_check() ? 'check' : 'move'),
            updatedAt: Date.now()
          });
        } catch(err) {
          console.error("Move sync error:", err);
        }
      };

      // In-game live chat listener
      const chatCol = collection(db, "rooms", roomId, "messages");
      const q = query(chatCol, orderBy("timestamp", "asc"));
      onSnapshot(q, (snap) => {
        const box = document.getElementById('inGameMessagesContainer');
        box.innerHTML = '';
        snap.forEach(d => {
          const m = d.data();
          const isMe = m.senderSide === playerSide;
          const bubble = document.createElement('div');
          bubble.className = `p-2 rounded-2xl max-w-[80%] ${isMe ? 'ml-auto bg-emerald-500 text-slate-950 font-bold' : 'mr-auto bg-slate-950 border border-slate-800 text-slate-200'}`;
          bubble.innerText = m.text;
          box.appendChild(bubble);
        });
        box.scrollTop = box.scrollHeight;
        if (document.getElementById('inGameChatModal').classList.contains('hidden')) {
          document.getElementById('chatUnreadDot').classList.remove('hidden');
        }
      });

      window.sendCustomInGameMessage = async () => {
        const inp = document.getElementById('inputInGameMsg');
        const txt = inp.value.trim();
        if (!txt) return;
        inp.value = '';
        await addDoc(chatCol, { text: txt, senderSide: playerSide, timestamp: Date.now() });
      };

      window.sendQuickChatMessage = async (txt) => {
        await addDoc(chatCol, { text: txt, senderSide: playerSide, timestamp: Date.now() });
      };
    }
  </script>
