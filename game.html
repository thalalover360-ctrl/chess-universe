<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Chess Universe | Arena</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <style>
    .chess-grid {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      grid-template-rows: repeat(8, 1fr);
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 20px 40px -15px rgba(0,0,0,0.8);
      border: 4px solid #1e293b;
      touch-action: none;
      user-select: none;
    }
    .tile-light { background-color: #e2e8f0; }
    .tile-dark { background-color: #334155; }
    .tile-selected { background-color: #10b981 !important; }
    .tile-highlight { background-color: #047857 !important; }
    .tile-dot::after {
      content: '';
      width: 26%;
      height: 26%;
      background: rgba(16, 185, 129, 0.7);
      border-radius: 50%;
      pointer-events: none;
    }
    .tile-capture {
      box-shadow: inset 0 0 0 4px #ef4444 !important;
    }
    .chess-tile {
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: clamp(28px, 8vw, 44px);
      line-height: 1;
      position: relative;
    }
    .piece-white {
      color: #ffffff;
      filter: drop-shadow(0 2px 3px rgba(0,0,0,0.9));
    }
    .piece-black {
      color: #020617;
      filter: drop-shadow(0 1px 2px rgba(255,255,255,0.4));
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">

  <!-- Top Bar -->
  <header class="navbar flex justify-between items-center px-4 py-3 border-b border-slate-800 bg-slate-900/60">
    <a href="index.html" class="flex items-center gap-2">
      <span class="text-emerald-400 text-xl font-black">♞</span>
      <span class="font-extrabold text-sm sm:text-base tracking-wide">CHESS UNIVERSE</span>
    </a>
    <div class="flex items-center gap-2">
      <span id="matchTypePill" class="text-xs font-black px-2.5 py-1 rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">⚡ RATED</span>
      <a href="index.html" class="text-xs bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-700 hover:bg-slate-700 transition">Leave</a>
    </div>
  </header>

  <!-- Main Stage -->
  <main class="flex-1 max-w-lg w-full mx-auto p-4 flex flex-col justify-between space-y-3">
    
    <!-- Top Player (Opponent / Bot) -->
    <div class="player-plate flex items-center justify-between bg-slate-900/80 p-3 rounded-2xl border border-slate-800">
      <div class="flex items-center gap-3">
        <img id="opponentAvatar" src="https://api.dicebear.com/7.x/bottts/svg?seed=Challenger" class="w-10 h-10 rounded-xl bg-slate-800 border border-slate-700" alt="Bot">
        <div>
          <h4 id="opponentName" class="text-sm font-bold text-white leading-none">Challenger</h4>
          <span id="opponentElo" class="text-[11px] text-slate-400 font-mono">Elo: 1200</span>
        </div>
      </div>
      <div id="opponentClock" class="font-mono text-base font-bold bg-slate-950 px-3 py-1.5 rounded-xl border border-slate-800">10:00</div>
    </div>

    <!-- Active Native Board -->
    <div class="w-full flex items-center justify-center my-auto">
      <div id="board" class="chess-grid"></div>
    </div>

    <!-- Bottom Player (User) -->
    <div class="player-plate flex items-center justify-between bg-slate-900/80 p-3 rounded-2xl border border-slate-800">
      <div class="flex items-center gap-3">
        <img id="userAvatar" src="https://api.dicebear.com/7.x/bottts/svg?seed=User" class="w-10 h-10 rounded-xl bg-slate-800 border border-slate-700" alt="You">
        <div>
          <h4 id="userName" class="text-sm font-bold text-white leading-none">You</h4>
          <span id="userElo" class="text-[11px] text-emerald-400 font-mono">Calibrating (?)</span>
        </div>
      </div>
      <div id="userClock" class="font-mono text-base font-bold bg-slate-950 px-3 py-1.5 rounded-xl border border-slate-800">10:00</div>
    </div>

    <!-- Bottom Controls & Status -->
    <div class="bg-slate-900/50 p-3 rounded-2xl border border-slate-800 flex items-center justify-between">
      <div id="gameStatusPill" class="text-xs font-bold text-emerald-400">White to move</div>
      <div class="flex gap-2">
        <button id="btnHint" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-amber-300 text-xs font-bold rounded-lg border border-slate-700">💡 Hint</button>
        <button id="btnResign" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-red-400 text-xs font-bold rounded-lg border border-slate-700">🏳️ Resign</button>
      </div>
    </div>

  </main>

  <!-- Modal End Game -->
  <div id="gameModal" class="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50 hidden">
    <div class="bg-slate-900 border border-slate-800 p-6 rounded-3xl max-w-xs w-full text-center space-y-4">
      <div id="modalIcon" class="text-4xl">🏆</div>
      <h2 id="modalTitle" class="text-xl font-black">Game Over</h2>
      <div class="bg-slate-950 p-3 rounded-2xl border border-slate-800 text-xs font-mono text-emerald-400" id="modalResultText">+20 Rating Gain</div>
      <div class="flex gap-2">
        <a href="index.html" class="flex-1 py-2.5 bg-slate-800 text-xs font-bold rounded-xl text-center">Lobby</a>
        <button onclick="window.location.reload()" class="flex-1 py-2.5 bg-emerald-500 text-slate-950 font-black rounded-xl text-xs">Play Again</button>
      </div>
    </div>
  </div>

  <script>
    if (!localStorage.getItem('chess_auth')) {
      window.location.href = 'login.html';
    }

    const urlParams = new URLSearchParams(window.location.search);
    const gameMode = urlParams.get('mode') || 'bot';
    let userSide = (urlParams.get('side') === 'b' || urlParams.get('side') === 'black') ? 'black' : 'white';
    const botLevel = parseInt(urlParams.get('level') || '1');
    const botName = decodeURIComponent(urlParams.get('botName') || 'Noobie Bob');
    const botElo = urlParams.get('botElo') || '400';

    const game = new Chess();
    let selectedSquare = null;
    let userTime = 600;
    let opponentTime = 600;
    let timer = null;

    const myName = localStorage.getItem('chess_name') || 'Player';
    document.getElementById('userName').innerText = myName;
    document.getElementById('userAvatar').src = localStorage.getItem('chess_avatar') || `https://api.dicebear.com/7.x/bottts/svg?seed=${myName}`;
    document.getElementById('userElo').innerText = localStorage.getItem('chess_rating') || 'Calibrating (?)';

    if (gameMode === 'bot') {
      document.getElementById('opponentName').innerText = botName;
      document.getElementById('opponentElo').innerText = `Elo: ${botElo}`;
      document.getElementById('opponentAvatar').src = `https://api.dicebear.com/7.x/bottts/svg?seed=${botName}`;
    }

    const pieceSymbols = {
      'p': '♟', 'r': '♜', 'n': '♞', 'b': '♝', 'q': '♛', 'k': '♚',
      'P': '♙', 'R': '♖', 'N': '♘', 'B': '♗', 'Q': '♕', 'K': '♔'
    };

    function renderBoard() {
      const boardEl = document.getElementById('board');
      boardEl.innerHTML = '';

      const ranks = userSide === 'white' ? [8,7,6,5,4,3,2,1] : [1,2,3,4,5,6,7,8];
      const files = userSide === 'white' ? ['a','b','c','d','e','f','g','h'] : ['h','g','f','e','d','c','b','a'];

      ranks.forEach((rank, rIdx) => {
        files.forEach((file, fIdx) => {
          const sq = `${file}${rank}`;
          const isDark = (rIdx + fIdx) % 2 === 1;
          const tile = document.createElement('div');
          tile.className = `chess-tile ${isDark ? 'tile-dark' : 'tile-light'}`;
          tile.dataset.square = sq;

          const piece = game.get(sq);
          if (piece) {
            const sym = piece.color === 'w' ? piece.type.toUpperCase() : piece.type.toLowerCase();
            tile.innerText = pieceSymbols[sym] || '';
            tile.classList.add(piece.color === 'w' ? 'piece-white' : 'piece-black');
          }

          if (selectedSquare === sq) {
            tile.classList.add('tile-selected');
          }

          tile.onclick = () => onTileClick(sq);
          boardEl.appendChild(tile);
        });
      });

      highlightMoves();
    }

    function highlightMoves() {
      if (!selectedSquare) return;
      const moves = game.moves({ square: selectedSquare, verbose: true });
      moves.forEach(m => {
        const el = document.querySelector(`[data-square="${m.to}"]`);
        if (el) {
          if (m.captured) el.classList.add('tile-capture');
          else el.classList.add('tile-dot');
        }
      });
    }

    function onTileClick(square) {
      if (game.game_over()) return;
      const isMyTurn = (game.turn() === 'w' && userSide === 'white') || (game.turn() === 'b' && userSide === 'black');
      if (!isMyTurn) return;

      const piece = game.get(square);

      if (selectedSquare) {
        if (selectedSquare === square) {
          selectedSquare = null;
          renderBoard();
          return;
        }

        const move = game.move({ from: selectedSquare, to: square, promotion: 'q' });
        if (move) {
          selectedSquare = null;
          renderBoard();
          afterMoveAction();
          return;
        }
      }

      if (piece && ((piece.color === 'w' && userSide === 'white') || (piece.color === 'b' && userSide === 'black'))) {
        selectedSquare = square;
        renderBoard();
      } else {
        selectedSquare = null;
        renderBoard();
      }
    }

    function afterMoveAction() {
      const pill = document.getElementById('gameStatusPill');
      pill.innerText = game.turn() === 'w' ? 'White to move' : 'Black to move';

      if (game.game_over()) {
        showGameOver();
        return;
      }

      if (gameMode === 'bot') {
        const isBotTurn = (game.turn() === 'w' && userSide === 'black') || (game.turn() === 'b' && userSide === 'white');
        if (isBotTurn) {
          setTimeout(makeBotMove, 450);
        }
      }
    }

    function makeBotMove() {
      if (game.game_over()) return;
      const moves = game.moves({ verbose: true });
      if (moves.length === 0) return;

      // Smart Bot Logic
      let chosen = null;
      if (botLevel === 1) {
        chosen = moves[Math.floor(Math.random() * moves.length)];
      } else {
        const captures = moves.filter(m => m.captured || m.san.includes('+'));
        chosen = captures.length > 0 ? captures[Math.floor(Math.random() * captures.length)] : moves[Math.floor(Math.random() * moves.length)];
      }

      game.move(chosen);
      renderBoard();

      const pill = document.getElementById('gameStatusPill');
      pill.innerText = game.turn() === 'w' ? 'White to move' : 'Black to move';

      if (game.game_over()) {
        showGameOver();
      }
    }

    function showGameOver() {
      clearInterval(timer);
      const modal = document.getElementById('gameModal');
      const icon = document.getElementById('modalIcon');
      const title = document.getElementById('modalTitle');
      const res = document.getElementById('modalResultText');

      if (game.in_checkmate()) {
        const winner = game.turn() === 'w' ? 'black' : 'white';
        if (winner === userSide) {
          icon.innerText = '🏆';
          title.innerText = 'Checkmate Victory!';
          res.innerText = '+20 Rating Earned';
        } else {
          icon.innerText = '💀';
          title.innerText = 'Defeat';
          res.innerText = '-18 Rating Lost';
        }
      } else {
        icon.innerText = '🤝';
        title.innerText = 'Draw Game';
        res.innerText = '0 Rating Change';
      }

      modal.classList.remove('hidden');
    }

    document.getElementById('btnResign').onclick = () => {
      if (confirm('Resign this match?')) {
        clearInterval(timer);
        document.getElementById('modalIcon').innerText = '🏳️';
        document.getElementById('modalTitle').innerText = 'You Resigned';
        document.getElementById('modalResultText').innerText = '-15 Rating Lost';
        document.getElementById('gameModal').classList.remove('hidden');
      }
    };

    document.getElementById('btnHint').onclick = () => {
      const moves = game.moves({ verbose: true });
      if (moves.length === 0) return;
      const m = moves[0];
      selectedSquare = m.from;
      renderBoard();
      alert(`💡 Suggested move: ${m.piece.toUpperCase()} from ${m.from} to ${m.to}`);
    };

    // Timer
    timer = setInterval(() => {
      if (game.game_over()) return;
      const isMyTurn = (game.turn() === 'w' && userSide === 'white') || (game.turn() === 'b' && userSide === 'black');
      if (isMyTurn) {
        userTime--;
        const m = Math.floor(userTime / 60).toString().padStart(2, '0');
        const s = (userTime % 60).toString().padStart(2, '0');
        document.getElementById('userClock').innerText = `${m}:${s}`;
      } else {
        opponentTime--;
        const m = Math.floor(opponentTime / 60).toString().padStart(2, '0');
        const s = (opponentTime % 60).toString().padStart(2, '0');
        document.getElementById('opponentClock').innerText = `${m}:${s}`;
      }
    }, 1000);

    // Initial render
    renderBoard();
  </script>
</body>
</html>
