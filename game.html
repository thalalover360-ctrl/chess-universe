<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Arena | Chess Universe</title>
  
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Chessboard.js CSS -->
  <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">

  <!-- Core Libraries -->
  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">

  <!-- Navbar -->
  <header class="navbar">
    <div class="nav-brand">
      <a href="index.html" class="flex items-center gap-2">
        <span class="brand-icon text-emerald-400 text-xl">♞</span>
        <span class="tracking-wide font-extrabold text-sm sm:text-base">CHESS UNIVERSE</span>
      </a>
    </div>
    <div class="flex items-center gap-2">
      <span id="matchTypePill" class="text-xs font-black px-2.5 py-1 rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">
        ⚡ RATED
      </span>
      <button id="btnShareMatch" class="bg-slate-800 hover:bg-slate-700 text-xs px-3 py-1.5 rounded-lg border border-slate-700 transition">
        📋 Share
      </button>
      <a href="index.html" class="text-xs bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-700 hover:bg-slate-700 transition">Leave</a>
    </div>
  </header>

  <!-- Arena Container -->
  <main class="arena-wrapper flex-1">
    
    <div class="board-stage">
      
      <!-- Top Opponent Plate -->
      <div class="player-plate" id="opponentPlate">
        <div class="player-info">
          <img id="opponentAvatar" src="https://api.dicebear.com/7.x/bottts/svg?seed=Challenger" class="player-img" alt="Opponent">
          <div class="player-details">
            <h4 id="opponentName">Challenger</h4>
            <span id="opponentElo">Elo: 1200</span>
          </div>
        </div>
        <div class="player-clock" id="opponentClock">10:00</div>
      </div>

      <!-- Chess Board Container -->
      <div id="board" class="chessboard-box w-full max-w-[420px] aspect-square mx-auto"></div>

      <!-- Bottom User Plate -->
      <div class="player-plate" id="userPlate">
        <div class="player-info">
          <img id="userAvatar" src="https://api.dicebear.com/7.x/bottts/svg?seed=You" class="player-img" alt="User">
          <div class="player-details">
            <h4 id="userName">You</h4>
            <span id="userElo">Calibrating (?)</span>
          </div>
        </div>
        <div class="player-clock" id="userClock">10:00</div>
      </div>

    </div>

    <!-- Sidebar -->
    <div class="arena-sidebar">
      <div class="sidebar-header">
        <h3 class="sidebar-title flex items-center gap-2">
          <span>📜</span> Match Notation
        </h3>
        <span id="gameStatusPill" class="text-xs font-bold px-2.5 py-1 rounded-full bg-emerald-500/20 text-emerald-400">White to move</span>
      </div>

      <div class="moves-table" id="movesList"></div>
      <div id="hintBox" class="hidden px-3 py-2 bg-slate-900 border-t border-slate-800 text-[11px] text-amber-300 font-medium"></div>

      <div class="arena-controls">
        <button id="btnHint" class="btn-secondary py-2.5 px-3 rounded-xl text-xs font-bold border-amber-500/30 text-amber-300">
          💡 Tactical Hint
        </button>
        <button id="btnResign" class="btn-secondary py-2.5 px-3 rounded-xl text-xs font-bold border-red-500/30 text-red-400">
          🏳️ Resign
        </button>
      </div>
    </div>

  </main>

  <!-- Game Over Modal -->
  <div id="gameModal" class="modal-backdrop">
    <div class="modal-dialog">
      <div id="modalIcon" class="modal-icon text-4xl mb-2">🏆</div>
      <h2 id="modalTitle" class="modal-title text-2xl font-black mb-1">Victory!</h2>
      <p id="modalSubtitle" class="modal-subtitle text-xs text-slate-400 mb-4">Post-game evaluation complete</p>
      
      <div class="analysis-report grid grid-cols-3 gap-2 bg-slate-900 p-3 rounded-2xl border border-slate-800 mb-4 text-center">
        <div>
          <span class="text-[10px] text-slate-400 uppercase font-bold block">Accuracy</span>
          <span id="statAccuracy" class="text-lg font-black text-emerald-400">82%</span>
        </div>
        <div class="border-x border-slate-800">
          <span class="text-[10px] text-slate-400 uppercase font-bold block">Best Moves</span>
          <span id="statBest" class="text-lg font-black text-blue-400">8</span>
        </div>
        <div>
          <span class="text-[10px] text-slate-400 uppercase font-bold block">Blunders</span>
          <span id="statBlunders" class="text-lg font-black text-red-400">0</span>
        </div>
      </div>

      <div class="bg-slate-900/90 p-4 rounded-2xl border border-slate-800 mb-6 flex justify-around text-center">
        <div>
          <span class="text-xs text-slate-400 block font-semibold">Result</span>
          <span id="modalRatingChange" class="text-xl font-black text-emerald-400">+20</span>
        </div>
        <div>
          <span class="text-xs text-slate-400 block font-semibold">Rating</span>
          <span id="modalNewRating" class="text-xl font-black text-slate-200">1200</span>
        </div>
      </div>

      <div class="flex gap-2">
        <a href="index.html" class="btn-secondary flex-1 py-3 rounded-xl text-xs font-bold text-center">Lobby</a>
        <button onclick="window.location.reload()" class="btn-primary flex-1 py-3 rounded-xl text-xs font-black">Play Again</button>
      </div>
    </div>
  </div>

  <!-- Board & Engine Script -->
  <script>
    if (!localStorage.getItem('chess_auth')) {
      window.location.href = 'login.html';
    }

    const urlParams = new URLSearchParams(window.location.search);
    const gameMode = urlParams.get('mode') || 'bot';
    const matchType = urlParams.get('matchType') || 'rated';
    let userSide = (urlParams.get('side') === 'b' || urlParams.get('side') === 'black') ? 'black' : 'white';
    const botLevel = parseInt(urlParams.get('level') || '1');
    const botName = decodeURIComponent(urlParams.get('botName') || 'Noobie Bob');
    const botElo = urlParams.get('botElo') || '400';

    let game = new Chess();
    let board = null;
    let selectedSquare = null;
    let userTime = 600;
    let opponentTime = 600;
    let timerInterval = null;
    let userMoves = 0;
    let bestMoves = 0;
    let blunders = 0;

    // Profiles setup
    const myName = localStorage.getItem('chess_name') || 'Player';
    document.getElementById('userName').innerText = myName;
    document.getElementById('userAvatar').src = localStorage.getItem('chess_avatar') || `https://api.dicebear.com/7.x/bottts/svg?seed=${myName}`;
    document.getElementById('userElo').innerText = localStorage.getItem('chess_rating') || 'Calibrating (?)';

    if (gameMode === 'bot') {
      document.getElementById('opponentName').innerText = botName;
      document.getElementById('opponentElo').innerText = `Elo: ${botElo}`;
      document.getElementById('opponentAvatar').src = `https://api.dicebear.com/7.x/bottts/svg?seed=${botName}`;
    }

    if (matchType === 'friendly') {
      document.getElementById('matchTypePill').innerText = '☕ FRIENDLY';
      document.getElementById('matchTypePill').className = 'text-xs font-black px-2.5 py-1 rounded-full bg-slate-800 text-amber-400 border border-slate-700';
    }

    // PST Tables
    const pstPawn = [
      0,  0,  0,  0,  0,  0,  0,  0,
      50, 50, 50, 50, 50, 50, 50, 50,
      10, 10, 20, 30, 30, 20, 10, 10,
      5,  5, 10, 25, 25, 10,  5,  5,
      0,  0,  0, 20, 20,  0,  0,  0,
      5, -5,-10,  0,  0,-10, -5,  5,
      5, 10, 10,-20,-20, 10, 10,  5,
      0,  0,  0,  0,  0,  0,  0,  0
    ];

    function evaluateBoard(chessObj) {
      let score = 0;
      const values = { p: 100, n: 320, b: 330, r: 500, q: 900, k: 20000 };
      const sqs = chessObj.SQUARES;
      for (let i = 0; i < sqs.length; i++) {
        const piece = chessObj.get(sqs[i]);
        if (piece) {
          let val = values[piece.type];
          if (piece.type === 'p') val += pstPawn[i];
          score += (piece.color === 'w' ? val : -val);
        }
      }
      return score;
    }

    function getBestMove(chessObj) {
      const moves = chessObj.moves({ verbose: true });
      if (moves.length === 0) return null;

      let bestScore = chessObj.turn() === 'w' ? -Infinity : Infinity;
      let selected = moves[0];

      for (let m of moves) {
        chessObj.move(m);
        let score = evaluateBoard(chessObj);
        chessObj.undo();

        if (chessObj.turn() === 'w') {
          if (score > bestScore) {
            bestScore = score;
            selected = m;
          }
        } else {
          if (score < bestScore) {
            bestScore = score;
            selected = m;
          }
        }
      }
      return selected;
    }

    function removeHighlights() {
      $('#board .square-55d63').removeClass('legal-dot legal-capture square-selected square-hint-from square-hint-to');
      $('#hintBox').addClass('hidden').text('');
    }

    function showLegalDots(square) {
      removeHighlights();
      const moves = game.moves({ square: square, verbose: true });
      if (moves.length === 0) return;

      $(`#board .square-${square}`).addClass('square-selected');
      moves.forEach(m => {
        const sq = $(`#board .square-${m.to}`);
        if (m.captured) sq.addClass('legal-capture');
        else sq.addClass('legal-dot');
      });
    }

    function onDragStart(source, piece) {
      if (game.game_over()) return false;
      const isMyTurn = (game.turn() === 'w' && userSide === 'white') || (game.turn() === 'b' && userSide === 'black');
      if (!isMyTurn) return false;
      const pieceColor = piece.search(/^b/) !== -1 ? 'black' : 'white';
      return pieceColor === userSide;
    }

    function onDrop(source, target) {
      removeHighlights();
      const move = game.move({ from: source, to: target, promotion: 'q' });
      if (move === null) return 'snapback';
      processMoveDone(move);
    }

    function onSnapEnd() {
      board.position(game.fen());
    }

    function handleSquareClick(square) {
      if (game.game_over()) return;
      const isMyTurn = (game.turn() === 'w' && userSide === 'white') || (game.turn() === 'b' && userSide === 'black');
      if (!isMyTurn) return;

      const piece = game.get(square);

      if (selectedSquare) {
        if (selectedSquare === square) {
          selectedSquare = null;
          removeHighlights();
          return;
        }

        const move = game.move({ from: selectedSquare, to: square, promotion: 'q' });
        if (move) {
          board.position(game.fen());
          selectedSquare = null;
          removeHighlights();
          processMoveDone(move);
          return;
        }
      }

      if (piece && ((piece.color === 'w' && userSide === 'white') || (piece.color === 'b' && userSide === 'black'))) {
        selectedSquare = square;
        showLegalDots(square);
      } else {
        selectedSquare = null;
        removeHighlights();
      }
    }

    function processMoveDone(move) {
      userMoves++;
      const best = getBestMove(game);
      if (best && best.from === move.from && best.to === move.to) {
        bestMoves++;
      }

      updateNotationList(move);

      const pill = document.getElementById('gameStatusPill');
      pill.innerText = game.turn() === 'w' ? 'White to move' : 'Black to move';

      if (game.game_over()) {
        endGame();
        return;
      }

      if (gameMode === 'bot') {
        const isBotTurn = (game.turn() === 'w' && userSide === 'black') || (game.turn() === 'b' && userSide === 'white');
        if (isBotTurn) {
          setTimeout(makeBotMove, 400);
        }
      }
    }

    function makeBotMove() {
      if (game.game_over()) return;
      const moves = game.moves({ verbose: true });
      if (moves.length === 0) return;

      let chosen = null;
      if (botLevel === 1) {
        chosen = Math.random() < 0.65 ? moves[Math.floor(Math.random() * moves.length)] : getBestMove(game);
      } else if (botLevel <= 4) {
        const attacks = moves.filter(m => m.captured || m.san.includes('+'));
        chosen = (attacks.length > 0 && Math.random() < 0.7) ? attacks[Math.floor(Math.random() * attacks.length)] : getBestMove(game);
      } else {
        chosen = getBestMove(game);
      }

      if (!chosen) chosen = moves[0];
      const res = game.move(chosen);
      board.position(game.fen());
      updateNotationList(res);

      const pill = document.getElementById('gameStatusPill');
      pill.innerText = game.turn() === 'w' ? 'White to move' : 'Black to move';

      if (game.game_over()) {
        endGame();
      }
    }

    function updateNotationList(move) {
      const list = document.getElementById('movesList');
      const round = Math.ceil(game.history().length / 2);

      if (game.turn() === 'b') {
        const row = document.createElement('div');
        row.className = 'move-row flex items-center justify-between text-xs py-1 px-2';
        row.id = `row_${round}`;
        row.innerHTML = `<span class="text-slate-500 font-mono">${round}.</span><span class="font-bold text-slate-200">${move.san}</span><span id="b_${round}"></span>`;
        list.appendChild(row);
      } else {
        const cell = document.getElementById(`b_${round}`);
        if (cell) cell.innerText = move.san;
      }
      list.scrollTop = list.scrollHeight;
    }

    function endGame(resign = false) {
      clearInterval(timerInterval);
      const modal = document.getElementById('gameModal');
      const icon = document.getElementById('modalIcon');
      const title = document.getElementById('modalTitle');
      const changeEl = document.getElementById('modalRatingChange');
      const newEloEl = document.getElementById('modalNewRating');

      let won = false;

      if (resign) {
        icon.innerText = '🏳️';
        title.innerText = 'Defeat';
        changeEl.innerText = '-15';
      } else if (game.in_checkmate()) {
        const winner = game.turn() === 'w' ? 'black' : 'white';
        if (winner === userSide) {
          won = true;
          icon.innerText = '🏆';
          title.innerText = 'Victory!';
          changeEl.innerText = '+20';
          if (gameMode === 'bot') {
            const currentLvl = parseInt(localStorage.getItem('chess_max_bot_unlocked') || '1');
            if (botLevel >= currentLvl) localStorage.setItem('chess_max_bot_unlocked', (currentLvl + 1).toString());
          }
        } else {
          icon.innerText = '💀';
          title.innerText = 'Defeat';
          changeEl.innerText = '-18';
        }
      } else {
        icon.innerText = '🤝';
        title.innerText = 'Draw';
        changeEl.innerText = '0';
      }

      const total = Math.max(1, userMoves);
      const acc = Math.min(95, Math.max(50, Math.round(((bestMoves * 1.5 + total) / (total * 2)) * 100)));
      document.getElementById('statAccuracy').innerText = `${acc}%`;
      document.getElementById('statBest').innerText = bestMoves;

      let calib = parseInt(localStorage.getItem('chess_calibration_games') || '0');
      if (calib < 5) {
        calib++;
        localStorage.setItem('chess_calibration_games', calib.toString());
        newEloEl.innerText = `Calibrating (${5 - calib} left)`;
      } else {
        newEloEl.innerText = '1200';
      }

      modal.classList.add('show');
    }

    document.getElementById('btnHint').onclick = () => {
      removeHighlights();
      const best = getBestMove(game);
      if (!best) return;
      $(`#board .square-${best.from}`).addClass('square-hint-from');
      $(`#board .square-${best.to}`).addClass('square-hint-to');
      document.getElementById('hintBox').classList.remove('hidden');
      document.getElementById('hintBox').innerText = `💡 Best move: ${best.piece.toUpperCase()} from ${best.from} to ${best.to}`;
    };

    document.getElementById('btnResign').onclick = () => {
      if (confirm('Resign match?')) endGame(true);
    };

    // Board Init (Using standard CDN pieces for 100% reliable load)
    board = Chessboard('board', {
      draggable: true,
      position: 'start',
      orientation: userSide,
      pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png',
      onDragStart: onDragStart,
      onDrop: onDrop,
      onSnapEnd: onSnapEnd
    });

    $(window).resize(board.resize);

    $(document).on('click touchend', '#board .square-55d63', function() {
      const sq = $(this).attr('data-square');
      if (sq) handleSquareClick(sq);
    });

    // Clock Interval
    timerInterval = setInterval(() => {
      if (game.game_over()) return;
      const isMyTurn = (game.turn() === 'w' && userSide === 'white') || (game.turn() === 'b' && userSide === 'black');
      if (isMyTurn) {
        userTime--;
        const m = Math.floor(userTime / 60).toString().padStart(2, '0');
        const s = (userTime % 60).toString().padStart(2, '0');
        document.getElementById('userClock').innerText = `${m}:${s}`;
      } else {
        opponentTime--;
        const m = Math.floor(opponentTime / 60).toString().padStart(2, '0');
        const s = (opponentTime % 60).toString().padStart(2, '0');
        document.getElementById('opponentClock').innerText = `${m}:${s}`;
      }
    }, 1000);
  </script>
</body>
  </html>
