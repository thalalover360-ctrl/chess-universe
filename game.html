<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Chess Universe - Arena</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
  <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>

  <style>
    body {
      background: radial-gradient(circle at top, #14241b 0%, #080f0c 100%);
      color: #e2e8f0;
      touch-action: manipulation;
    }
    
    /* Classic Chess.com Board */
    .white-1e1d7 { background-color: #ebecd0 !important; color: #739552 !important; }
    .black-3c85d { background-color: #739552 !important; color: #ebecd0 !important; }

    /* Piece Fix - No Floating, Centered Lock */
    .piece-417db {
      pointer-events: none !important;
      user-select: none !important;
    }

    /* Yellow Highlights */
    .highlight-yellow {
      background-color: rgba(247, 230, 80, 0.65) !important;
    }
    .square-selected {
      background-color: rgba(247, 230, 80, 0.75) !important;
    }

    /* Clean Native Dots */
    .hint-dot {
      width: 28%;
      height: 28%;
      background: rgba(30, 30, 30, 0.4);
      border-radius: 50%;
      position: absolute;
      top: 36%;
      left: 36%;
      pointer-events: none;
      z-index: 20;
    }
    .hint-capture-ring {
      width: 82%;
      height: 82%;
      border: 4px solid rgba(30, 30, 30, 0.45);
      border-radius: 50%;
      position: absolute;
      top: 9%;
      left: 9%;
      pointer-events: none;
      z-index: 20;
    }

    .active-clock {
      border-color: #10b981 !important;
      background: rgba(16, 185, 129, 0.2) !important;
      box-shadow: 0 0 16px -2px rgba(16, 185, 129, 0.6) !important;
      animation: pulse-border 1.4s infinite;
    }
    @keyframes pulse-border {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.02); }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col font-sans select-none items-center justify-between pb-4">

  <!-- Opponent Bar -->
  <header class="w-full max-w-md px-3 pt-3 flex flex-col gap-2">
    <div class="flex items-center justify-between bg-emerald-950/40 border border-emerald-900/60 px-3 py-2 rounded-2xl backdrop-blur shadow-lg">
      <div class="flex items-center gap-2.5">
        <a href="index.html" class="w-8 h-8 rounded-xl bg-slate-900 border border-slate-700 flex items-center justify-center text-slate-300 hover:text-white">
          <i class="fa-solid fa-chevron-left"></i>
        </a>
        <div class="flex items-center gap-2">
          <div class="w-8 h-8 rounded-xl bg-slate-900 border border-slate-700 flex items-center justify-center font-bold text-xs" id="oppAvatar">🤖</div>
          <div>
            <h2 id="oppName" class="text-xs font-black text-white leading-tight">Master Bot</h2>
            <span id="oppElo" class="text-[10px] text-emerald-400 font-mono font-bold">Rating: 1400</span>
          </div>
        </div>
      </div>
      <div id="oppClock" class="px-3 py-1.5 rounded-xl bg-slate-950 border border-slate-800 font-mono font-black text-sm text-slate-300 transition">
        10:00
      </div>
    </div>
  </header>

  <!-- Green Chessboard Container -->
  <main class="w-full max-w-md px-2 flex flex-col items-center justify-center my-auto">
    <div id="boardContainer" class="w-full max-w-[360px] rounded-2xl overflow-hidden border-4 border-emerald-950 shadow-2xl relative">
      <div id="chessBoard" class="w-full"></div>
    </div>
  </main>

  <!-- Player Bar & Controls -->
  <footer class="w-full max-w-md px-3 flex flex-col gap-2.5">
    <div class="flex items-center justify-between bg-emerald-950/40 border border-emerald-900/60 px-3 py-2 rounded-2xl backdrop-blur shadow-lg">
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-xl bg-emerald-500/20 border border-emerald-500/40 flex items-center justify-center font-bold text-xs text-emerald-400" id="playerAvatar">H</div>
        <div>
          <h2 id="playerName" class="text-xs font-black text-white leading-tight">Harsh Singh</h2>
          <span id="playerElo" class="text-[10px] text-emerald-400 font-mono font-bold">Rating: 1200</span>
        </div>
      </div>
      <div id="playerClock" class="px-3 py-1.5 rounded-xl bg-slate-950 border border-slate-800 font-mono font-black text-sm text-slate-300 transition">
        10:00
      </div>
    </div>

    <div class="flex gap-2">
      <button onclick="board.flip()" class="flex-1 py-2 bg-slate-900 hover:bg-slate-800 border border-slate-800 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1.5 text-slate-300">
        <i class="fa-solid fa-repeat"></i>
        <span>Flip</span>
      </button>
      <button onclick="resignGame()" class="flex-1 py-2 bg-rose-950/40 hover:bg-rose-900/60 border border-rose-800/80 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1.5 text-rose-300">
        <i class="fa-regular fa-flag"></i>
        <span>Resign</span>
      </button>
    </div>
  </footer>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const mode = urlParams.get('mode') || 'bot';
    const playerSide = (urlParams.get('side') || 'white').toLowerCase();
    const botLevel = urlParams.get('diff') || 'medium';

    const game = new Chess();
    let board = null;
    let whiteTime = 600;
    let blackTime = 600;
    let timerInterval = null;
    let isGameOver = false;

    let selectedSquare = null;
    let legalMovesList = [];
    let lastMove = { from: null, to: null };

    // Audio Engine
    let audioCtx = null;
    function playTone(freq, dur, type = 'sine') {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = type;
        osc.connect(g);
        g.connect(audioCtx.destination);
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        g.gain.setValueAtTime(0.15, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
        osc.start();
        osc.stop(audioCtx.currentTime + dur);
      } catch (e) {}
    }

    const sndMove = () => playTone(540, 0.08);
    const sndCapture = () => playTone(840, 0.12, 'triangle');
    const sndCheck = () => playTone(280, 0.22, 'sawtooth');

    // Profile & Elo
    const myName = localStorage.getItem('chess_name') || 'Harsh Singh';
    let savedElo = parseInt(localStorage.getItem('chess_rating'), 10);
    if (isNaN(savedElo) || !savedElo) savedElo = 1200;
    localStorage.setItem('chess_rating', savedElo);

    document.getElementById('playerName').innerText = myName;
    document.getElementById('playerAvatar').innerText = myName.charAt(0);
    document.getElementById('playerElo').innerText = 'Rating: ' + savedElo;

    if (mode === 'pass') {
      document.getElementById('oppName').innerText = 'Player 2';
      document.getElementById('oppAvatar').innerText = 'P2';
      document.getElementById('oppElo').innerText = 'Local PvP';
    }

    function removeHints() {
      $('#chessBoard .hint-dot, #chessBoard .hint-capture-ring').remove();
      $('#chessBoard .square-55d63').removeClass('square-selected');
    }

    function renderHighlights() {
      $('#chessBoard .square-55d63').removeClass('highlight-yellow');
      if (lastMove.from) $('#chessBoard .square-' + lastMove.from).addClass('highlight-yellow');
      if (lastMove.to) $('#chessBoard .square-' + lastMove.to).addClass('highlight-yellow');
    }

    function showHints(sq) {
      removeHints();
      selectedSquare = sq;
      $('#chessBoard .square-' + sq).addClass('square-selected');
      legalMovesList = game.moves({ square: sq, verbose: true });

      legalMovesList.forEach(m => {
        const $sq =$('#chessBoard .square-' + m.to);
        if ($sq.length) {
          const el = m.captured ? '<div class="hint-capture-ring"></div>' : '<div class="hint-dot"></div>';
          $sq.append(el);
        }
      });
    }

    function performMove(from, to) {
      removeHints();
      const move = game.move({ from: from, to: to, promotion: 'q' });
      if (!move) return false;

      lastMove = { from: from, to: to };
      selectedSquare = null;
      legalMovesList = [];

      board.position(game.fen());
      renderHighlights();

      if (move.captured) sndCapture();
      else if (game.in_check()) sndCheck();
      else sndMove();

      updateClocksUI();

      if (game.game_over()) {
        endGame(game.in_checkmate() ? (game.turn() === 'b' ? 'White wins!' : 'Black wins!') : 'Draw!');
        return true;
      }

      if (mode === 'bot') window.setTimeout(botTurn, 400);
      return true;
    }

    // Board Init: Pure Tap-To-Move (No Drag Glitches)
    board = Chessboard('chessBoard', {
      draggable: false,
      position: 'start',
      orientation: playerSide === 'black' ? 'black' : 'white',
      pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
    });

    $(window).resize(board.resize);

    // Click/Tap Square Handler
    $('#chessBoard').on('click touchstart', '.square-55d63', function (e) {
      e.preventDefault();
      if (game.game_over() || isGameOver) return;

      const sq = $(this).attr('data-square');
      if (!sq) return;

      // 1. Agar dot wale square pe tap kiya -> Direct chal do!
      const isLegal = legalMovesList.some(m => m.to === sq);
      if (selectedSquare && isLegal) {
        performMove(selectedSquare, sq);
        return;
      }

      // 2. Agar apne piece pe tap kiya -> Show dots
      const piece = game.get(sq);
      const turn = game.turn();
      const isMyTurn = (playerSide === 'white' && turn === 'w') || (playerSide === 'black' && turn === 'b') || (mode === 'pass');

      if (piece && piece.color === turn && isMyTurn) {
        showHints(sq);
      } else {
        removeHints();
        selectedSquare = null;
        legalMovesList = [];
      }
    });

    function botTurn() {
      if (game.game_over() || isGameOver) return;
      const legal = game.moves({ verbose: true });
      if (legal.length === 0) return;

      let moveChoice = legal[Math.floor(Math.random() * legal.length)];
      if (botLevel !== 'easy') {
        const caps = legal.filter(m => m.captured);
        if (caps.length > 0) moveChoice = caps[Math.floor(Math.random() * caps.length)];
      }

      game.move(moveChoice);
      board.position(game.fen());
      lastMove = { from: moveChoice.from, to: moveChoice.to };
      renderHighlights();

      if (moveChoice.captured) sndCapture();
      else if (game.in_check()) sndCheck();
      else sndMove();

      updateClocksUI();

      if (game.game_over()) {
        endGame(game.in_checkmate() ? (game.turn() === 'b' ? 'White wins!' : 'Black wins!') : 'Draw!');
      }
    }

    function updateClocksUI() {
      const pClock = document.getElementById('playerClock');
      const oClock = document.getElementById('oppClock');
      const turn = game.turn();
      const isMyTurn = (playerSide === 'white' && turn === 'w') || (playerSide === 'black' && turn === 'b');

      if (isMyTurn) {
        pClock.classList.add('active-clock');
        oClock.classList.remove('active-clock');
      } else {
        oClock.classList.add('active-clock');
        pClock.classList.remove('active-clock');
      }
    }

    timerInterval = setInterval(() => {
      if (isGameOver) return;
      if (game.turn() === 'w') whiteTime = Math.max(0, whiteTime - 1);
      else blackTime = Math.max(0, blackTime - 1);

      formatClock('playerClock', playerSide === 'white' ? whiteTime : blackTime);
      formatClock('oppClock', playerSide === 'white' ? blackTime : whiteTime);

      if (whiteTime === 0 || blackTime === 0) {
        endGame(whiteTime === 0 ? 'White ran out of time!' : 'Black ran out of time!');
      }
    }, 1000);

    function formatClock(id, s) {
      const m = Math.floor(s / 60);
      const sec = s % 60;
      document.getElementById(id).innerText = `${m}:${sec < 10 ? '0' : ''}${sec}`;
    }

    function endGame(res) {
      isGameOver = true;
      clearInterval(timerInterval);
      removeHints();

      const won = res.toLowerCase().includes(playerSide);
      const delta = won ? 16 : -14;
      const newElo = Math.max(100, savedElo + delta);

      localStorage.setItem('chess_rating', newElo);
      if (won) localStorage.setItem('chess_won', parseInt(localStorage.getItem('chess_won') || '0', 10) + 1);
      else localStorage.setItem('chess_lost', parseInt(localStorage.getItem('chess_lost') || '0', 10) + 1);

      const matchReport = {
        outcome: res,
        won: won,
        delta: delta,
        newElo: newElo,
        pgn: game.pgn(),
        moves: game.history(),
        timestamp: Date.now(),
        opponent: mode === 'pass' ? 'Player 2' : 'Master Bot (' + botLevel + ')',
        playedSide: playerSide
      };

      localStorage.setItem('last_match_analysis', JSON.stringify(matchReport));

      let historyList = [];
      try {
        historyList = JSON.parse(localStorage.getItem('chess_match_history') || '[]');
      } catch (e) {}
      historyList.unshift(matchReport);
      if (historyList.length > 20) historyList.pop();
      localStorage.setItem('chess_match_history', JSON.stringify(historyList));

      window.location.href = 'analysis.html';
    }

    function resignGame() {
      if (confirm('Kya sach me resign karna chahte ho?')) endGame('Opponent wins by Resignation.');
    }

    if (mode === 'bot' && playerSide === 'black') setTimeout(botTurn, 600);
    updateClocksUI();
  </script>
</body>
</html>
