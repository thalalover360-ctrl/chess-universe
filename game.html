    // Audio Engine via Web Audio API
    const SoundFx = {
      ctx: null,
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
      },
      play(freq, type, duration) {
        this.init();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
        gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + duration);
      },
      move() { this.play(350, 'sine', 0.08); },
      capture() { this.play(220, 'triangle', 0.12); },
      check() { this.play(650, 'sawtooth', 0.18); }
    };

    // State Variables
    const urlParams = new URLSearchParams(window.location.search);
    const gameMode = urlParams.get('mode') || 'bot';
    const matchType = urlParams.get('matchType') || 'rated';
    let userSide = (urlParams.get('side') === 'b' || urlParams.get('side') === 'black') ? 'black' : 'white';
    const roomId = urlParams.get('room');
    const botLevel = parseInt(urlParams.get('level') || '1');
    const botName = decodeURIComponent(urlParams.get('botName') || 'Noobie Bob');
    const botElo = urlParams.get('botElo') || '400';

    let game = new Chess();
    let board = null;
    let selectedSquare = null;
    let userTime = 600;
    let opponentTime = 600;
    let timerInterval = null;

    let userMoveCount = 0;
    let bestMoveCount = 0;
    let blunderCount = 0;

    // UI Labels & Hydration
    const matchPill = document.getElementById('matchTypePill');
    if (matchType === 'friendly') {
      matchPill.innerText = "☕ FRIENDLY";
      matchPill.className = "text-xs font-black px-2.5 py-1 rounded-full bg-slate-800 text-amber-400 border border-slate-700";
    }

    const userName = localStorage.getItem('chess_name') || 'Player';
    document.getElementById('userName').innerText = userName;
    document.getElementById('userAvatar').src = localStorage.getItem('chess_avatar') || `https://api.dicebear.com/7.x/bottts/svg?seed=${userName}`;
    document.getElementById('userElo').innerText = localStorage.getItem('chess_rating') || 'Calibrating (?)';

    if (gameMode === 'bot') {
      document.getElementById('opponentName').innerText = botName;
      document.getElementById('opponentElo').innerText = `Elo: ${botElo}`;
      document.getElementById('opponentAvatar').src = `https://api.dicebear.com/7.x/bottts/svg?seed=${botName}`;
    }

    // High Resolution Pieces Theme
    function customPieceTheme(piece) {
      const pieceMap = {
        'wP': 'https://upload.wikimedia.org/wikipedia/commons/4/45/Chess_plt45.svg',
        'wN': 'https://upload.wikimedia.org/wikipedia/commons/7/70/Chess_nlt45.svg',
        'wB': 'https://upload.wikimedia.org/wikipedia/commons/b/b1/Chess_blt45.svg',
        'wR': 'https://upload.wikimedia.org/wikipedia/commons/7/72/Chess_rlt45.svg',
        'wQ': 'https://upload.wikimedia.org/wikipedia/commons/1/15/Chess_qlt45.svg',
        'wK': 'https://upload.wikimedia.org/wikipedia/commons/4/42/Chess_klt45.svg',
        'bP': 'https://upload.wikimedia.org/wikipedia/commons/c/c7/Chess_pdt45.svg',
        'bN': 'https://upload.wikimedia.org/wikipedia/commons/e/ef/Chess_ndt45.svg',
        'bB': 'https://upload.wikimedia.org/wikipedia/commons/9/98/Chess_bdt45.svg',

      };
      return pieceMap[piece];
    }
        // Board Highlights Cleanup
    function removeHighlights() {
      $('#board .square-55d63').removeClass('legal-dot legal-capture square-selected square-hint-from square-hint-to square-check');
      $('#hintBox').addClass('hidden').text('');
    }

    // Show Legal Moves Dots & Rings
    function showLegalMoves(square) {
      removeHighlights();
      const moves = game.moves({ square: square, verbose: true });
      if (moves.length === 0) return;

      $(`#board .square-${square}`).addClass('square-selected');
      moves.forEach(m => {
        const sq = $(`#board .square-${m.to}`);
        if (m.captured) {
          sq.addClass('legal-capture');
        } else {
          sq.addClass('legal-dot');
        }
      });
    }

    // Tap-to-Move Logic for Mobile
    function handleSquareSelection(square) {
      if (game.game_over()) return;
      const isUserTurn = (game.turn() === 'w' && userSide === 'white') || (game.turn() === 'b' && userSide === 'black');
      if (!isUserTurn) return;

      const piece = game.get(square);

      if (selectedSquare) {
        if (selectedSquare === square) {
          selectedSquare = null;
          removeHighlights();
          return;
        }

        const move = game.move({
          from: selectedSquare,
          to: square,
          promotion: 'q'
        });

        if (move) {
          board.position(game.fen());
          selectedSquare = null;
          removeHighlights();
          processUserMoveEvaluation(move);
          return;
        }
      }

      if (piece && ((piece.color === 'w' && userSide === 'white') || (piece.color === 'b' && userSide === 'black'))) {
        selectedSquare = square;
        showLegalMoves(square);
      } else {
        selectedSquare = null;
        removeHighlights();
      }
    }

    // Drag and Drop Callbacks
    function onDragStart(source, piece) {
      if (game.game_over()) return false;
      const isUserTurn = (game.turn() === 'w' && userSide === 'white') || (game.turn() === 'b' && userSide === 'black');
      if (!isUserTurn) return false;
      const pieceColor = piece.search(/^b/) !== -1 ? 'black' : 'white';
      return pieceColor === userSide;
    }

    function onDrop(source, target) {
      removeHighlights();
      const move = game.move({
        from: source,
        to: target,
        promotion: 'q'
      });

      if (move === null) return 'snapback';
      processUserMoveEvaluation(move);
    }

    function onSnapEnd() {
      board.position(game.fen());
    }

    // Tactical Positional Piece-Square Tables (PST)
    const pstPawn = [
      0,  0,  0,  0,  0,  0,  0,  0,
      50, 50, 50, 50, 50, 50, 50, 50,
      10, 10, 20, 30, 30, 20, 10, 10,
      5,  5, 10, 25, 25, 10,  5,  5,
      0,  0,  0, 20, 20,  0,  0,  0,
      5, -5,-10,  0,  0,-10, -5,  5,
      5, 10, 10,-20,-20, 10, 10,  5,
      0,  0,  0,  0,  0,  0,  0,  0
    ];

    const pstKnight = [
      -50,-40,-30,-30,-30,-30,-40,-50,
      -40,-20,  0,  0,  0,  0,-20,-40,
      -30,  0, 10, 15, 15, 10,  0,-30,
      -30,  5, 15, 20, 20, 15,  5,-30,
      -30,  0, 15, 20, 20, 15,  0,-30,
      -30,  5, 10, 15, 15, 10,  5,-30,
      -40,-20,  0,  5,  5,  0,-20,-40,
      -50,-40,-30,-30,-30,-30,-40,-50
    ];

    function evaluateBoard(chessInstance) {
      let score = 0;
      const values = { p: 100, n: 320, b: 330, r: 500, q: 900, k: 20000 };
      const squares = chessInstance.SQUARES;

      for (let i = 0; i < squares.length; i++) {
        const p = chessInstance.get(squares[i]);
        if (p) {
          let val = values[p.type];
          if (p.type === 'p') val += pstPawn[i];
          if (p.type === 'n') val += pstKnight[i];
          score += (p.color === 'w' ? val : -val);
        }
      }
      return score;
    }

    function getBestTacticalMove(chessInstance) {
      const moves = chessInstance.moves({ verbose: true });
      if (moves.length === 0) return null;

      let bestScore = chessInstance.turn() === 'w' ? -Infinity : Infinity;
      let chosenMove = moves[0];

      for (let m of moves) {
        chessInstance.move(m);
        let evalScore = evaluateBoard(chessInstance);
        chessInstance.undo();

        if (chessInstance.turn() === 'w') {
          if (evalScore > bestScore) {
            bestScore = evalScore;
            chosenMove = m;
          }
        } else {
          if (evalScore < bestScore) {
            bestScore = evalScore;
            chosenMove = m;
          }
        }
      }
      return chosenMove;
    }

    // Bot AI Decision Making
    function triggerBotMove() {
      if (game.game_over()) return;
      const moves = game.moves({ verbose: true });
      if (moves.length === 0) return;

      let nextMove = null;

      if (botLevel === 1) {
        nextMove = Math.random() < 0.65 ? moves[Math.floor(Math.random() * moves.length)] : getBestTacticalMove(game);
      } else if (botLevel <= 4) {
        const attacks = moves.filter(m => m.captured || m.san.includes('+'));
        nextMove = (attacks.length > 0 && Math.random() < 0.7) ? attacks[Math.floor(Math.random() * attacks.length)] : getBestTacticalMove(game);
      } else {
        nextMove = getBestTacticalMove(game);
      }

      if (!nextMove) nextMove = moves[0];

      const res = game.move(nextMove);
      board.position(game.fen());

      if (game.in_check()) SoundFx.check();
      else if (res.captured) SoundFx.capture();
      else SoundFx.move();

      updateNotation(res);
      handlePostMoveState();
    }

    // Notation & Accuracy Logic
    function processUserMoveEvaluation(move) {
      userMoveCount++;
      const topMove = getBestTacticalMove(game);
      if (topMove && topMove.from === move.from && topMove.to === move.to) {
        bestMoveCount++;
      } else if (Math.random() < 0.08) {
        blunderCount++;
      }

      if (game.in_check()) SoundFx.check();
      else if (move.captured) SoundFx.capture();
      else SoundFx.move();

      updateNotation(move);
      handlePostMoveState();
    }

    function updateNotation(move) {
      const list = document.getElementById('movesList');
      const round = Math.ceil(game.history().length / 2);

      if (game.turn() === 'b') {
        const row = document.createElement('div');
        row.className = 'move-row flex items-center justify-between text-xs py-1 px-2';
        row.id = `row_${round}`;
        row.innerHTML = `<span class="text-slate-500 font-mono">${round}.</span><span class="font-bold text-slate-200">${move.san}</span><span id="b_${round}"></span>`;
        list.appendChild(row);
      } else {
        const cell = document.getElementById(`b_${round}`);
        if (cell) {
          cell.innerText = move.san;
          cell.className = "font-bold text-slate-200";
        }
      }
      list.scrollTop = list.scrollHeight;
    }
        // Post Move State Dispatcher
    function handlePostMoveState() {
      const pill = document.getElementById('gameStatusPill');
      pill.innerText = game.turn() === 'w' ? "White to move" : "Black to move";
      if (game.in_check()) pill.innerText += " (Check!)";

      if (game.game_over()) {
        clearInterval(timerInterval);
        handleMatchCompletion();
        return;
      }

      if (gameMode === 'bot') {
        const isBotTurn = (game.turn() === 'w' && userSide === 'black') || (game.turn() === 'b' && userSide === 'white');
        if (isBotTurn) {
          setTimeout(triggerBotMove, 400);
        }
      }

      if (gameMode === 'pvp' && roomId) {
        updateDoc(doc(db, "matches", roomId), {
          fen: game.fen(),
          turn: game.turn(),
          history: game.history(),
          updatedAt: Date.now()
        }).catch(console.error);
      }
    }

    // 2-Way Realtime WhatsApp Match Synchronization
    if (gameMode === 'pvp' && roomId) {
      const roomRef = doc(db, "matches", roomId);

      getDoc(roomRef).then((snap) => {
        if (snap.exists()) {
          const data = snap.data();
          if (data.creator !== userName) {
            const updatePayload = { status: 'playing' };
            if (userSide === 'black' && !data.black) {
              updatePayload.black = userName;
              updatePayload.blackElo = localStorage.getItem('chess_rating') || '?';
            } else if (userSide === 'white' && !data.white) {
              updatePayload.white = userName;
              updatePayload.whiteElo = localStorage.getItem('chess_rating') || '?';
            }
            updateDoc(roomRef, updatePayload);
          }
        }
      });

      onSnapshot(roomRef, (snap) => {
        if (!snap.exists()) return;
        const d = snap.data();

        if (userSide === 'white' && d.black) {
          document.getElementById('opponentName').innerText = d.black;
          document.getElementById('opponentElo').innerText = `Elo: ${d.blackElo || 1200}`;
          document.getElementById('opponentAvatar').src = `https://api.dicebear.com/7.x/bottts/svg?seed=${d.black}`;
        } else if (userSide === 'black' && d.white) {
          document.getElementById('opponentName').innerText = d.white;
          document.getElementById('opponentElo').innerText = `Elo: ${d.whiteElo || 1200}`;
          document.getElementById('opponentAvatar').src = `https://api.dicebear.com/7.x/bottts/svg?seed=${d.white}`;
        }

        if (d.fen && d.fen !== "start" && d.fen !== game.fen()) {
          game.load(d.fen);
          board.position(d.fen);
          SoundFx.move();

          const pill = document.getElementById('gameStatusPill');
          pill.innerText = game.turn() === 'w' ? "White to move" : "Black to move";
          if (game.in_check()) pill.innerText += " (Check!)";

          if (game.game_over()) {
            clearInterval(timerInterval);
            handleMatchCompletion();
          }
        }
      });
    }

    // Clocks
    function formatTime(sec) {
      const m = Math.floor(sec / 60).toString().padStart(2, '0');
      const s = (sec % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }

    function startClocks() {
      timerInterval = setInterval(() => {
        if (game.game_over()) return;
        const isUserTurn = (game.turn() === 'w' && userSide === 'white') || (game.turn() === 'b' && userSide === 'black');

        if (isUserTurn) {
          userTime--;
          const el = document.getElementById('userClock');
          el.innerText = formatTime(userTime);
          if (userTime <= 0) {
            clearInterval(timerInterval);
            handleMatchCompletion('timeout');
          }
        } else {
          opponentTime--;
          const el = document.getElementById('opponentClock');
          el.innerText = formatTime(opponentTime);
          if (opponentTime <= 0) {
            clearInterval(timerInterval);
            handleMatchCompletion('opponent_timeout');
          }
        }
      }, 1000);
    }

    // Hint & Resign Controls
    document.getElementById('btnHint').onclick = () => {
      removeHighlights();
      const best = getBestTacticalMove(game);
      if (!best) return;

      $(`#board .square-${best.from}`).addClass('square-hint-from');
      $(`#board .square-${best.to}`).addClass('square-hint-to');

      const box = document.getElementById('hintBox');
      box.classList.remove('hidden');
      box.innerText = `💡 Tactical Line: Move ${best.piece.toUpperCase()} from ${best.from} to ${best.to}`;
    };

    document.getElementById('btnResign').onclick = () => {
      if (confirm("Do you want to resign this match?")) {
        clearInterval(timerInterval);
        handleMatchCompletion('resigned');
      }
    };

    // Match Completion & 5-Match Calibration Engine
    function handleMatchCompletion(reason = null) {
      const modal = document.getElementById('gameModal');
      const icon = document.getElementById('modalIcon');
      const title = document.getElementById('modalTitle');
      const subtitle = document.getElementById('modalSubtitle');
      const changeEl = document.getElementById('modalRatingChange');
      const newEloEl = document.getElementById('modalNewRating');

      let userWon = false;
      let delta = 0;

      if (reason === 'resigned') {
        icon.innerText = "🏳️";
        title.innerText = "Defeat";
        subtitle.innerText = "You resigned the match";
        delta = -15;
      } else if (game.in_checkmate() || reason === 'opponent_timeout') {
        const winner = game.turn() === 'w' ? 'black' : 'white';
        if (winner === userSide || reason === 'opponent_timeout') {
          userWon = true;
          icon.innerText = "🏆";
          title.innerText = "Checkmate Victory!";
          subtitle.innerText = "Outstanding tactical play.";
          delta = 20;

          if (gameMode === 'bot') {
            const currentUnlocked = parseInt(localStorage.getItem('chess_max_bot_unlocked') || '1');
            if (botLevel >= currentUnlocked && currentUnlocked < 10) {
              localStorage.setItem('chess_max_bot_unlocked', (currentUnlocked + 1).toString());
            }
          }
        } else {
          icon.innerText = "💀";
          title.innerText = "Checkmated";
          subtitle.innerText = "Your king fell under attack.";
          delta = -18;
        }
      } else {
        icon.innerText = "🤝";
        title.innerText = "Drawn Match";
        subtitle.innerText = "Stalemate or insufficient pieces.";
        delta = 0;
      }

      const total = Math.max(1, userMoveCount);
      const accuracy = Math.min(96, Math.max(50, Math.round(((bestMoveCount * 1.5 + (total - blunderCount)) / (total * 2)) * 100)));

      document.getElementById('statAccuracy').innerText = `${accuracy}%`;
      document.getElementById('statBest').innerText = bestMoveCount;
      document.getElementById('statBlunders').innerText = blunderCount;

      let calibGames = parseInt(localStorage.getItem('chess_calibration_games') || '0');
      let calibScore = parseInt(localStorage.getItem('chess_calibration_score') || '0');

      if (matchType === 'friendly') {
        changeEl.innerText = "0 (Friendly)";
        newEloEl.innerText = localStorage.getItem('chess_rating') || "Calibrating (?)";
      } else if (calibGames < 5) {
        calibGames++;
        calibScore += userWon ? 1 : 0;
        localStorage.setItem('chess_calibration_games', calibGames.toString());
        localStorage.setItem('chess_calibration_score', calibScore.toString());

        if (calibGames >= 5) {
          const calculatedElo = 800 + (calibScore * 130) + Math.round(accuracy * 2);
          localStorage.setItem('chess_rating', calculatedElo.toString());
          changeEl.innerText = "Calibrated!";
          newEloEl.innerText = calculatedElo;
        } else {
          changeEl.innerText = `Game ${calibGames}/5`;
          newEloEl.innerText = `Calibrating (${5 - calibGames} left)`;
        }
      } else {
        let currentElo = parseInt(localStorage.getItem('chess_rating') || '1200');
        currentElo = Math.max(100, currentElo + delta);
        localStorage.setItem('chess_rating', currentElo.toString());
        changeEl.innerText = delta >= 0 ? `+${delta}` : `${delta}`;
        newEloEl.innerText = currentElo;
      }

      modal.classList.add('show');
    }

    document.getElementById('btnModalAction').onclick = () => {
      window.location.reload();
    };

    // Board Init
    board = Chessboard('board', {
      draggable: true,
      position: 'start',
      orientation: userSide,
      pieceTheme: customPieceTheme,
      onDragStart: onDragStart,
      onDrop: onDrop,
      onSnapEnd: onSnapEnd
    });

    startClocks();
    $(window).resize(board.resize);

    $(document).on('click touchend', '#board .square-55d63', function () {
      const sq = $(this).attr('data-square');
      if (sq) handleSquareSelection(sq);
    });

    if (gameMode === 'bot' && userSide === 'black') {
      setTimeout(triggerBotMove, 600);
    }
  </script>
</body>
</html>
