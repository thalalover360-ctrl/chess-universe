<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Chess Universe - Pro Arena</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
  <link rel="stylesheet" href="style.css">
  <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>

  <style>
    body {
      background: radial-gradient(circle at top, #14241b 0%, #080f0c 100%);
      color: #e2e8f0;
      touch-action: manipulation;
    }
    .white-1e1d7 { background-color: #ebecd0 !important; color: #739552 !important; }
    .black-3c85d { background-color: #739552 !important; color: #ebecd0 !important; }

    .piece-417db { pointer-events: none !important; user-select: none !important; }
    .highlight-yellow { background-color: rgba(247, 230, 80, 0.65) !important; }
    .square-selected { background-color: rgba(247, 230, 80, 0.75) !important; }

    .hint-dot {
      width: 28%; height: 28%;
      background: rgba(30, 30, 30, 0.45);
      border-radius: 50%;
      position: absolute; top: 36%; left: 36%;
      pointer-events: none; z-index: 20;
    }
    .hint-capture-ring {
      width: 82%; height: 82%;
      border: 4px solid rgba(30, 30, 30, 0.5);
      border-radius: 50%;
      position: absolute; top: 9%; left: 9%;
      pointer-events: none; z-index: 20;
    }

    .active-clock {
      border-color: #10b981 !important;
      background: rgba(16, 185, 129, 0.2) !important;
      box-shadow: 0 0 16px -2px rgba(16, 185, 129, 0.6) !important;
      animation: pulse-border 1.4s infinite;
    }
    @keyframes pulse-border {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.02); }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col font-sans select-none items-center justify-between pb-4">

  <!-- Opponent Bar -->
  <header class="w-full max-w-md px-3 pt-3 flex flex-col gap-2">
    <div class="flex items-center justify-between bg-emerald-950/40 border border-emerald-900/60 px-3 py-2 rounded-2xl backdrop-blur shadow-lg">
      <div class="flex items-center gap-2.5">
        <a href="index.html" class="w-8 h-8 rounded-xl bg-slate-900 border border-slate-700 flex items-center justify-center text-slate-300 hover:text-white">
          <i class="fa-solid fa-chevron-left"></i>
        </a>
        <div class="flex items-center gap-2">
          <div class="w-8 h-8 rounded-xl bg-slate-900 border border-slate-700 flex items-center justify-center font-bold text-xs" id="oppAvatar">🤖</div>
          <div>
            <h2 id="oppName" class="text-xs font-black text-white leading-tight">Master Bot</h2>
            <span id="oppElo" class="text-[10px] text-emerald-400 font-mono font-bold">Rating: 1400</span>
          </div>
        </div>
      </div>
      <div id="oppClock" class="px-3 py-1.5 rounded-xl bg-slate-950 border border-slate-800 font-mono font-black text-sm text-slate-300 transition">
        10:00
      </div>
    </div>
  </header>

  <!-- Chessboard Container -->
  <main class="w-full max-w-md px-2 flex flex-col items-center justify-center my-auto">
    <div id="boardContainer" class="w-full max-w-[360px] rounded-2xl overflow-hidden border-4 border-emerald-950 shadow-2xl relative">
      <div id="chessBoard" class="w-full"></div>
    </div>
  </main>

  <!-- Player Bar & Controls -->
  <footer class="w-full max-w-md px-3 flex flex-col gap-2.5">
    <div class="flex items-center justify-between bg-emerald-950/40 border border-emerald-900/60 px-3 py-2 rounded-2xl backdrop-blur shadow-lg">
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-xl bg-emerald-500/20 border border-emerald-500/40 flex items-center justify-center font-bold text-xs text-emerald-400" id="playerAvatar">P</div>
        <div>
          <h2 id="playerName" class="text-xs font-black text-white leading-tight">Player</h2>
          <span id="playerElo" class="text-[10px] text-emerald-400 font-mono font-bold">Rating: 1200</span>
        </div>
      </div>
      <div id="playerClock" class="px-3 py-1.5 rounded-xl bg-slate-950 border border-slate-800 font-mono font-black text-sm text-slate-300 transition">
        10:00
      </div>
    </div>

    <!-- 3 Action Controls: Flip, Last Move Peek, Resign -->
    <div class="flex gap-2">
      <button onclick="board.flip()" class="flex-1 py-2 bg-slate-900 hover:bg-slate-800 border border-slate-800 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1.5 text-slate-300">
        <i class="fa-solid fa-repeat"></i>
        <span>Flip</span>
      </button>

      <button id="btnPeekMove" onclick="togglePeekPreviousMove()" class="flex-1 py-2 bg-slate-900 hover:bg-slate-800 border border-slate-800 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1.5 text-amber-400">
        <i class="fa-solid fa-backward-step"></i>
        <span id="peekBtnText">Last Move</span>
      </button>

      <button onclick="resignGame()" class="flex-1 py-2 bg-rose-950/40 hover:bg-rose-900/60 border border-rose-800/80 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1.5 text-rose-300">
        <i class="fa-regular fa-flag"></i>
        <span>Resign</span>
      </button>
    </div>
  </footer>

  <!-- Highlighted Victory Modal -->
  <div id="gameOverModal" class="hidden fixed inset-0 z-50 bg-black/85 backdrop-blur-md flex items-center justify-center p-4">
    <div class="bg-slate-900 border-2 border-emerald-500/50 w-full max-w-sm rounded-3xl p-5 shadow-2xl flex flex-col items-center text-center gap-3.5">
      
      <div id="modalIcon" class="w-16 h-16 rounded-2xl bg-emerald-500/20 border border-emerald-500/40 flex items-center justify-center text-3xl shadow-lg mt-1">
        🏆
      </div>

      <div>
        <h2 id="highlightWinnerTitle" class="text-base font-black uppercase tracking-wider text-emerald-400 leading-tight">
          Match Concluded
        </h2>
        <p id="subReasonText" class="text-xs text-slate-400 font-medium mt-1">
          By Checkmate
        </p>
      </div>

      <div class="w-full bg-slate-950 border border-slate-800 rounded-2xl p-3 flex items-center justify-around font-mono text-xs">
        <div class="flex flex-col items-center">
          <span class="text-[10px] text-slate-500 uppercase font-bold">Rating</span>
          <span id="modalRatingDelta" class="font-black text-emerald-400 text-sm">+16 (1216)</span>
        </div>
        <div class="h-6 w-px bg-slate-800"></div>
        <div class="flex flex-col items-center">
          <span class="text-[10px] text-slate-500 uppercase font-bold">Rewards</span>
          <span id="modalRewards" class="font-black text-amber-400 text-sm">+50 🪙 | +2 💎</span>
        </div>
      </div>

      <div class="w-full flex flex-col gap-2 pt-1">
        <button onclick="goToAnalysis()" class="w-full py-3 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black rounded-xl text-xs uppercase tracking-wider transition shadow-lg flex items-center justify-center gap-2">
          <i class="fa-solid fa-chart-line"></i>
          <span>View Deep Analysis</span>
        </button>
        <div class="flex gap-2">
          <button onclick="location.reload()" class="flex-1 py-2.5 bg-slate-800 hover:bg-slate-700 text-white font-black rounded-xl text-xs transition border border-slate-700">
            Rematch ⚔️
          </button>
          <a href="index.html" class="flex-1 py-2.5 bg-slate-950 hover:bg-slate-800 text-slate-300 font-black rounded-xl text-xs transition border border-slate-800 flex items-center justify-center">
            Dashboard 🏠
          </a>
        </div>
      </div>

    </div>
  </div>
    <script>
    const urlParams = new URLSearchParams(window.location.search);
    const mode = urlParams.get('mode') || 'bot';
    const playerSide = (urlParams.get('side') || 'white').toLowerCase();
    const botLevel = urlParams.get('diff') || 'medium';

    const game = new Chess();
    let board = null;
    let whiteTime = 600;
    let blackTime = 600;
    let timerInterval = null;
    let isGameOver = false;

    let selectedSquare = null;
    let legalMovesList = [];
    let lastMove = { from: null, to: null };
    let isPeekingPrevious = false;

    // Profile & Elo
    const localPlayerName = localStorage.getItem('chess_name') || 'Harsh Singh';
    let savedElo = parseInt(localStorage.getItem('chess_rating'), 10);
    if (isNaN(savedElo) || !savedElo) savedElo = 1200;
    localStorage.setItem('chess_rating', savedElo);

    let oppDisplayName = 'Master Bot';
    if (mode === 'bot') {
      oppDisplayName = urlParams.get('botName') || `Bot (${botLevel.toUpperCase()})`;
    } else if (mode === 'pass') {
      oppDisplayName = 'Player 2';
    } else {
      oppDisplayName = urlParams.get('oppName') || 'Opponent';
    }

    document.getElementById('playerName').innerText = localPlayerName;
    document.getElementById('playerAvatar').innerText = localPlayerName.charAt(0).toUpperCase();
    document.getElementById('playerElo').innerText = 'Rating: ' + savedElo;

    document.getElementById('oppName').innerText = oppDisplayName;
    document.getElementById('oppAvatar').innerText = oppDisplayName.charAt(0).toUpperCase();
    document.getElementById('oppElo').innerText = mode === 'pass' ? 'Local Duel' : (urlParams.get('oppElo') ? 'Rating: ' + urlParams.get('oppElo') : 'Rating: 1400');

    // Audio Engine
    let audioCtx = null;
    function playTone(freq, dur, type = 'sine') {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = type;
        osc.connect(g);
        g.connect(audioCtx.destination);
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        g.gain.setValueAtTime(0.15, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
        osc.start();
        osc.stop(audioCtx.currentTime + dur);
      } catch (e) {}
    }

    const sndMove = () => playTone(540, 0.08);
    const sndCapture = () => playTone(840, 0.12, 'triangle');
    const sndCheck = () => playTone(280, 0.22, 'sawtooth');

    function removeHints() {
      $('#chessBoard .hint-dot, #chessBoard .hint-capture-ring').remove();
      $('#chessBoard .square-55d63').removeClass('square-selected');
    }

    function renderHighlights() {
      $('#chessBoard .square-55d63').removeClass('highlight-yellow');
      if (lastMove.from) $('#chessBoard .square-' + lastMove.from).addClass('highlight-yellow');
      if (lastMove.to) $('#chessBoard .square-' + lastMove.to).addClass('highlight-yellow');
    }

    function showHints(sq) {
      if (isPeekingPrevious) return;
      removeHints();
      selectedSquare = sq;
      $('#chessBoard .square-' + sq).addClass('square-selected');
      legalMovesList = game.moves({ square: sq, verbose: true });

      legalMovesList.forEach(m => {
        const $sq =$('#chessBoard .square-' + m.to);
        if ($sq.length) {
          const el = m.captured ? '<div class="hint-capture-ring"></div>' : '<div class="hint-dot"></div>';
          $sq.append(el);
        }
      });
    }

    function performMove(from, to) {
      if (isPeekingPrevious) togglePeekPreviousMove(); // Live board pe return karo pehle
      removeHints();
      const move = game.move({ from: from, to: to, promotion: 'q' });
      if (!move) return false;

      lastMove = { from: from, to: to };
      selectedSquare = null;
      legalMovesList = [];

      board.position(game.fen());
      renderHighlights();

      if (move.captured) sndCapture();
      else if (game.in_check()) sndCheck();
      else sndMove();

      updateClocksUI();

      if (game.game_over()) {
        checkGameResult();
        return true;
      }

      if (mode === 'bot') window.setTimeout(botTurn, 400);
      return true;
    }

    // Board Init
    board = Chessboard('chessBoard', {
      draggable: false,
      position: 'start',
      orientation: playerSide === 'black' ? 'black' : 'white',
      pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
    });

    $(window).resize(board.resize);

    // Tap-To-Move Click Handler
    $('#chessBoard').on('click touchstart', '.square-55d63', function (e) {
      e.preventDefault();
      if (game.game_over() || isGameOver) return;
      if (isPeekingPrevious) {
        togglePeekPreviousMove(); // Board tap par automatically live state par return
        return;
      }

      const sq = $(this).attr('data-square');
      if (!sq) return;

      const isLegal = legalMovesList.some(m => m.to === sq);
      if (selectedSquare && isLegal) {
        performMove(selectedSquare, sq);
        return;
      }

      const piece = game.get(sq);
      const turn = game.turn();
      const isMyTurn = (playerSide === 'white' && turn === 'w') || (playerSide === 'black' && turn === 'b') || (mode === 'pass');

      if (piece && piece.color === turn && isMyTurn) {
        showHints(sq);
      } else {
        removeHints();
        selectedSquare = null;
        legalMovesList = [];
      }
    });

    // PEEK PREVIOUS MOVE FUNCTION (No Rewind)
    function togglePeekPreviousMove() {
      const history = game.history();
      if (history.length === 0) {
        alert("Abhi koi move chala hi nahi gaya!");
        return;
      }

      const btnText = document.getElementById('peekBtnText');
      const btn = document.getElementById('btnPeekMove');

      if (!isPeekingPrevious) {
        // Pichle move ki position dikhao
        const tempSim = new Chess();
        for (let i = 0; i < history.length - 1; i++) {
          tempSim.move(history[i]);
        }
        board.position(tempSim.fen());
        removeHints();
        isPeekingPrevious = true;
        btnText.innerText = "Live Board";
        btn.classList.add('border-amber-500/80', 'bg-amber-500/20');
      } else {
        // Current live position par reset karo
        board.position(game.fen());
        renderHighlights();
        isPeekingPrevious = false;
        btnText.innerText = "Last Move";
        btn.classList.remove('border-amber-500/80', 'bg-amber-500/20');
      }
    }

    function botTurn() {
      if (game.game_over() || isGameOver) return;
      const legal = game.moves({ verbose: true });
      if (legal.length === 0) return;

      let moveChoice = legal[Math.floor(Math.random() * legal.length)];
      if (botLevel !== 'easy') {
        const caps = legal.filter(m => m.captured);
        if (caps.length > 0) moveChoice = caps[Math.floor(Math.random() * caps.length)];
      }

      game.move(moveChoice);
      board.position(game.fen());
      lastMove = { from: moveChoice.from, to: moveChoice.to };
      renderHighlights();

      if (moveChoice.captured) sndCapture();
      else if (game.in_check()) sndCheck();
      else sndMove();

      updateClocksUI();

      if (game.game_over()) checkGameResult();
    }

    function updateClocksUI() {
      const pClock = document.getElementById('playerClock');
      const oClock = document.getElementById('oppClock');
      const turn = game.turn();
      const isMyTurn = (playerSide === 'white' && turn === 'w') || (playerSide === 'black' && turn === 'b');

      if (isMyTurn) {
        pClock.classList.add('active-clock');
        oClock.classList.remove('active-clock');
      } else {
        oClock.classList.add('active-clock');
        pClock.classList.remove('active-clock');
      }
    }

    timerInterval = setInterval(() => {
      if (isGameOver) return;
      if (game.turn() === 'w') whiteTime = Math.max(0, whiteTime - 1);
      else blackTime = Math.max(0, blackTime - 1);

      formatClock('playerClock', playerSide === 'white' ? whiteTime : blackTime);
      formatClock('oppClock', playerSide === 'white' ? blackTime : whiteTime);

      if (whiteTime === 0 || blackTime === 0) {
        const winnerColor = whiteTime === 0 ? 'Black' : 'White';
        concludeMatch(winnerColor, 'Timeout');
      }
    }, 1000);

    function formatClock(id, s) {
      const m = Math.floor(s / 60);
      const sec = s % 60;
      document.getElementById(id).innerText = `${m}:${sec < 10 ? '0' : ''}${sec}`;
    }

    function checkGameResult() {
      if (game.in_checkmate()) {
        const winnerColor = game.turn() === 'b' ? 'White' : 'Black';
        concludeMatch(winnerColor, 'Checkmate');
      } else if (game.in_draw()) {
        concludeMatch('Draw', 'Stalemate / Draw');
      }
    }

    // Dynamic Winner Resolution & Guaranteed LocalStorage Save
    function concludeMatch(winnerColor, reason) {
      if (isGameOver) return;
      isGameOver = true;
      clearInterval(timerInterval);
      removeHints();

      if (isPeekingPrevious) {
        board.position(game.fen());
        isPeekingPrevious = false;
      }

      let whitePlayerName = playerSide === 'white' ? localPlayerName : oppDisplayName;
      let blackPlayerName = playerSide === 'black' ? localPlayerName : oppDisplayName;

      let isWin = false;
      let winnerText = '';

      if (winnerColor === 'Draw') {
        winnerText = "Match Drawn 🤝";
      } else {
        const winningName = winnerColor === 'White' ? whitePlayerName : blackPlayerName;
        isWin = winningName === localPlayerName;
        winnerText = `🎉 ${winningName} (${winnerColor}) Won!`;
      }

      const delta = winnerColor === 'Draw' ? 0 : (isWin ? 16 : -14);
      const newElo = Math.max(100, savedElo + delta);
      localStorage.setItem('chess_rating', newElo);

      if (isWin) {
        localStorage.setItem('chess_won', parseInt(localStorage.getItem('chess_won') || '0', 10) + 1);
      } else if (winnerColor !== 'Draw') {
        localStorage.setItem('chess_lost', parseInt(localStorage.getItem('chess_lost') || '0', 10) + 1);
      }

      const rewardCoins = isWin ? 50 : (winnerColor === 'Draw' ? 20 : 10);
      const rewardDiamonds = isWin ? 2 : (winnerColor === 'Draw' ? 1 : 0);

      const curCoins = parseInt(localStorage.getItem('chess_coins') || '250', 10) + rewardCoins;
      const curDiamonds = parseInt(localStorage.getItem('chess_diamonds') || '5', 10) + rewardDiamonds;
      localStorage.setItem('chess_coins', curCoins);
      localStorage.setItem('chess_diamonds', curDiamonds);

      const matchOpponent = playerSide === 'white' ? blackPlayerName : whitePlayerName;

      const matchReport = {
        outcome: winnerText,
        won: isWin,
        delta: delta,
        newElo: newElo,
        pgn: game.pgn(),
        moves: game.history(),
        timestamp: Date.now(),
        opponent: matchOpponent,
        playedSide: playerSide,
        rewardCoins: rewardCoins
      };

      // Guaranteed Save
      try {
        localStorage.setItem('last_match_analysis', JSON.stringify(matchReport));
        let historyList = JSON.parse(localStorage.getItem('chess_match_history') || '[]');
        historyList.unshift(matchReport);
        if (historyList.length > 20) historyList.pop();
        localStorage.setItem('chess_match_history', JSON.stringify(historyList));
      } catch (err) {
        console.error("Match save error:", err);
      }

      // Display Modal
      document.getElementById('highlightWinnerTitle').innerText = winnerText;
      document.getElementById('subReasonText').innerText = `By ${reason}`;
      document.getElementById('modalRatingDelta').innerText = `${delta >= 0 ? '+' : ''}${delta} (${newElo})`;
      document.getElementById('modalRewards').innerText = `+${rewardCoins} 🪙 | +${rewardDiamonds} 💎`;
      
      const modalIcon = document.getElementById('modalIcon');
      if (isWin) {
        modalIcon.innerText = "🏆";
        modalIcon.className = "w-16 h-16 rounded-2xl bg-emerald-500/20 border border-emerald-500/40 flex items-center justify-center text-3xl shadow-lg mt-1";
        document.getElementById('highlightWinnerTitle').className = "text-base font-black uppercase tracking-wider text-emerald-400 leading-tight";
      } else if (winnerColor === 'Draw') {
        modalIcon.innerText = "🤝";
        modalIcon.className = "w-16 h-16 rounded-2xl bg-slate-800 border border-slate-700 flex items-center justify-center text-3xl shadow-lg mt-1";
        document.getElementById('highlightWinnerTitle').className = "text-base font-black uppercase tracking-wider text-slate-300 leading-tight";
      } else {
        modalIcon.innerText = "💀";
        modalIcon.className = "w-16 h-16 rounded-2xl bg-rose-500/20 border border-rose-500/40 flex items-center justify-center text-3xl shadow-lg mt-1";
        document.getElementById('highlightWinnerTitle').className = "text-base font-black uppercase tracking-wider text-rose-400 leading-tight";
      }

      document.getElementById('gameOverModal').classList.remove('hidden');
    }

    function goToAnalysis() {
      window.location.href = 'analysis.html';
    }

    function resignGame() {
      if (confirm('Are you sure you want to resign?')) {
        const winnerColor = playerSide === 'white' ? 'Black' : 'White';
        concludeMatch(winnerColor, 'Resignation');
      }
    }

    if (mode === 'bot' && playerSide === 'black') setTimeout(botTurn, 600);
    updateClocksUI();
  </script>
</body>
</html>
