<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bots Lounge | Chess Universe</title>
  
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="script.js" defer></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

  <!-- Top Navbar -->
  <header class="navbar">
    <div class="nav-brand">
      <a href="index.html">
        <span class="brand-icon">♞</span>
        <span>CHESS UNIVERSE</span>
      </a>
    </div>

    <div class="nav-links">
      <a href="index.html" class="nav-item">Lobby</a>
      <a href="bots.html" class="nav-item active text-emerald-400">Bots Lounge</a>
      <a href="multiplayer.html" class="nav-item">Play Online</a>
    </div>

    <div class="user-badge" onclick="window.location.href='index.html'">
      <img id="navAvatar" src="https://api.dicebear.com/7.x/bottts/svg?seed=Player" class="user-avatar" alt="Avatar">
      <div class="hidden sm:block text-left">
        <div id="navName" class="user-name">Player</div>
      </div>
      <span id="navElo" class="elo-pill">?</span>
    </div>
  </header>

  <!-- Main Campaign Container -->
  <main class="flex-1 max-w-6xl w-full mx-auto p-4 sm:p-6 space-y-6">
    
    <!-- Campaign Header Banner -->
    <div class="glass-card p-6 rounded-3xl border border-slate-800 flex flex-col md:flex-row items-center justify-between gap-4">
      <div>
        <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-xs font-bold uppercase mb-2">
          <span>⚔️</span> Bot Championship Campaign
        </div>
        <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight">Defeat Bots To Unlock Next Tier</h1>
        <p class="text-xs sm:text-sm text-slate-400 mt-1">
          Defeat each challenger in official combat to unlock the next level and reach the Final Boss: <span class="text-amber-400 font-bold">Supremo360</span>.
        </p>
      </div>

      <div class="flex items-center gap-3 bg-slate-900/80 p-3 rounded-2xl border border-slate-800">
        <div class="text-center px-3 border-r border-slate-800">
          <span class="text-[10px] text-slate-400 uppercase font-bold block">Current Tier</span>
          <span id="campaignTier" class="text-lg font-black text-emerald-400">Level 1</span>
        </div>
        <div class="text-center px-3">
          <span class="text-[10px] text-slate-400 uppercase font-bold block">Defeated</span>
          <span id="campaignProgress" class="text-lg font-black text-slate-200">0 / 10</span>
        </div>
      </div>
    </div>

    <!-- Bots Grid List -->
    <div class="bot-grid" id="botGrid"></div>

  </main>

  <script>
    // Auth Check
    if (!localStorage.getItem('chess_auth')) {
      window.location.href = 'login.html';
    }

    // Populate Nav
    document.getElementById('navName').innerText = localStorage.getItem('chess_name') || 'Player';
    document.getElementById('navAvatar').src = localStorage.getItem('chess_avatar') || 'https://api.dicebear.com/7.x/bottts/svg?seed=Player';
    document.getElementById('navElo').innerText = localStorage.getItem('chess_rating') || '?';

    // Campaign Progress from localStorage
    const unlockedLevel = parseInt(localStorage.getItem('chess_max_bot_unlocked') || '1');
    document.getElementById('campaignTier').innerText = `Level ${unlockedLevel}`;
    document.getElementById('campaignProgress').innerText = `${unlockedLevel - 1} / 10`;

    // 10-Tier Bot Profiles
    const botData = [
      { level: 1, name: "Noobie Bob", elo: 400, desc: "Random mistakes, blunder-prone pawn pusher.", avatar: "Bob" },
      { level: 2, name: "Gully Boy", elo: 550, desc: "Attacks without defending pieces.", avatar: "Gully" },
      { level: 3, name: "Desi Hustler", elo: 750, desc: "Hunting aggressive early-queen moves.", avatar: "Hustler" },
      { level: 4, name: "Tactician Raju", elo: 950, desc: "Spots simple forks and free captures.", avatar: "Raju" },
      { level: 5, name: "Solid Suresh", elo: 1150, desc: "Plays principled pawn openings.", avatar: "Suresh" },
      { level: 6, name: "Sharp Shweta", elo: 1350, desc: "Aggressive tactical pins and skewers.", avatar: "Shweta" },
      { level: 7, name: "Master Sharma", elo: 1550, desc: "Deep positional maneuvering.", avatar: "Sharma" },
      { level: 8, name: "Iron Fortress", elo: 1750, desc: "Unforgiving defensive fortress.", avatar: "Fortress" },
      { level: 9, name: "Vishy 2.0", elo: 1950, desc: "Speed master with lightning counters.", avatar: "Vishy" },
      { level: 10, name: "Supremo360", elo: 2200, desc: "The Ultimate Grandmaster Final Boss.", avatar: "Supremo360", boss: true }
    ];

    const grid = document.getElementById('botGrid');

    botData.forEach(bot => {
      const isLocked = bot.level > unlockedLevel;
      const card = document.createElement('div');
      card.className = `bot-card ${isLocked ? 'locked-card' : ''} ${bot.boss ? 'border-amber-500/40' : ''}`;

      let overlayHtml = '';
      if (isLocked) {
        overlayHtml = `
          <div class="padlock-overlay">
            <span class="padlock-icon">🔒</span>
            <span class="padlock-text">Defeat Level ${bot.level - 1} to Unlock</span>
          </div>
        `;
      }

      card.innerHTML = `
        ${overlayHtml}
        <div class="flex items-center gap-3 mb-3">
          <img src="https://api.dicebear.com/7.x/bottts/svg?seed=${bot.avatar}" class="w-12 h-12 rounded-xl bg-slate-900 border border-slate-700" alt="${bot.name}">
          <div>
            <div class="flex items-center gap-2">
              <h3 class="text-sm font-extrabold ${bot.boss ? 'text-amber-400' : 'text-slate-100'}">${bot.name}</h3>
              ${bot.boss ? '<span class="text-[9px] bg-amber-500/20 text-amber-300 font-extrabold px-1.5 py-0.5 rounded">BOSS</span>' : ''}
            </div>
            <span class="text-xs text-slate-400 font-mono">Elo: ${bot.elo}</span>
          </div>
        </div>
        <p class="text-xs text-slate-400 flex-1 mb-4 leading-relaxed">${bot.desc}</p>
        <button class="w-full ${isLocked ? 'bg-slate-800 text-slate-500 cursor-not-allowed' : (bot.boss ? 'btn-gold font-extrabold' : 'btn-primary text-xs')} py-2.5 rounded-xl transition">
          ${isLocked ? 'Locked 🔒' : 'Challenge Bot ⚔️'}
        </button>
      `;

      if (!isLocked) {
        card.onclick = () => {
          window.location.href = `game.html?mode=bot&level=${bot.level}&botName=${encodeURIComponent(bot.name)}&botElo=${bot.elo}&side=white`;
        };
      }

      grid.appendChild(card);
    });
  </script>
</body>
</html>
