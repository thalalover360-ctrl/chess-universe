  <style>
    body { 
      background-color: #07090e; 
      color: #f8fafc;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    }
    .tile-hint-from {
      background-color: #0284c7 !important;
      box-shadow: inset 0 0 0 3px #38bdf8 !important;
    }
    .tile-hint-to {
      background-color: #0369a1 !important;
      box-shadow: inset 0 0 0 4px #7dd3fc !important;
      position: relative;
    }
    .tile-hint-to::after {
      content: '★';
      position: absolute;
      font-size: 22px;
      color: #fde047;
      pointer-events: none;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.6));
    }
    .badge-star {
      background: linear-gradient(135deg, #059669 0%, #10b981 100%);
      color: #ffffff;
      border: 1px solid rgba(16, 185, 129, 0.4);
      box-shadow: 0 0 12px rgba(16, 185, 129, 0.35);
    }
    .badge-good {
      background: linear-gradient(135deg, #0284c7 0%, #38bdf8 100%);
      color: #ffffff;
      border: 1px solid rgba(56, 189, 248, 0.4);
    }
    .badge-mistake {
      background: linear-gradient(135deg, #d97706 0%, #f59e0b 100%);
      color: #ffffff;
      border: 1px solid rgba(245, 158, 11, 0.4);
    }
    .badge-blunder {
      background: linear-gradient(135deg, #b91c1c 0%, #ef4444 100%);
      color: #ffffff;
      border: 1px solid rgba(239, 68, 68, 0.5);
      box-shadow: 0 0 14px rgba(239, 68, 68, 0.4);
    }
  </style>
</head>

    <script>

      { id: 8, name: "Dracula", title: "International Master", elo: 2250, depth: 4, blunderRate: 0.00, style: "Wild Sacrifices", avatar: "https://api.dicebear.com/7.x/bottts/svg?seed=Dracula" },
      { id: 9, name: "Chanakya GM", title: "Grandmaster", elo: 2500, depth: 5, blunderRate: 0.00, style: "Flawless Strategy", avatar: "https://api.dicebear.com/7.x/bottts/svg?seed=Chanakya" },
      { id: 10, name: "Kalki AI", title: "Apex Immortal", elo: 2800, depth: 6, blunderRate: 0.00, style: "Deep Tactical Annihilation", avatar: "https://api.dicebear.com/7.x/bottts/svg?seed=Kalki" }

    let currentBot = BOTS[3]; // Default: Rani The Fox
    const game = new Chess();
    let selectedSquare = null;
    let hintMove = null;
    let previousEval = 0;
    let userTime = 600;
    let botTime = 600;

    const VALS = { p: 100, n: 320, b: 330, r: 500, q: 900, k: 20000 };

    // Bot Loader & Profile Updater
    function loadBot(bot) {
      currentBot = bot;
      document.getElementById('botName').innerText = `${bot.name} (${bot.title})`;
      document.getElementById('botElo').innerText = `${bot.elo} Elo`;
      document.getElementById('botDepthText').innerText = `Depth: ${bot.depth}`;
      document.getElementById('botStyleBadge').innerText = bot.style;
      document.getElementById('botAvatar').src = bot.avatar;
    }

    // Modal List Renderer
    function renderBotSelectorList() {
      const container = document.getElementById('botsListGrid');
      container.innerHTML = '';

      BOTS.forEach(b => {
        const item = document.createElement('div');
        const isActive = currentBot.id === b.id;
        item.className = `p-3.5 rounded-2xl border transition-all cursor-pointer flex items-center justify-between ${isActive ? 'bg-emerald-500/10 border-emerald-500/50 shadow-md' : 'bg-slate-950/80 border-slate-800 hover:border-slate-700'}`;
        item.innerHTML = `
          <div class="flex items-center gap-3">
            <img src="${b.avatar}" class="w-12 h-12 rounded-xl bg-slate-900 border border-slate-700 object-cover shadow" alt="">
            <div>
              <div class="flex items-center gap-2">
                <h4 class="text-xs font-black text-white">${b.name}</h4>
                <span class="text-[10px] text-emerald-400 font-mono font-bold px-1.5 py-0.5 rounded bg-emerald-500/10 border border-emerald-500/20">${b.elo} Elo</span>
              </div>
              <p class="text-[11px] text-slate-400 mt-0.5 font-medium">${b.title} • ${b.style}</p>
            </div>
          </div>
          <button class="text-xs font-black px-3.5 py-1.5 rounded-xl border transition ${isActive ? 'bg-emerald-500 text-slate-950 border-emerald-400 shadow-md shadow-emerald-500/20' : 'bg-slate-800 hover:bg-slate-700 text-slate-200 border-slate-700'}">
            ${isActive ? 'Active' : 'Fight ⚔️'}
          </button>
        `;
        item.onclick = () => {
          loadBot(b);
          document.getElementById('botSelectorModal').classList.add('hidden');
          game.reset();
          selectedSquare = null;
          hintMove = null;
          previousEval = 0;
          userTime = 600;
          botTime = 600;
          updateEvalBar(0);
          renderBoard();
        };
        container.appendChild(item);
      });
    }

    document.getElementById('btnOpenBotSelector').onclick = () => {
      renderBotSelectorList();
      document.getElementById('botSelectorModal').classList.remove('hidden');
    };
    document.getElementById('btnCloseBotSelector').onclick = () => {
      document.getElementById('botSelectorModal').classList.add('hidden');
    };

    // User Profile Binder
    document.getElementById('userName').innerText = localStorage.getItem('chess_name') || 'Player';
    document.getElementById('userUID').innerText = 'UID: ' + (localStorage.getItem('chess_game_uid') || '1029384756');
    document.getElementById('userAvatar').src = localStorage.getItem('chess_avatar') || 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=100&h=100&fit=crop&crop=faces';
          function loadBot(bot) {
      currentBot = bot;
      document.getElementById('botName').innerText = `${bot.name} (${bot.title})`;
      document.getElementById('botElo').innerText = `${bot.elo} Elo`;
      document.getElementById('botStyleBadge').innerText = bot.style;
      document.getElementById('botAvatar').src = bot.avatar;
      document.getElementById('botDepthText').innerText = `Depth: ${bot.depth}`;
    }

    function renderBotSelectorList() {
      const container = document.getElementById('botsListGrid');
      container.innerHTML = '';

      BOTS.forEach(b => {
        const item = document.createElement('div');
        const isActive = currentBot.id === b.id;
        item.className = `p-3 rounded-2xl border transition cursor-pointer flex items-center justify-between ${isActive ? 'bg-emerald-500/15 border-emerald-500/50' : 'bg-slate-950/70 border-slate-800 hover:border-slate-700'}`;
        item.innerHTML = `
          <div class="flex items-center gap-3">
            <img src="${b.avatar}" class="w-11 h-11 rounded-xl bg-slate-900 border border-slate-700 shadow" alt="">
            <div>
              <div class="flex items-center gap-2">
                <h4 class="text-xs font-black text-white">${b.name}</h4>
                <span class="text-[10px] text-emerald-400 font-mono font-bold">${b.elo} Elo</span>
              </div>
              <p class="text-[11px] text-slate-400 font-medium">${b.title} • ${b.style}</p>
            </div>
          </div>
          <button class="text-xs font-bold px-3 py-1.5 rounded-xl border transition ${isActive ? 'bg-emerald-500 text-slate-950 border-emerald-400' : 'bg-slate-800 text-slate-200 border-slate-700 hover:bg-slate-700'}">
            ${isActive ? 'Active' : 'Fight'}
          </button>
        `;
        item.onclick = () => {
          loadBot(b);
          document.getElementById('botSelectorModal').classList.add('hidden');
          game.reset();
          selectedSquare = null;
          hintMove = null;
          previousEval = 0;
          userTime = 600;
          botTime = 600;
          updateEvalBar(0);
          renderBoard();
        };
        container.appendChild(item);
      });
    }

    // Modal Events
    document.getElementById('btnOpenBotSelector').onclick = () => {
      renderBotSelectorList();
      document.getElementById('botSelectorModal').classList.remove('hidden');
    };
    document.getElementById('btnCloseBotSelector').onclick = () => {
      document.getElementById('botSelectorModal').classList.add('hidden');
    };

    // User Profile Load
    document.getElementById('userName').innerText = localStorage.getItem('chess_name') || 'Player';
    document.getElementById('userUID').innerText = 'UID: ' + (localStorage.getItem('chess_game_uid') || '1029384756');
    document.getElementById('userAvatar').src = localStorage.getItem('chess_avatar') || 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=100&h=100&fit=crop&crop=faces';

    function renderBoard() {
      const boardEl = document.getElementById('board');
      boardEl.innerHTML = '';

      const ranks = [8, 7, 6, 5, 4, 3, 2, 1];
      const files = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];

      ranks.forEach((rank, rIdx) => {
        files.forEach((file, fIdx) => {
          const sq = `${file}${rank}`;
          const isDark = (rIdx + fIdx) % 2 === 1;
          const tile = document.createElement('div');
          tile.className = `chess-tile ${isDark ? 'tile-dark' : 'tile-light'}`;
          tile.dataset.square = sq;

          const piece = game.get(sq);
          if (piece) {
            const img = document.createElement('img');
            img.src = PIECE_SVGS[piece.color + piece.type.toUpperCase()];
            img.className = 'piece-img';
            tile.appendChild(img);
          }

          if (selectedSquare === sq) tile.classList.add('tile-selected');
          
          if (hintMove) {
            if (hintMove.from === sq) tile.classList.add('tile-hint-from');
            if (hintMove.to === sq) tile.classList.add('tile-hint-to');
          }

          tile.onclick = () => onTileClick(sq);
          boardEl.appendChild(tile);
        });
      });

      highlightLegalMoves();
    }

    function highlightLegalMoves() {
      if (!selectedSquare) return;
      const moves = game.moves({ square: selectedSquare, verbose: true });
      moves.forEach(m => {
        const el = document.querySelector(`[data-square="${m.to}"]`);
        if (el) {
          if (m.captured) el.classList.add('tile-capture');
          else el.classList.add('tile-dot');
        }
      });
    }

    function onTileClick(sq) {
      if (game.game_over() || game.turn() !== 'w') return;
      hintMove = null;
      const piece = game.get(sq);

      if (selectedSquare) {
        if (selectedSquare === sq) {
          selectedSquare = null;
          renderBoard();
          return;
        }

        const move = game.move({ from: selectedSquare, to: sq, promotion: 'q' });
        if (move) {
          selectedSquare = null;
          renderBoard();
          analyzeMoveQuality(move);
          handleBotTurn();
          return;
        }
      }

      if (piece && piece.color === 'w') {
        selectedSquare = sq;
      } else {
        selectedSquare = null;
      }
      renderBoard();
      }
          // High Precision Static Board Evaluator (Material + PST Tables)
    function evaluateBoard() {
      let score = 0;
      const b = game.board();
      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          const p = b[r][c];
          if (!p) continue;
          let val = VALS[p.type] || 0;
          const idx = r * 8 + c;
          const table = PST[p.type];
          if (table) {
            val += (p.color === 'w' ? table[idx] : table[63 - idx]);
          }
          score += p.color === 'w' ? val : -val;
        }
      }
      return score;
    }

    // Live Move Classification Badges
    function analyzeMoveQuality(userMove) {
      const newEval = evaluateBoard();
      const evalDiff = newEval - previousEval;
      previousEval = newEval;

      const badge = document.getElementById('moveBadge');

      if (evalDiff >= 150 || userMove.san.includes('#')) {
        badge.className = "text-xs font-black px-2.5 py-1 rounded-lg badge-star";
        badge.innerText = "⭐ Star Move!";
      } else if (evalDiff >= -35) {
        badge.className = "text-xs font-black px-2.5 py-1 rounded-lg badge-good";
        badge.innerText = "👍 Good Move";
      } else if (evalDiff >= -150) {
        badge.className = "text-xs font-black px-2.5 py-1 rounded-lg badge-mistake";
        badge.innerText = "⚠️ Inaccuracy";
      } else {
        badge.className = "text-xs font-black px-2.5 py-1 rounded-lg badge-blunder";
        badge.innerText = "🔴 Blunder!";
      }

      updateEvalBar(newEval);
    }

    function updateEvalBar(centipawns) {
      const score = (centipawns / 100).toFixed(1);
      const scoreEl = document.getElementById('evalScoreText');
      scoreEl.innerText = score > 0 ? `+${score}` : `${score}`;

      const whitePct = Math.max(10, Math.min(90, 50 + centipawns / 30));
      document.getElementById('evalBarWhite').style.width = `${whitePct}%`;
      document.getElementById('evalBarBlack').style.width = `${100 - whitePct}%`;
    }

    // Alpha-Beta Minimax Engine with Pruning
    function minimax(depth, isMaximizing, alpha, beta) {
      if (depth === 0 || game.game_over()) return evaluateBoard();

      const moves = game.moves({ verbose: true });
      if (isMaximizing) {
        let maxEval = -Infinity;
        for (const m of moves) {
          game.move(m);
          const ev = minimax(depth - 1, false, alpha, beta);
          game.undo();
          maxEval = Math.max(maxEval, ev);
          alpha = Math.max(alpha, ev);
          if (beta <= alpha) break;
        }
        return maxEval;
      } else {
        let minEval = Infinity;
        for (const m of moves) {
          game.move(m);
          const ev = minimax(depth - 1, true, alpha, beta);
          game.undo();
          minEval = Math.min(minEval, ev);
          beta = Math.min(beta, ev);
          if (beta <= alpha) break;
        }
        return minEval;
      }
    }
          // Bot Execution Engine Loop
    function handleBotTurn() {
      document.getElementById('turnIndicator').innerText = `${currentBot.name} calculating...`;
      if (game.game_over()) return checkGameOver();

      setTimeout(() => {
        const moves = game.moves({ verbose: true });
        if (moves.length === 0) return checkGameOver();

        let chosenMove = null;

        // Controlled Blunder injection for beginner bots
        if (Math.random() < currentBot.blunderRate) {
          chosenMove = moves[Math.floor(Math.random() * moves.length)];
        } else {
          let bestVal = Infinity;
          for (const m of moves) {
            game.move(m);
            const val = minimax(currentBot.depth - 1, true, -Infinity, Infinity);
            game.undo();
            if (val < bestVal) {
              bestVal = val;
              chosenMove = m;
            }
          }
        }

        game.move(chosenMove || moves[0]);
        previousEval = evaluateBoard();
        updateEvalBar(previousEval);
        renderBoard();

        document.getElementById('turnIndicator').innerText = "White to move";
        if (game.game_over()) checkGameOver();
      }, 350);
    }

    // 💡 High-Accuracy Best Move Engine (2-ply Minimax Analysis)
    document.getElementById('btnHint').onclick = () => {
      if (game.game_over() || game.turn() !== 'w') return;
      const moves = game.moves({ verbose: true });
      if (moves.length === 0) return;

      let bestMove = null;
      let maxScore = -Infinity;

      for (const m of moves) {
        game.move(m);
        const score = minimax(2, false, -Infinity, Infinity);
        game.undo();
        if (score > maxScore) {
          maxScore = score;
          bestMove = m;
        }
      }

      hintMove = bestMove || moves[0];
      selectedSquare = hintMove.from;
      renderBoard();
    };

    // Game Over & Stats Sync
    function checkGameOver() {
      clearInterval(timerInterval);
      if (game.in_checkmate()) {
        const won = game.turn() === 'b';
        if (won) {
          const w = parseInt(localStorage.getItem('chess_stats_won') || '0') + 1;
          localStorage.setItem('chess_stats_won', w);
          alert(`🏆 Checkmate: You defeated ${currentBot.name}!`);
        } else {
          const l = parseInt(localStorage.getItem('chess_stats_lost') || '0') + 1;
          localStorage.setItem('chess_stats_lost', l);
          alert(`💀 Checkmate: ${currentBot.name} won!`);
        }
      } else if (game.in_draw()) {
        alert('🤝 Match Drawn!');
      }
    }

    // Resign Match
    document.getElementById('btnResign').onclick = () => {
      if (confirm('Resign match?')) {
        clearInterval(timerInterval);
        const l = parseInt(localStorage.getItem('chess_stats_lost') || '0') + 1;
        localStorage.setItem('chess_stats_lost', l);
        alert('🏳️ You Resigned!');
        window.location.href = 'index.html';
      }
    };

    // Dual Countdown Clocks
    const timerInterval = setInterval(() => {
      if (game.game_over()) return;
      if (game.turn() === 'w') {
        userTime--;
        const m = Math.floor(userTime / 60).toString().padStart(2, '0');
        const s = (userTime % 60).toString().padStart(2, '0');
        document.getElementById('userClock').innerText = `${m}:${s}`;
      } else {
        botTime--;
        const m = Math.floor(botTime / 60).toString().padStart(2, '0');
        const s = (botTime % 60).toString().padStart(2, '0');
        document.getElementById('botClock').innerText = `${m}:${s}`;
      }
    }, 1000);

    // Initial Setup
    loadBot(currentBot);
    renderBoard();
  </script>
</body>
</html>
