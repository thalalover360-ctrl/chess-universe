<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Bot Arena | Chess Universe</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <link rel="stylesheet" href="style.css">
  <style>
    body { background-color: #07090e; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
    .tile-hint-from { background-color: #0284c7 !important; box-shadow: inset 0 0 0 3px #38bdf8 !important; }
    .tile-hint-to { background-color: #0369a1 !important; box-shadow: inset 0 0 0 4px #7dd3fc !important; position: relative; }
    .tile-hint-to::after { content: '★'; position: absolute; font-size: 20px; color: #fde047; pointer-events: none; }
  </style>
</head>
<body class="min-h-screen flex flex-col select-none antialiased">

  <!-- TOP HEADER -->
  <header class="border-b border-slate-800 bg-slate-900/90 px-4 py-3 flex items-center justify-between sticky top-0 z-40 backdrop-blur-md">
    <div class="flex items-center gap-2">
      <a href="index.html" class="text-slate-400 hover:text-white text-xl font-bold">←</a>
      <div>
        <h1 class="font-black text-sm tracking-wide text-white leading-tight">BOT ARENA</h1>
        <p class="text-[10px] text-emerald-400 font-mono font-bold">CHOOSE OPPONENT</p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <button id="btnSwitchBot" class="hidden bg-slate-800 hover:bg-slate-700 text-xs text-emerald-400 border border-slate-700 rounded-xl px-3 py-1.5 font-bold transition">
        🤖 Change Bot
      </button>
      <a href="index.html" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold px-3 py-1.5 rounded-xl border border-slate-700 transition">Exit</a>
    </div>
  </header>

  <!-- SCREEN 1: 10 BOTS SELECTION LOBBY (Default Visible) -->
  <section id="lobbyScreen" class="flex-1 max-w-md w-full mx-auto p-4 space-y-3">
    <div class="text-center py-2">
      <h2 class="text-lg font-black text-white">Select Your Bot</h2>
      <p class="text-xs text-slate-400">Choose from 10 unique battle bots (400 - 2800 Elo)</p>
    </div>
    <div id="botsLobbyGrid" class="space-y-2.5 pb-8">
      <!-- 10 Bots rendered here via JS -->
    </div>
  </section>

  <!-- SCREEN 2: ACTIVE GAMEPLAY BOARD (Hidden initially) -->
  <section id="gameScreen" class="flex-1 max-w-md w-full mx-auto p-4 flex flex-col justify-between space-y-3 hidden">
    <!-- Live Eval Bar -->
    <div class="w-full">
      <div class="flex items-center justify-between text-xs font-mono text-slate-400 mb-1">
        <span id="evalScoreText" class="font-bold text-emerald-400">+0.0</span>
        <span id="engineStatusText" class="text-[11px] text-slate-400">Position Equal</span>
      </div>
      <div class="w-full h-1.5 bg-slate-800 rounded-full overflow-hidden flex border border-slate-700">
        <div id="evalBarWhite" class="h-full bg-white transition-all duration-300" style="width: 50%;"></div>
        <div id="evalBarBlack" class="h-full bg-slate-700 transition-all duration-300" style="width: 50%;"></div>
      </div>
    </div>

    <!-- Active Bot Card -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-3 flex items-center justify-between shadow-lg">
      <div class="flex items-center gap-3">
        <img id="botAvatar" src="" class="w-11 h-11 rounded-xl object-cover border border-slate-700 bg-slate-800" alt="Bot">
        <div>
          <div class="flex items-center gap-1.5">
            <h4 id="botName" class="text-xs font-black text-white">Bot</h4>
            <span id="botStyleBadge" class="text-[9px] bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-1 py-0.2 rounded font-mono font-bold uppercase"></span>
          </div>
          <span id="botElo" class="text-[11px] text-emerald-400 font-mono font-bold">1200 Elo</span>
        </div>
      </div>
      <div id="botClock" class="font-mono text-xs font-bold bg-slate-950 px-2.5 py-1.5 rounded-lg border border-slate-800">10:00</div>
    </div>

    <!-- Chess Board Grid -->
    <div class="w-full flex items-center justify-center">
      <div id="board" class="chess-grid"></div>
    </div>

    <!-- User Profile Card -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-3 flex items-center justify-between shadow-lg">
      <div class="flex items-center gap-3">
        <img id="userAvatar" src="" class="w-10 h-10 rounded-xl object-cover border border-slate-700 bg-slate-800" alt="You">
        <div>
          <h4 id="userName" class="text-xs font-bold text-white">Player</h4>
          <span id="userUID" class="text-[10px] text-slate-400 font-mono">UID: ----------</span>
        </div>
      </div>
      <div id="userClock" class="font-mono text-xs font-bold bg-slate-950 px-2.5 py-1.5 rounded-lg border border-slate-800">10:00</div>
    </div>

    <!-- Actions & Hint -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-2.5 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span id="moveBadge" class="text-xs font-bold px-2 py-0.5 rounded-lg bg-slate-800 text-slate-200">Ready</span>
        <span id="turnIndicator" class="text-[11px] text-slate-400">White to move</span>
      </div>
      <div class="flex gap-2">
        <button id="btnHint" class="px-2.5 py-1 bg-sky-500/10 hover:bg-sky-500/20 text-sky-400 text-xs font-bold rounded-lg border border-sky-500/30">💡 Best</button>
        <button id="btnResign" class="px-2.5 py-1 bg-red-500/10 hover:bg-red-500/20 text-red-400 text-xs font-bold rounded-lg border border-red-500/30">🏳️ Resign</button>
      </div>
    </div>
  </section>
  
  <script>
    if (!localStorage.getItem('chess_auth')) {
      window.location.href = 'login.html';
    }

    const PIECE_SVGS = {
      wP: 'https://images.chesscomfiles.com/chess-themes/pieces/neo/150/wp.png',
      wR: 'https://images.chesscomfiles.com/chess-themes/pieces/neo/150/wr.png',
      wN: 'https://images.chesscomfiles.com/chess-themes/pieces/neo/150/wn.png',
      wB: 'https://images.chesscomfiles.com/chess-themes/pieces/neo/150/wb.png',
      wQ: 'https://images.chesscomfiles.com/chess-themes/pieces/neo/150/wq.png',
      wK: 'https://images.chesscomfiles.com/chess-themes/pieces/neo/150/wk.png',
      bP: 'https://images.chesscomfiles.com/chess-themes/pieces/neo/150/bp.png',
      bR: 'https://images.chesscomfiles.com/chess-themes/pieces/neo/150/br.png',
      bN: 'https://images.chesscomfiles.com/chess-themes/pieces/neo/150/bn.png',
      bB: 'https://images.chesscomfiles.com/chess-themes/pieces/neo/150/bb.png',
      bQ: 'https://images.chesscomfiles.com/chess-themes/pieces/neo/150/bq.png',
      bK: 'https://images.chesscomfiles.com/chess-themes/pieces/neo/150/bk.png'
    };

    const BOTS = [
      { id: 1, name: "Chintu", title: "Novice", elo: 400, depth: 1, blunderRate: 0.60, style: "Free Piece Dropper", avatar: "https://api.dicebear.com/7.x/bottts/svg?seed=Chintu" },
      { id: 2, name: "Rookie Veer", title: "Beginner", elo: 750, depth: 1, blunderRate: 0.38, style: "Casual Explorer", avatar: "https://api.dicebear.com/7.x/bottts/svg?seed=Veer" },
      { id: 3, name: "Kabir Hawk", title: "Street Hustler", elo: 1000, depth: 2, blunderRate: 0.24, style: "Early Queen Attack", avatar: "https://api.dicebear.com/7.x/bottts/svg?seed=Kabir" },
      { id: 4, name: "Rani The Fox", title: "Tactician", elo: 1250, depth: 2, blunderRate: 0.12, style: "Tricky Forks & Pins", avatar: "https://api.dicebear.com/7.x/bottts/svg?seed=Rani" },
      { id: 5, name: "Vikram The Wall", title: "Club Grinder", elo: 1500, depth: 2, blunderRate: 0.05, style: "Solid Defense", avatar: "https://api.dicebear.com/7.x/bottts/svg?seed=Vikram" },
      { id: 6, name: "Viper Shadow", title: "Candidate Master", elo: 1750, depth: 3, blunderRate: 0.02, style: "Sharp Counters", avatar: "https://api.dicebear.com/7.x/bottts/svg?seed=Viper" },
      { id: 7, name: "Sub-Zero", title: "Ice Cold Master", elo: 2000, depth: 3, blunderRate: 0.00, style: "Positional Squeeze", avatar: "https://api.dicebear.com/7.x/bottts/svg?seed=SubZero" },
      { id: 8, name: "Dracula", title: "International Master", elo: 2250, depth: 3, blunderRate: 0.00, style: "Sacrificial Gambits", avatar: "https://api.dicebear.com/7.x/bottts/svg?seed=Dracula" },
      { id: 9, name: "Chanakya GM", title: "Grandmaster", elo: 2500, depth: 4, blunderRate: 0.00, style: "Flawless Strategy", avatar: "https://api.dicebear.com/7.x/bottts/svg?seed=Chanakya" },
      { id: 10, name: "Kalki AI", title: "Immortal Engine", elo: 2800, depth: 4, blunderRate: 0.00, style: "Deep Tactical Execution", avatar: "https://api.dicebear.com/7.x/bottts/svg?seed=Kalki" }
    ];

    let currentBot = null;
    const game = new Chess();
    let selectedSquare = null;
    let hintMove = null;
    let previousEval = 0;
    let userTime = 600;
    let botTime = 600;
    let timerInterval = null;

    const VALS = { p: 100, n: 320, b: 330, r: 500, q: 900, k: 20000 };

    // Bot Selection Lobby Setup
    function initLobby() {
      const container = document.getElementById('botsLobbyGrid');
      container.innerHTML = '';

      BOTS.forEach(b => {
        const item = document.createElement('div');
        item.className = "bg-slate-900 hover:bg-slate-850 border border-slate-800 hover:border-emerald-500/50 p-3.5 rounded-2xl transition cursor-pointer flex items-center justify-between group shadow-lg";
        item.innerHTML = `
          <div class="flex items-center gap-3">
            <img src="${b.avatar}" class="w-12 h-12 rounded-xl bg-slate-950 border border-slate-700 shadow" alt="${b.name}">
            <div>
              <div class="flex items-center gap-2">
                <h3 class="text-sm font-extrabold text-white group-hover:text-emerald-400 transition">${b.name}</h3>
                <span class="text-[11px] text-emerald-400 font-mono font-bold">${b.elo} Elo</span>
              </div>
              <p class="text-xs text-slate-400 mt-0.5">${b.title} • <span class="text-slate-300 font-medium">${b.style}</span></p>
            </div>
          </div>
          <button class="bg-emerald-500 group-hover:bg-emerald-400 text-slate-950 text-xs font-black px-3.5 py-2 rounded-xl transition">
            Battle ⚔️
          </button>
        `;
        item.onclick = () => startMatchWithBot(b);
        container.appendChild(item);
      });
    }

    function startMatchWithBot(bot) {
      currentBot = bot;
      document.getElementById('lobbyScreen').classList.add('hidden');
      document.getElementById('gameScreen').classList.remove('hidden');
      document.getElementById('btnSwitchBot').classList.remove('hidden');

      document.getElementById('botName').innerText = `${bot.name} (${bot.title})`;
      document.getElementById('botElo').innerText = `${bot.elo} Elo`;
      document.getElementById('botStyleBadge').innerText = bot.style;
      document.getElementById('botAvatar').src = bot.avatar;

      document.getElementById('userName').innerText = localStorage.getItem('chess_name') || 'Player';
      document.getElementById('userUID').innerText = 'UID: ' + (localStorage.getItem('chess_game_uid') || '1029384756');
      document.getElementById('userAvatar').src = localStorage.getItem('chess_avatar') || 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=100&h=100&fit=crop&crop=faces';

      resetGame();
      startTimer();
    }

    document.getElementById('btnSwitchBot').onclick = () => {
      clearInterval(timerInterval);
      document.getElementById('gameScreen').classList.add('hidden');
      document.getElementById('lobbyScreen').classList.remove('hidden');
      document.getElementById('btnSwitchBot').classList.add('hidden');
    };

    function resetGame() {
      game.reset();
      selectedSquare = null;
      hintMove = null;
      previousEval = 0;
      userTime = 600;
      botTime = 600;
      updateEvalBar(0);
      document.getElementById('turnIndicator').innerText = "White to move";
      document.getElementById('moveBadge').innerText = "Ready";
      document.getElementById('moveBadge').className = "text-xs font-bold px-2 py-0.5 rounded-lg bg-slate-800 text-slate-200";
      renderBoard();
    }

    function renderBoard() {
      const boardEl = document.getElementById('board');
      boardEl.innerHTML = '';

      const ranks = [8, 7, 6, 5, 4, 3, 2, 1];
      const files = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];

      ranks.forEach((rank, rIdx) => {
        files.forEach((file, fIdx) => {
          const sq = `${file}${rank}`;
          const isDark = (rIdx + fIdx) % 2 === 1;
          const tile = document.createElement('div');
          tile.className = `chess-tile ${isDark ? 'tile-dark' : 'tile-light'}`;
          tile.dataset.square = sq;

          const piece = game.get(sq);
          if (piece) {
            const img = document.createElement('img');
            img.src = PIECE_SVGS[piece.color + piece.type.toUpperCase()];
            img.className = 'piece-img';
            tile.appendChild(img);
          }

          if (selectedSquare === sq) tile.classList.add('tile-selected');
          
          if (hintMove) {
            if (hintMove.from === sq) tile.classList.add('tile-hint-from');
            if (hintMove.to === sq) tile.classList.add('tile-hint-to');
          }

          tile.onclick = () => onTileClick(sq);
          boardEl.appendChild(tile);
        });
      });

      highlightLegalMoves();
    }

    function highlightLegalMoves() {
      if (!selectedSquare) return;
      const moves = game.moves({ square: selectedSquare, verbose: true });
      moves.forEach(m => {
        const el = document.querySelector(`[data-square="${m.to}"]`);
        if (el) {
          if (m.captured) el.classList.add('tile-capture');
          else el.classList.add('tile-dot');
        }
      });
    }

    function onTileClick(sq) {
      if (game.game_over() || game.turn() !== 'w') return;
      hintMove = null;
      const piece = game.get(sq);

      if (selectedSquare) {
        if (selectedSquare === sq) {
          selectedSquare = null;
          renderBoard();
          return;
        }

        const move = game.move({ from: selectedSquare, to: sq, promotion: 'q' });
        if (move) {
          selectedSquare = null;
          renderBoard();
          analyzeMoveQuality(move);
          setTimeout(handleBotTurn, 250);
          return;
        }
      }

      if (piece && piece.color === 'w') {
        selectedSquare = sq;
      } else {
        selectedSquare = null;
      }
      renderBoard();
    }

    function evaluatePosition() {
      let score = 0;
      const board = game.board();
      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          const p = board[r][c];
          if (!p) continue;
          const val = VALS[p.type] || 0;
          score += (p.color === 'w' ? val : -val);
        }
      }
      return score;
    }

    function analyzeMoveQuality(userMove) {
      const newEval = evaluatePosition();
      const evalDiff = newEval - previousEval;
      previousEval = newEval;

      const badge = document.getElementById('moveBadge');
      if (evalDiff >= 150 || userMove.san.includes('#')) {
        badge.className = "text-xs font-black px-2 py-0.5 rounded-lg bg-emerald-600 text-white";
        badge.innerText = "⭐ Star Move!";
      } else if (evalDiff >= -35) {
        badge.className = "text-xs font-black px-2 py-0.5 rounded-lg bg-sky-600 text-white";
        badge.innerText = "👍 Good Move";
      } else if (evalDiff >= -150) {
        badge.className = "text-xs font-black px-2 py-0.5 rounded-lg bg-amber-600 text-white";
        badge.innerText = "⚠️ Inaccuracy";
      } else {
        badge.className = "text-xs font-black px-2 py-0.5 rounded-lg bg-red-600 text-white";
        badge.innerText = "🔴 Blunder!";
      }

      updateEvalBar(newEval);
    }

    function updateEvalBar(centipawns) {
      const score = (centipawns / 100).toFixed(1);
      const scoreEl = document.getElementById('evalScoreText');
      scoreEl.innerText = score > 0 ? `+${score}` : `${score}`;

      const whitePct = Math.max(10, Math.min(90, 50 + centipawns / 30));
      document.getElementById('evalBarWhite').style.width = `${whitePct}%`;
      document.getElementById('evalBarBlack').style.width = `${100 - whitePct}%`;
    }

    // Fast & Safe Evaluation Engine
    function evaluateMoveValue(move) {
      let score = 0;
      if (move.captured) score += (VALS[move.captured] || 100) * 10;
      if (move.promotion) score += 900;
      if (move.san.includes('#')) score += 20000;
      if (move.san.includes('+')) score += 50;

      // Center control bias
      if (['d4','d5','e4','e5'].includes(move.to)) score += 30;
      if (['c4','c5','f4','f5'].includes(move.to)) score += 15;

      return score;
    }

    // Bot Move Trigger
    function handleBotTurn() {
      if (game.game_over()) return checkGameOver();
      document.getElementById('turnIndicator').innerText = `${currentBot.name} calculating...`;

      const moves = game.moves({ verbose: true });
      if (moves.length === 0) return checkGameOver();

      let chosenMove = null;

      if (Math.random() < currentBot.blunderRate) {
        chosenMove = moves[Math.floor(Math.random() * moves.length)];
      } else {
        let bestVal = -Infinity;
        for (const m of moves) {
          game.move(m);
          // Evaluate reply from bot perspective (minimizing white advantages)
          let val = evaluateMoveValue(m) - (evaluatePosition() / 10);
          game.undo();

          if (val > bestVal) {
            bestVal = val;
            chosenMove = m;
          }
        }
      }

      game.move(chosenMove || moves[0]);
      previousEval = evaluatePosition();
      updateEvalBar(previousEval);
      renderBoard();

      document.getElementById('turnIndicator').innerText = "White to move";
      if (game.game_over()) checkGameOver();
    }

    // 💡 Instant Responsive Best Move Hint
    document.getElementById('btnHint').onclick = () => {
      if (game.game_over() || game.turn() !== 'w') return;
      const moves = game.moves({ verbose: true });
      if (moves.length === 0) return;

      let bestScore = -Infinity;
      let bestMove = moves[0];

      for (const m of moves) {
        let score = evaluateMoveValue(m);
        game.move(m);
        score += evaluatePosition();
        game.undo();

        if (score > bestScore) {
          bestScore = score;
          bestMove = m;
        }
      }

      hintMove = bestMove;
      selectedSquare = hintMove.from;
      renderBoard();
    };

    function checkGameOver() {
      clearInterval(timerInterval);
      if (game.in_checkmate()) {
        const won = game.turn() === 'b';
        if (won) {
          const w = parseInt(localStorage.getItem('chess_stats_won') || '0') + 1;
          localStorage.setItem('chess_stats_won', w);
          alert(`🏆 Checkmate: You defeated ${currentBot.name}!`);
        } else {
          const l = parseInt(localStorage.getItem('chess_stats_lost') || '0') + 1;
          localStorage.setItem('chess_stats_lost', l);
          alert(`💀 Checkmate: ${currentBot.name} won!`);
        }
      } else if (game.in_draw()) {
        alert('🤝 Match Drawn!');
      }
    }

    document.getElementById('btnResign').onclick = () => {
      if (confirm('Resign match?')) {
        clearInterval(timerInterval);
        const l = parseInt(localStorage.getItem('chess_stats_lost') || '0') + 1;
        localStorage.setItem('chess_stats_lost', l);
        alert('🏳️ You Resigned!');
        window.location.href = 'index.html';
      }
    };

    function startTimer() {
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        if (game.game_over()) return;
        if (game.turn() === 'w') {
          userTime--;
          const m = Math.floor(userTime / 60).toString().padStart(2, '0');
          const s = (userTime % 60).toString().padStart(2, '0');
          document.getElementById('userClock').innerText = `${m}:${s}`;
        } else {
          botTime--;
          const m = Math.floor(botTime / 60).toString().padStart(2, '0');
          const s = (botTime % 60).toString().padStart(2, '0');
          document.getElementById('botClock').innerText = `${m}:${s}`;
        }
      }, 1000);
    }

    initLobby();
  </script>
</body>
</html>
