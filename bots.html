<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Bot Arena | Chess Universe</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <link rel="stylesheet" href="style.css">
  <style>
    body { background-color: #07090e; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
    .tile-hint-from { background-color: #0284c7 !important; box-shadow: inset 0 0 0 3px #38bdf8 !important; }
    .tile-hint-to { background-color: #0369a1 !important; box-shadow: inset 0 0 0 4px #7dd3fc !important; position: relative; }
    .tile-hint-to::after { content: '★'; position: absolute; font-size: 22px; color: #fde047; pointer-events: none; }
  </style>
</head>
<body class="min-h-screen flex flex-col select-none antialiased">

  <header class="border-b border-slate-800 bg-slate-900/90 px-4 py-3 flex items-center justify-between sticky top-0 z-40 backdrop-blur-md">
    <div class="flex items-center gap-2">
      <a href="index.html" class="text-slate-400 hover:text-white text-xl font-bold">←</a>
      <div>
        <h1 class="font-black text-sm tracking-wide text-white leading-tight">BOT ARENA</h1>
        <p id="headerSubtitle" class="text-[10px] text-emerald-400 font-mono font-bold">CHOOSE OPPONENT</p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <button id="btnBackToLobby" class="hidden bg-slate-800 hover:bg-slate-700 text-xs text-emerald-400 border border-slate-700 rounded-xl px-3 py-1.5 font-bold transition">
        🤖 Change Bot
      </button>
      <a href="index.html" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold px-3 py-1.5 rounded-xl border border-slate-700 transition">Exit</a>
    </div>
  </header>

  <!-- SCREEN 1: 10 BOTS SELECTION LOBBY -->
  <section id="lobbyScreen" class="flex-1 max-w-md w-full mx-auto p-4 space-y-3">
    <div class="text-center py-2">
      <h2 class="text-lg font-black text-white">Choose Your Opponent</h2>
      <p class="text-xs text-slate-400">10 AI Bot Personas (400 Elo to 2800 Apex God)</p>
    </div>
    <div id="botsLobbyList" class="space-y-2.5 pb-8"></div>
  </section>

  <!-- SCREEN 2: ACTIVE GAMEPLAY ARENA -->
  <section id="gameScreen" class="flex-1 max-w-md w-full mx-auto p-4 flex flex-col justify-between space-y-3 hidden">
    <div class="w-full">
      <div class="flex items-center justify-between text-xs font-mono text-slate-400 mb-1">
        <span id="evalScoreText" class="font-bold text-emerald-400">+0.0</span>
        <span id="engineStatusText" class="text-[11px] text-slate-400">Position Equal</span>
      </div>
      <div class="w-full h-1.5 bg-slate-800 rounded-full overflow-hidden flex border border-slate-700">
        <div id="evalBarWhite" class="h-full bg-white transition-all duration-300" style="width: 50%;"></div>
        <div id="evalBarBlack" class="h-full bg-slate-700 transition-all duration-300" style="width: 50%;"></div>
      </div>
    </div>

    <!-- Active Bot Profile -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-3 flex items-center justify-between shadow-lg">
      <div class="flex items-center gap-3">
        <img id="botAvatar" src="" class="w-12 h-12 rounded-xl object-cover border border-slate-700 bg-slate-950 shadow" alt="Bot">
        <div>
          <div class="flex items-center gap-1.5">
            <h4 id="botName" class="text-sm font-black text-white">Bot</h4>
            <span id="botStyleBadge" class="text-[9px] bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-1.5 py-0.5 rounded font-mono font-bold uppercase"></span>
          </div>
          <span id="botElo" class="text-xs text-emerald-400 font-mono font-bold">1200 Elo</span>
        </div>
      </div>
      <div id="botClock" class="font-mono text-xs font-bold bg-slate-950 px-2.5 py-1.5 rounded-lg border border-slate-800">10:00</div>
    </div>

    <!-- Board Grid -->
    <div class="w-full flex items-center justify-center">
      <div id="board" class="chess-grid"></div>
    </div>

    <!-- User Profile -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-3 flex items-center justify-between shadow-lg">
      <div class="flex items-center gap-3">
        <img id="userAvatar" src="" class="w-10 h-10 rounded-xl object-cover border border-slate-700 bg-slate-800" alt="You">
        <div>
          <h4 id="userName" class="text-xs font-bold text-white">Player</h4>
          <span id="userUID" class="text-[10px] text-slate-400 font-mono">UID: ----------</span>
        </div>
      </div>
      <div id="userClock" class="font-mono text-xs font-bold bg-slate-950 px-2.5 py-1.5 rounded-lg border border-slate-800">10:00</div>
    </div>

    <!-- Actions & Hint -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-2.5 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span id="moveBadge" class="text-xs font-bold px-2 py-0.5 rounded-lg bg-slate-800 text-slate-200">Ready</span>
        <span id="turnIndicator" class="text-[11px] text-slate-400">White to move</span>
      </div>
      <div class="flex gap-2">
        <button id="btnHint" class="px-3 py-1 bg-sky-500/10 hover:bg-sky-500/20 active:scale-95 text-sky-400 text-xs font-bold rounded-lg border border-sky-500/30">💡 Best Move</button>
        <button id="btnResign" class="px-3 py-1 bg-red-500/10 hover:bg-red-500/20 active:scale-95 text-red-400 text-xs font-bold rounded-lg border border-red-500/30">🏳️ Resign</button>
      </div>
    </div>
  </section>
    <script>
    if (!localStorage.getItem('chess_auth')) {
      window.location.href = 'login.html';
    }

    const PIECE_SVGS = {
      wP: 'https://images.chesscomfiles.com/chess-themes/pieces/neo/150/wp.png',
      wR: 'https://images.chesscomfiles.com/chess-themes/pieces/neo/150/wr.png',
      wN: 'https://images.chesscomfiles.com/chess-themes/pieces/neo/150/wn.png',
      wB: 'https://images.chesscomfiles.com/chess-themes/pieces/neo/150/wb.png',
      wQ: 'https://images.chesscomfiles.com/chess-themes/pieces/neo/150/wq.png',
      wK: 'https://images.chesscomfiles.com/chess-themes/pieces/neo/150/wk.png',
      bP: 'https://images.chesscomfiles.com/chess-themes/pieces/neo/150/bp.png',
      bR: 'https://images.chesscomfiles.com/chess-themes/pieces/neo/150/br.png',
      bN: 'https://images.chesscomfiles.com/chess-themes/pieces/neo/150/bn.png',
      bB: 'https://images.chesscomfiles.com/chess-themes/pieces/neo/150/bb.png',
      bQ: 'https://images.chesscomfiles.com/chess-themes/pieces/neo/150/bq.png',
      bK: 'https://images.chesscomfiles.com/chess-themes/pieces/neo/150/bk.png'
    };

    // Shuru ke 2 beginner bots, baki 8 aggressive grandmaster-level bots
    const BOTS = [
      { id: 1, name: "Chintu", title: "Novice", elo: 400, blunderRate: 0.60, depth: 1, style: "Free Piece Dropper", avatar: "https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=120&h=120&fit=crop&crop=faces" },
      { id: 2, name: "Rookie Veer", title: "Beginner", elo: 750, blunderRate: 0.40, depth: 1, style: "Casual Explorer", avatar: "https://images.unsplash.com/photo-1570295999919-56ceb5ecca61?w=120&h=120&fit=crop&crop=faces" },
      { id: 3, name: "Kabir Hawk", title: "Tactician", elo: 1100, blunderRate: 0.12, depth: 2, style: "Fierce Attacker", avatar: "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=120&h=120&fit=crop&crop=faces" },
      { id: 4, name: "Rani The Fox", title: "Sneaky Master", elo: 1350, blunderRate: 0.05, depth: 2, style: "Pins & Forks Hunter", avatar: "https://images.unsplash.com/photo-1544005313-94ddf0286df2?w=120&h=120&fit=crop&crop=faces" },
      { id: 5, name: "Vikram The Wall", title: "Club Pro", elo: 1600, blunderRate: 0.00, depth: 2, style: "Zero Blunder Defense", avatar: "https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=120&h=120&fit=crop&crop=faces" },
      { id: 6, name: "Viper Shadow", title: "Candidate Master", elo: 1850, blunderRate: 0.00, depth: 2, style: "Lethal Counter-Strikes", avatar: "https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?w=120&h=120&fit=crop&crop=faces" },
      { id: 7, name: "Sub-Zero", title: "Master", elo: 2100, blunderRate: 0.00, depth: 3, style: "Positional Squeeze", avatar: "https://images.unsplash.com/photo-1522075469751-3a6694fb2f61?w=120&h=120&fit=crop&crop=faces" },
      { id: 8, name: "Dracula", title: "International Master", elo: 2350, blunderRate: 0.00, depth: 3, style: "Tactical Punisher", avatar: "https://images.unsplash.com/photo-1519085360753-af0119f7cbe7?w=120&h=120&fit=crop&crop=faces" },
      { id: 9, name: "Chanakya GM", title: "Grandmaster", elo: 2600, blunderRate: 0.00, depth: 3, style: "Flawless Strategist", avatar: "https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?w=120&h=120&fit=crop&crop=faces" },
      { id: 10, name: "Kalki AI", title: "Apex Immortal", elo: 2800, blunderRate: 0.00, depth: 3, style: "Cold Engine Execution", avatar: "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=120&h=120&fit=crop&crop=center" }
    ];

    let currentBot = null;
    const game = new Chess();
    let selectedSquare = null;
    let hintMove = null;
    let previousEval = 0;
    let userTime = 600;
    let botTime = 600;
    let timerInterval = null;

    const VALS = { p: 100, n: 320, b: 330, r: 500, q: 900, k: 20000 };

    function renderLobby() {
      const container = document.getElementById('botsLobbyList');
      container.innerHTML = '';

      BOTS.forEach(b => {
        const card = document.createElement('div');
        card.className = "bg-slate-900 hover:bg-slate-850 border border-slate-800 hover:border-emerald-500/50 p-3.5 rounded-2xl transition cursor-pointer flex items-center justify-between group shadow-lg";
        card.innerHTML = `
          <div class="flex items-center gap-3">
            <img src="${b.avatar}" class="w-12 h-12 rounded-xl object-cover border border-slate-700 group-hover:border-emerald-400 transition shadow" alt="${b.name}">
            <div>
              <div class="flex items-center gap-2">
                <h3 class="text-sm font-black text-white group-hover:text-emerald-400 transition">${b.name}</h3>
                <span class="text-[11px] text-emerald-400 font-mono font-bold">${b.elo} Elo</span>
              </div>
              <p class="text-xs text-slate-400 mt-0.5">${b.title} • <span class="text-slate-300 font-medium">${b.style}</span></p>
            </div>
          </div>
          <button class="bg-emerald-500 hover:bg-emerald-400 active:scale-95 text-slate-950 text-xs font-black px-3.5 py-2 rounded-xl transition shadow">
            Battle ⚔️
          </button>
        `;
        card.onclick = () => launchBotMatch(b);
        container.appendChild(card);
      });
    }

    function launchBotMatch(bot) {
      currentBot = bot;
      document.getElementById('lobbyScreen').classList.add('hidden');
      document.getElementById('gameScreen').classList.remove('hidden');
      document.getElementById('btnBackToLobby').classList.remove('hidden');
      document.getElementById('headerSubtitle').innerText = "PRO BOT ARENA";

      document.getElementById('botName').innerText = `${bot.name} (${bot.title})`;
      document.getElementById('botElo').innerText = `${bot.elo} Elo`;
      document.getElementById('botStyleBadge').innerText = bot.style;
      document.getElementById('botAvatar').src = bot.avatar;

      document.getElementById('userName').innerText = localStorage.getItem('chess_name') || 'Player';
      document.getElementById('userUID').innerText = 'UID: ' + (localStorage.getItem('chess_game_uid') || '1029384756');
      document.getElementById('userAvatar').src = localStorage.getItem('chess_avatar') || 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=100&h=100&fit=crop&crop=faces';

      resetMatch();
      startClocks();
    }

    document.getElementById('btnBackToLobby').onclick = () => {
      clearInterval(timerInterval);
      document.getElementById('gameScreen').classList.add('hidden');
      document.getElementById('lobbyScreen').classList.remove('hidden');
      document.getElementById('btnBackToLobby').classList.add('hidden');
      document.getElementById('headerSubtitle').innerText = "CHOOSE OPPONENT";
    };

    function resetMatch() {
      game.reset();
      selectedSquare = null;
      hintMove = null;
      previousEval = 0;
      userTime = 600;
      botTime = 600;
      updateEvalBar(0);
      document.getElementById('turnIndicator').innerText = "White to move";
      document.getElementById('moveBadge').innerText = "Ready";
      document.getElementById('moveBadge').className = "text-xs font-bold px-2 py-0.5 rounded-lg bg-slate-800 text-slate-200";
      renderBoard();
    }

    function renderBoard() {
      const boardEl = document.getElementById('board');
      boardEl.innerHTML = '';

      const ranks = [8, 7, 6, 5, 4, 3, 2, 1];
      const files = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];

      ranks.forEach((rank, rIdx) => {
        files.forEach((file, fIdx) => {
          const sq = `${file}${rank}`;
          const isDark = (rIdx + fIdx) % 2 === 1;
          const tile = document.createElement('div');
          tile.className = `chess-tile ${isDark ? 'tile-dark' : 'tile-light'}`;
          tile.dataset.square = sq;

          const piece = game.get(sq);
          if (piece) {
            const img = document.createElement('img');
            img.src = PIECE_SVGS[piece.color + piece.type.toUpperCase()];
            img.className = 'piece-img';
            tile.appendChild(img);
          }

          if (selectedSquare === sq) tile.classList.add('tile-selected');
          
          if (hintMove) {
            if (hintMove.from === sq) tile.classList.add('tile-hint-from');
            if (hintMove.to === sq) tile.classList.add('tile-hint-to');
          }

          tile.onclick = () => onTileClick(sq);
          boardEl.appendChild(tile);
        });
      });

      highlightLegalMoves();
    }

    function highlightLegalMoves() {
      if (!selectedSquare) return;
      const moves = game.moves({ square: selectedSquare, verbose: true });
      moves.forEach(m => {
        const el = document.querySelector(`[data-square="${m.to}"]`);
        if (el) {
          if (m.captured) el.classList.add('tile-capture');
          else el.classList.add('tile-dot');
        }
      });
    }

    function onTileClick(sq) {
      if (game.game_over() || game.turn() !== 'w') return;
      hintMove = null;
      const piece = game.get(sq);

      if (selectedSquare) {
        if (selectedSquare === sq) {
          selectedSquare = null;
          renderBoard();
          return;
        }

        const move = game.move({ from: selectedSquare, to: sq, promotion: 'q' });
        if (move) {
          selectedSquare = null;
          renderBoard();
          analyzeMoveQuality(move);
          setTimeout(runBotEngineTurn, 220);
          return;
        }
      }

      if (piece && piece.color === 'w') {
        selectedSquare = sq;
      } else {
        selectedSquare = null;
      }
      renderBoard();
    }

    // Material Evaluation with Center Bias
    function evaluateBoardStatic() {
      let score = 0;
      const board = game.board();
      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          const p = board[r][c];
          if (!p) continue;
          let val = VALS[p.type] || 0;
          // Center bonus
          if ((r === 3 || r === 4) && (c === 3 || c === 4)) val += 25;
          score += (p.color === 'w' ? val : -val);
        }
      }
      return score;
    }

    // Check if a move loses piece for free (Suicide Blunder Filter)
    function isPieceBlunder(move) {
      game.move(move);
      const opponentReplies = game.moves({ verbose: true });
      let freeCapturePenalty = 0;

      for (const rep of opponentReplies) {
        if (rep.to === move.to && rep.captured) {
          const lostVal = VALS[rep.captured] || 100;
          const attackerVal = VALS[rep.piece] || 100;
          // Agar opponent kam value wale piece se capture kar raha hai ya piece undefended hai
          if (lostVal > attackerVal) {
            freeCapturePenalty = (lostVal - attackerVal) * 10;
            break;
          }
        }
      }
      game.undo();
      return freeCapturePenalty;
    }

    // Tactical Move Scoring (Minimax Depth 2)
    function evaluateMoveTactics(move, isWhiteTurn) {
      const suicidePenalty = isPieceBlunder(move);
      if (suicidePenalty > 200) return isWhiteTurn ? -9999 : 9999;

      game.move(move);
      if (game.in_checkmate()) {
        game.undo();
        return isWhiteTurn ? 50000 : -50000;
      }

      const replies = game.moves({ verbose: true });
      let bestReplyVal = isWhiteTurn ? Infinity : -Infinity;

      if (replies.length === 0) {
        const evalVal = evaluateBoardStatic();
        game.undo();
        return evalVal;
      }

      for (const rep of replies) {
        game.move(rep);
        const evalVal = evaluateBoardStatic();
        game.undo();

        if (isWhiteTurn) {
          bestReplyVal = Math.min(bestReplyVal, evalVal);
        } else {
          bestReplyVal = Math.max(bestReplyVal, evalVal);
        }
      }

      game.undo();
      return bestReplyVal;
    }

    function analyzeMoveQuality(userMove) {
      const newEval = evaluateBoardStatic();
      const evalDiff = newEval - previousEval;
      previousEval = newEval;

      const badge = document.getElementById('moveBadge');
      if (evalDiff >= 150 || userMove.san.includes('#')) {
        badge.className = "text-xs font-black px-2 py-0.5 rounded-lg bg-emerald-600 text-white";
        badge.innerText = "⭐ Star Move!";
      } else if (evalDiff >= -35) {
        badge.className = "text-xs font-black px-2 py-0.5 rounded-lg bg-sky-600 text-white";
        badge.innerText = "👍 Good Move";
      } else if (evalDiff >= -150) {
        badge.className = "text-xs font-black px-2 py-0.5 rounded-lg bg-amber-600 text-white";
        badge.innerText = "⚠️ Inaccuracy";
      } else {
        badge.className = "text-xs font-black px-2 py-0.5 rounded-lg bg-red-600 text-white";
        badge.innerText = "🔴 Blunder!";
      }

      updateEvalBar(newEval);
    }

    function updateEvalBar(centipawns) {
      const score = (centipawns / 100).toFixed(1);
      const scoreEl = document.getElementById('evalScoreText');
      scoreEl.innerText = score > 0 ? `+${score}` : `${score}`;

      const whitePct = Math.max(10, Math.min(90, 50 + centipawns / 30));
      document.getElementById('evalBarWhite').style.width = `${whitePct}%`;
      document.getElementById('evalBarBlack').style.width = `${100 - whitePct}%`;
    }

    // Bot Response Logic (Sharp & Tactical)
    function runBotEngineTurn() {
      if (game.game_over()) return checkGameOver();
      document.getElementById('turnIndicator').innerText = `${currentBot.name} calculating...`;

      const moves = game.moves({ verbose: true });
      if (moves.length === 0) return checkGameOver();

      let chosenMove = null;

      // Only Bot 1 and 2 blunder; Bot 3 to 10 are deadly
      if (Math.random() < currentBot.blunderRate) {
        chosenMove = moves[Math.floor(Math.random() * moves.length)];
      } else {
        let bestScore = Infinity;
        for (const m of moves) {
          const score = evaluateMoveTactics(m, false);
          if (score < bestScore) {
            bestScore = score;
            chosenMove = m;
          }
        }
      }

      game.move(chosenMove || moves[0]);
      previousEval = evaluateBoardStatic();
      updateEvalBar(previousEval);
      renderBoard();

      document.getElementById('turnIndicator').innerText = "White to move";
      if (game.game_over()) checkGameOver();
    }

    // 💡 Best Move Hint (Calculates safely so Queen is NEVER sacrificed)
    document.getElementById('btnHint').onclick = () => {
      if (game.game_over() || game.turn() !== 'w') return;
      const moves = game.moves({ verbose: true });
      if (moves.length === 0) return;

      let bestScore = -Infinity;
      let bestMove = moves[0];

      for (const m of moves) {
        const score = evaluateMoveTactics(m, true);
        if (score > bestScore) {
          bestScore = score;
          bestMove = m;
        }
      }

      hintMove = bestMove;
      selectedSquare = hintMove.from;
      renderBoard();
    };

    function checkGameOver() {
      clearInterval(timerInterval);
      if (game.in_checkmate()) {
        const won = game.turn() === 'b';
        if (won) {
          const w = parseInt(localStorage.getItem('chess_stats_won') || '0') + 1;
          localStorage.setItem('chess_stats_won', w);
          alert(`🏆 Checkmate: You defeated ${currentBot.name}!`);
        } else {
          const l = parseInt(localStorage.getItem('chess_stats_lost') || '0') + 1;
          localStorage.setItem('chess_stats_lost', l);
          alert(`💀 Checkmate: ${currentBot.name} won!`);
        }
      } else if (game.in_draw()) {
        alert('🤝 Match Drawn!');
      }
    }

    document.getElementById('btnResign').onclick = () => {
      if (confirm('Resign match?')) {
        clearInterval(timerInterval);
        const l = parseInt(localStorage.getItem('chess_stats_lost') || '0') + 1;
        localStorage.setItem('chess_stats_lost', l);
        alert('🏳️ You Resigned!');
        window.location.href = 'index.html';
      }
    };

    function startClocks() {
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        if (game.game_over()) return;
        if (game.turn() === 'w') {
          userTime--;
          const m = Math.floor(userTime / 60).toString().padStart(2, '0');
          const s = (userTime % 60).toString().padStart(2, '0');
          document.getElementById('userClock').innerText = `${m}:${s}`;
        } else {
          botTime--;
          const m = Math.floor(botTime / 60).toString().padStart(2, '0');
          const s = (botTime % 60).toString().padStart(2, '0');
          document.getElementById('botClock').innerText = `${m}:${s}`;
        }
      }, 1000);
    }

    renderLobby();
  </script>
</body>
</html>
