<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Chess Universe</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background: radial-gradient(circle at top, #14241b 0%, #080f0c 100%);
      color: #e2e8f0;
      touch-action: manipulation;
    }
    .glow-green { box-shadow: 0 0 25px -5px rgba(16, 185, 129, 0.35); }
    .card-tap:active { transform: scale(0.98); }
  </style>
</head>
<body class="min-h-screen flex flex-col font-sans select-none pb-8">

  <!-- Header -->
  <header class="border-b border-emerald-950 bg-emerald-950/40 backdrop-blur sticky top-0 z-40 px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-2.5">
      <div class="w-8 h-8 rounded-xl bg-emerald-500/10 border border-emerald-500/30 flex items-center justify-center text-emerald-400">
        <i class="fa-solid fa-chess-knight text-base"></i>
      </div>
      <h1 class="text-base font-black tracking-wider uppercase text-white">Chess Universe</h1>
    </div>
    <button onclick="resetAccount()" class="px-3 py-1 rounded-xl bg-slate-900 hover:bg-slate-800 text-[11px] font-bold text-slate-300 border border-slate-800">
      Reset UID
    </button>
  </header>

  <main class="max-w-md w-full mx-auto px-4 pt-4 flex flex-col gap-4">

    <!-- Profile & Live Stats -->
    <section class="bg-slate-900/90 border border-emerald-950 rounded-3xl p-4 shadow-xl flex flex-col gap-3.5">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div id="playerAvatar" class="w-12 h-12 rounded-2xl bg-emerald-500/20 border border-emerald-500/40 flex items-center justify-center font-black text-xl text-emerald-400">
            H
          </div>
          <div>
            <h2 id="profileName" class="text-sm font-black text-white leading-tight">Harsh Singh</h2>
            <div class="flex items-center gap-1.5 mt-0.5">
              <span class="text-[10px] text-slate-400 font-mono">UID:</span>
              <span id="profileUid" class="text-[11px] text-emerald-400 font-mono font-bold tracking-wider">8830464849</span>
              <button onclick="copyUID()" class="text-[10px] bg-slate-800 hover:bg-slate-700 px-2 py-0.5 rounded-md text-slate-300 border border-slate-700 ml-1">
                Copy
              </button>
            </div>
          </div>
        </div>
        <div class="text-right">
          <span class="text-[9px] uppercase tracking-wider text-slate-400 font-bold block">Rating</span>
          <span id="profileRating" class="text-xs font-black text-emerald-400 font-mono">1200</span>
        </div>
      </div>

      <div class="grid grid-cols-3 gap-2 pt-2 border-t border-slate-800/80 text-center">
        <div class="bg-slate-950/60 p-2 rounded-2xl border border-slate-800/60">
          <span class="text-[9px] font-bold text-slate-500 uppercase block">Won</span>
          <span id="statWon" class="text-xs font-black text-emerald-400 font-mono">0</span>
        </div>
        <div class="bg-slate-950/60 p-2 rounded-2xl border border-slate-800/60">
          <span class="text-[9px] font-bold text-slate-500 uppercase block">Lost</span>
          <span id="statLost" class="text-xs font-black text-rose-400 font-mono">0</span>
        </div>
        <div class="bg-slate-950/60 p-2 rounded-2xl border border-slate-800/60">
          <span class="text-[9px] font-bold text-slate-500 uppercase block">Win Rate</span>
          <span id="statWinRate" class="text-xs font-black text-cyan-400 font-mono">0%</span>
        </div>
      </div>
    </section>

    <!-- BIG PLAY MODES -->
    <section class="flex flex-col gap-2.5">
      
      <!-- 1. Play vs Bot -->
      <button onclick="openColorModal()" class="card-tap w-full p-4 rounded-3xl bg-gradient-to-r from-emerald-600 to-teal-500 text-slate-950 font-black text-left flex items-center justify-between shadow-lg glow-green transition">
        <div class="flex items-center gap-3.5">
          <div class="w-12 h-12 rounded-2xl bg-black/20 flex items-center justify-center text-slate-950 text-2xl">
            <i class="fa-solid fa-robot"></i>
          </div>
          <div>
            <h3 class="text-base font-black uppercase tracking-wide leading-tight">Play vs Bot</h3>
            <p class="text-[11px] font-bold text-emerald-950/80">Choose White / Black & Difficulty</p>
          </div>
        </div>
        <i class="fa-solid fa-chevron-right text-lg text-emerald-950/60"></i>
      </button>

      <!-- 2. Pass & Play (Local 2 Players) -->
      <a href="game.html?mode=pass" class="card-tap w-full p-4 rounded-3xl bg-slate-900 border border-slate-800 hover:border-cyan-500/50 flex items-center justify-between shadow-xl transition">
        <div class="flex items-center gap-3.5">
          <div class="w-12 h-12 rounded-2xl bg-cyan-500/10 border border-cyan-500/20 flex items-center justify-center text-cyan-400 text-xl">
            <i class="fa-solid fa-users"></i>
          </div>
          <div>
            <h3 class="text-sm font-black text-white uppercase tracking-wide leading-tight">Pass & Play</h3>
            <p class="text-[11px] text-slate-400 font-medium">1 Device, 2 Players (Offline Board)</p>
          </div>
        </div>
        <i class="fa-solid fa-arrow-right text-sm text-slate-500"></i>
      </a>

      <!-- 3. Friends & Social Hub -->
      <a href="friend.html" class="card-tap w-full p-4 rounded-3xl bg-slate-900 border border-slate-800 hover:border-emerald-500/50 flex items-center justify-between shadow-xl transition">
        <div class="flex items-center gap-3.5">
          <div class="w-12 h-12 rounded-2xl bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center text-emerald-400 text-xl">
            <i class="fa-solid fa-user-group"></i>
          </div>
          <div>
            <div class="flex items-center gap-2">
              <h3 class="text-sm font-black text-white uppercase tracking-wide leading-tight">Friends & Duels</h3>
              <span class="text-[9px] bg-emerald-500/20 text-emerald-400 px-1.5 py-0.2 rounded font-bold">ONLINE</span>
            </div>
            <p class="text-[11px] text-slate-400 font-medium">Friend Requests, Live Chat & Matches</p>
          </div>
        </div>
        <i class="fa-solid fa-arrow-right text-sm text-slate-500"></i>
      </a>

    </section>

    <!-- RECENTLY PLAYED MATCH HISTORY -->
    <section class="bg-slate-900/90 border border-slate-800 rounded-3xl p-4 shadow-xl flex flex-col gap-3">
      <div class="flex items-center justify-between border-b border-slate-800 pb-2">
        <h3 class="text-xs font-black uppercase tracking-wider text-slate-300 flex items-center gap-2">
          <i class="fa-solid fa-clock-rotate-left text-emerald-400"></i>
          <span>Recent Battles</span>
        </h3>
        <span id="historyCountBadge" class="text-[10px] text-slate-500 font-mono">0 Games</span>
      </div>

      <div id="matchHistoryFeed" class="flex flex-col gap-2 max-h-56 overflow-y-auto">
        <p class="text-center text-xs text-slate-500 py-6">Abhi koi match record nahi hua.</p>
      </div>
    </section>

  </main>

  <!-- Bot Color Selection Modal -->
  <div id="botColorModal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 w-full max-w-sm rounded-3xl p-5 shadow-2xl flex flex-col gap-4">
      <div class="flex items-center justify-between">
        <h3 class="text-sm font-black text-white uppercase tracking-wider flex items-center gap-2">
          <i class="fa-solid fa-chess-pawn text-emerald-400"></i>
          <span>Choose Your Pieces</span>
        </h3>
        <button onclick="closeColorModal()" class="w-7 h-7 rounded-xl bg-slate-800 text-slate-400 hover:text-white flex items-center justify-center">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <button onclick="startBotMatch('white')" class="flex flex-col items-center gap-2 p-4 rounded-2xl bg-slate-950 border-2 border-slate-800 hover:border-emerald-500 transition group">
          <div class="w-12 h-12 rounded-full bg-slate-100 flex items-center justify-center shadow-lg group-hover:scale-105 transition">
            <i class="fa-solid fa-chess-king text-2xl text-slate-900"></i>
          </div>
          <span class="text-xs font-black text-white">White (1st Move)</span>
        </button>

        <button onclick="startBotMatch('black')" class="flex flex-col items-center gap-2 p-4 rounded-2xl bg-slate-950 border-2 border-slate-800 hover:border-emerald-500 transition group">
          <div class="w-12 h-12 rounded-full bg-slate-900 border border-slate-700 flex items-center justify-center shadow-lg group-hover:scale-105 transition">
            <i class="fa-solid fa-chess-king text-2xl text-emerald-400"></i>
          </div>
          <span class="text-xs font-black text-white">Black (2nd Move)</span>
        </button>
      </div>
    </div>
  </div>

  <script>
    let myUID = localStorage.getItem('chess_game_uid') || localStorage.getItem('chess_uid') || localStorage.getItem('uid');
    if (!myUID) {
      myUID = Math.floor(1000000000 + Math.random() * 9000000000).toString();
      localStorage.setItem('chess_game_uid', myUID);
    }

    const myName = localStorage.getItem('chess_name') || 'Harsh Singh';
    const myRating = localStorage.getItem('chess_rating') || '1200';
    const won = parseInt(localStorage.getItem('chess_won') || '0', 10);
    const lost = parseInt(localStorage.getItem('chess_lost') || '0', 10);
    const total = won + lost;
    const winRate = total > 0 ? Math.round((won / total) * 100) + '%' : '0%';

    document.getElementById('profileUid').innerText = myUID;
    document.getElementById('profileName').innerText = myName;
    document.getElementById('playerAvatar').innerText = myName.charAt(0).toUpperCase();
    document.getElementById('profileRating').innerText = myRating;
    document.getElementById('statWon').innerText = won;
    document.getElementById('statLost').innerText = lost;
    document.getElementById('statWinRate').innerText = winRate;

    function copyUID() {
      navigator.clipboard.writeText(myUID);
      alert('UID Copied: ' + myUID);
    }

    function resetAccount() {
      if (confirm('Kya naya UID banana chahte ho?')) {
        localStorage.removeItem('chess_game_uid');
        location.reload();
      }
    }

    function openColorModal() {
      document.getElementById('botColorModal').classList.remove('hidden');
    }

    function closeColorModal() {
      document.getElementById('botColorModal').classList.add('hidden');
    }

    function startBotMatch(color) {
      closeColorModal();
      window.location.href = `game.html?mode=bot&side=${color}`;
    }

    // Render Match History Feed
    function loadRecentBattles() {
      let history = [];
      try {
        history = JSON.parse(localStorage.getItem('chess_match_history') || '[]');
      } catch (e) {}

      const container = document.getElementById('matchHistoryFeed');
      const badge = document.getElementById('historyCountBadge');
      badge.innerText = `${history.length} Games`;

      if (history.length === 0) {
        container.innerHTML = `<p class="text-center text-xs text-slate-500 py-6">Abhi koi match record nahi hua.</p>`;
        return;
      }

      container.innerHTML = '';
      history.slice(0, 10).forEach(m => {
        const item = document.createElement('div');
        item.className = "flex items-center justify-between p-2.5 rounded-2xl bg-slate-950/70 border border-slate-800/80 hover:border-emerald-500/30 transition";
        const isWin = m.won;
        item.innerHTML = `
          <div class="flex items-center gap-2.5">
            <div class="w-8 h-8 rounded-xl ${isWin ? 'bg-emerald-500/20 text-emerald-400' : 'bg-rose-500/20 text-rose-400'} flex items-center justify-center font-bold text-xs">
              ${isWin ? 'W' : 'L'}
            </div>
            <div>
              <h4 class="text-xs font-bold text-white">${m.opponent || 'Match'}</h4>
              <p class="text-[10px] text-slate-500 font-mono">${m.moves ? m.moves.length : 0} moves • ${m.playedSide || 'white'}</p>
            </div>
          </div>
          <div class="flex items-center gap-2">
            <span class="text-xs font-mono font-bold ${isWin ? 'text-emerald-400' : 'text-rose-400'}">
              ${m.delta > 0 ? '+' : ''}${m.delta || 0}
            </span>
            <a href="analysis.html" class="p-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 text-[11px]" title="Analyze">
              <i class="fa-solid fa-chart-line"></i>
            </a>
          </div>
        `;
        container.appendChild(item);
      });
    }

    loadRecentBattles();
  </script>
</body>
</html>
