<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Chess Universe | Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0b0f17; }
  </style>
</head>
<body class="text-slate-100 min-h-screen flex flex-col font-sans select-none antialiased">

  <!-- Header -->
  <header class="border-b border-slate-800/80 bg-slate-900/50 px-4 py-3 flex items-center justify-between sticky top-0 z-40 backdrop-blur-sm">
    <div class="flex items-center gap-2">
      <span class="text-emerald-400 font-black text-xl">♞</span>
      <span class="font-bold text-sm tracking-wide text-white">CHESS UNIVERSE</span>
    </div>
    <button id="btnLogout" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium px-3 py-1.5 rounded-lg border border-slate-700 transition">
      Logout
    </button>
  </header>

  <!-- Main Hub -->
  <main class="flex-1 max-w-md w-full mx-auto p-4 space-y-4">

    <!-- Profile & Permanent 10-Digit UID Card -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex items-center justify-between shadow-lg">
      <div class="flex items-center gap-3">
        <img id="userAvatar" src="" class="w-12 h-12 rounded-xl object-cover border border-slate-700 bg-slate-800" alt="Avatar">
        <div>
          <h2 id="userName" class="text-sm font-bold text-white">Player</h2>
          <div class="flex items-center gap-1.5 mt-0.5">
            <span class="text-[11px] text-slate-400">UID:</span>
            <span id="userUID" class="text-xs font-mono font-bold text-emerald-400 tracking-wider">----------</span>
            <button id="btnCopyUID" class="text-[10px] bg-slate-800 hover:bg-slate-700 text-slate-300 px-1.5 py-0.5 rounded border border-slate-700">Copy</button>
          </div>
        </div>
      </div>
      <div class="text-right">
        <span class="text-[10px] uppercase text-slate-500 font-bold block">Rating</span>
        <span id="userRating" class="text-sm font-bold font-mono text-emerald-400">1200</span>
      </div>
    </div>

    <!-- 3 Dedicated Mode Cards -->
    <div class="space-y-3 pt-2">

      <!-- 1. Bot Match (Stockfish AI) -->
      <a href="bot.html" class="block bg-slate-900 hover:bg-slate-800/80 border border-slate-800 hover:border-emerald-500/50 p-4 rounded-2xl transition group">
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-3.5">
            <div class="w-11 h-11 rounded-xl bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center text-xl text-emerald-400">
              🤖
            </div>
            <div>
              <h3 class="text-sm font-bold text-white group-hover:text-emerald-400 transition">Play vs Bot</h3>
              <p class="text-xs text-slate-400 mt-0.5">Stockfish Engine • 8 Difficulty Levels</p>
            </div>
          </div>
          <span class="text-slate-500 text-lg group-hover:translate-x-0.5 transition">→</span>
        </div>
      </a>

      <!-- 2. Online Match (Random PvP) -->
      <a href="online.html" class="block bg-slate-900 hover:bg-slate-800/80 border border-slate-800 hover:border-emerald-500/50 p-4 rounded-2xl transition group">
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-3.5">
            <div class="w-11 h-11 rounded-xl bg-sky-500/10 border border-sky-500/20 flex items-center justify-center text-xl text-sky-400">
              ⚡
            </div>
            <div>
              <h3 class="text-sm font-bold text-white group-hover:text-sky-400 transition">Play Online</h3>
              <p class="text-xs text-slate-400 mt-0.5">Quick Matchmaking • Bullet, Blitz & Rapid</p>
            </div>
          </div>
          <span class="text-slate-500 text-lg group-hover:translate-x-0.5 transition">→</span>
        </div>
      </a>

      <!-- 3. Play with Friend (10-Digit UID Duel) -->
      <a href="friend.html" class="block bg-slate-900 hover:bg-slate-800/80 border border-slate-800 hover:border-emerald-500/50 p-4 rounded-2xl transition group">
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-3.5">
            <div class="w-11 h-11 rounded-xl bg-amber-500/10 border border-amber-500/20 flex items-center justify-center text-xl text-amber-400">
              👥
            </div>
            <div>
              <h3 class="text-sm font-bold text-white group-hover:text-amber-400 transition">Play with Friend</h3>
              <p class="text-xs text-slate-400 mt-0.5">UID Search, Friends List & Private Room</p>
            </div>
          </div>
          <span class="text-slate-500 text-lg group-hover:translate-x-0.5 transition">→</span>
        </div>
      </a>

    </div>

  </main>

  <script>
    if (!localStorage.getItem('chess_auth')) {
      window.location.href = 'login.html';
    }

    const name = localStorage.getItem('chess_name') || 'Player';
    const uid = localStorage.getItem('chess_game_uid') || '1029384756';
    const rating = localStorage.getItem('chess_rating') || '1200';
    const avatar = localStorage.getItem('chess_avatar') || `https://api.dicebear.com/7.x/identicon/svg?seed=${uid}`;

    document.getElementById('userName').innerText = name;
    document.getElementById('userUID').innerText = uid;
    document.getElementById('userRating').innerText = rating;
    document.getElementById('userAvatar').src = avatar;

    document.getElementById('btnCopyUID').onclick = () => {
      navigator.clipboard.writeText(uid);
      alert('10-Digit UID Copied: ' + uid);
    };

    document.getElementById('btnLogout').onclick = () => {
      localStorage.clear();
      window.location.href = 'login.html';
    };
  </script>
</body>
</html>
