<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login & Verification | Chess Universe</title>
  
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">

  <!-- Main Login Card -->
  <div class="glass-card max-w-md w-full p-6 sm:p-8 space-y-6 border border-slate-800 shadow-2xl relative overflow-hidden">
    
    <!-- Brand Header -->
    <div class="text-center space-y-2">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-emerald-500/10 text-emerald-400 text-3xl border border-emerald-500/20 mb-1">
        ♞
      </div>
      <h1 class="text-2xl font-black tracking-tight text-white">CHESS UNIVERSE</h1>
      <p class="text-xs text-slate-400">Official Ranked Competitive Chess Arena</p>
    </div>

    <!-- Step 1: Input Identifier -->
    <div id="stepRequestOtp" class="space-y-4">
      <div>
        <label class="text-xs font-bold uppercase tracking-wider text-slate-400 block mb-2">
          Mobile Number or Email
        </label>
        <div class="relative">
          <input 
            type="text" 
            id="userInput" 
            placeholder="+91 98765 43210 or yourname@gmail.com" 
            class="w-full bg-slate-900/90 border border-slate-700 rounded-xl px-4 py-3.5 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-emerald-500 transition"
          >
        </div>
      </div>

      <button 
        id="btnSendOtp" 
        class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black py-3.5 rounded-xl text-sm transition flex items-center justify-center gap-2 shadow-lg shadow-emerald-500/20"
      >
        <span>Get Verification Code</span>
        <span>→</span>
      </button>

      <div class="pt-2 text-center">
        <p class="text-[11px] text-slate-500">
          By signing in, your initial 5 matches will evaluate your starting Grandmaster Elo rating.
        </p>
      </div>
    </div>

    <!-- Step 2: OTP Entry & Profile Nickname -->
    <div id="stepVerifyOtp" class="space-y-4 hidden">
      <div class="bg-slate-900/70 border border-slate-800 rounded-2xl p-4 space-y-3">
        <div class="flex items-center justify-between">
          <span class="text-xs font-bold text-slate-300">OTP Sent to:</span>
          <span id="displayContact" class="text-xs font-mono text-emerald-400 truncate max-w-[160px]"></span>
        </div>
        
        <!-- Quick Auto-Fill Display Badge -->
        <div class="flex items-center justify-between bg-amber-500/10 border border-amber-500/20 rounded-xl px-3 py-2">
          <span class="text-xs text-amber-300 font-semibold">Your Security Code:</span>
          <span id="demoOtpBadge" class="text-xs font-mono font-black text-amber-400 tracking-wider"></span>
        </div>
      </div>

      <!-- 6-Digit Box -->
      <div>
        <label class="text-xs font-bold uppercase tracking-wider text-slate-400 block mb-2 text-center">
          Enter 6-Digit OTP
        </label>
        <input 
          type="text" 
          id="otpInput" 
          maxlength="6" 
          placeholder="0 0 0 0 0 0" 
          class="w-full bg-slate-900 border border-slate-700 rounded-xl py-3 text-center text-xl tracking-[0.5em] font-mono font-bold text-emerald-400 focus:outline-none focus:border-emerald-500 transition"
        >
      </div>

      <!-- Username Handle -->
      <div>
        <label class="text-xs font-bold uppercase tracking-wider text-slate-400 block mb-2">
          Choose Player Nickname
        </label>
        <input 
          type="text" 
          id="nickInput" 
          placeholder="e.g. DesiVishy, PawnSlayer" 
          maxlength="16"
          class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-emerald-500 transition"
        >
      </div>

      <!-- Action Button -->
      <button 
        id="btnVerify" 
        class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black py-3.5 rounded-xl text-sm transition shadow-lg shadow-emerald-500/20"
      >
        Verify & Enter Arena
      </button>

      <div class="flex items-center justify-between text-xs text-slate-400 pt-1">
        <button id="btnBackToInput" class="hover:text-slate-200 transition">← Change number/email</button>
        <button id="btnResendOtp" class="text-emerald-400 hover:underline">Resend OTP</button>
      </div>
    </div>

  </div>

  <script>
    let generatedOtp = null;
    let savedContact = "";

    // Step 1: Send OTP handler
    document.getElementById('btnSendOtp').onclick = () => {
      const inputVal = document.getElementById('userInput').value.trim();
      
      if (!inputVal || inputVal.length < 5) {
        alert("Please enter a valid Mobile Number or Email address.");
        return;
      }

      savedContact = inputVal;
      document.getElementById('displayContact').innerText = savedContact;

      // 6 Digit random code
      generatedOtp = Math.floor(100000 + Math.random() * 900000).toString();

      document.getElementById('demoOtpBadge').innerText = generatedOtp;
      document.getElementById('otpInput').value = generatedOtp; // Auto-fill for convenience

      document.getElementById('stepRequestOtp').classList.add('hidden');
      document.getElementById('stepVerifyOtp').classList.remove('hidden');
    };

    // Step 2: Verify & Activate Profile
    document.getElementById('btnVerify').onclick = () => {
      const enteredOtp = document.getElementById('otpInput').value.trim();
      const nickname = document.getElementById('nickInput').value.trim() || `Player_${Math.floor(1000 + Math.random() * 9000)}`;

      if (enteredOtp !== generatedOtp) {
        alert("Invalid OTP! Please check the 6-digit code shown.");
        return;
      }

      // Save user session
      localStorage.setItem('chess_auth', 'true');
      localStorage.setItem('chess_contact', savedContact);
      localStorage.setItem('chess_name', nickname);
      localStorage.setItem('chess_avatar', `https://api.dicebear.com/7.x/bottts/svg?seed=${encodeURIComponent(nickname)}`);
      
      // Initialize 5-Game Calibration Engine
      if (!localStorage.getItem('chess_calibration_games')) {
        localStorage.setItem('chess_calibration_games', '0'); // Completed 0/5 matches
        localStorage.setItem('chess_rating', 'Calibrating (?)');
        localStorage.setItem('chess_calibration_score', '0'); // Internal tracker
      }

      // Unlock only Bot 1 by default (Campaign Progression)
      if (!localStorage.getItem('chess_max_bot_unlocked')) {
        localStorage.setItem('chess_max_bot_unlocked', '1');
      }

      // Redirect to Lobby
      window.location.href = 'index.html';
    };

    // Resend code trigger
    document.getElementById('btnResendOtp').onclick = () => {
      generatedOtp = Math.floor(100000 + Math.random() * 900000).toString();
      document.getElementById('demoOtpBadge').innerText = generatedOtp;
      document.getElementById('otpInput').value = generatedOtp;
      alert("New OTP generated!");
    };

    // Back to edit contact
    document.getElementById('btnBackToInput').onclick = () => {
      document.getElementById('stepVerifyOtp').classList.add('hidden');
      document.getElementById('stepRequestOtp').classList.remove('hidden');
    };
  </script>
</body>
</html>
