<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login & Setup | Chess Universe</title>
  
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">

  <!-- Main Login Card -->
  <div class="glass-card max-w-md w-full p-6 sm:p-8 space-y-6 border border-slate-800 shadow-2xl relative overflow-hidden">
    
    <!-- Brand Header -->
    <div class="text-center space-y-2">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-emerald-500/10 text-emerald-400 text-3xl border border-emerald-500/20 mb-1">
        ♞
      </div>
      <h1 class="text-2xl font-black tracking-tight text-white">CHESS UNIVERSE</h1>
      <p class="text-xs text-slate-400">Join Ranked Battles & Bot Championships</p>
    </div>

    <!-- Quick Player Identity Setup -->
    <div class="space-y-4">
      <div>
        <label class="text-xs font-bold uppercase tracking-wider text-slate-400 block mb-2">
          Your Player Handle (Username)
        </label>
        <div class="relative">
          <input 
            type="text" 
            id="nickInput" 
            placeholder="e.g. Grandmaster_Raju" 
            maxlength="16"
            class="w-full bg-slate-900/90 border border-slate-700 rounded-xl px-4 py-3.5 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-emerald-500 transition font-mono font-bold"
          >
        </div>
      </div>

      <div>
        <label class="text-xs font-bold uppercase tracking-wider text-slate-400 block mb-2">
          Mobile Number or Email (Optional)
        </label>
        <input 
          type="text" 
          id="contactInput" 
          placeholder="+91 98765 43210 or name@mail.com" 
          class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-xs text-slate-100 placeholder-slate-500 focus:outline-none focus:border-emerald-500 transition font-mono"
        >
      </div>

      <!-- Action Button: Direct Access -->
      <button 
        id="btnEnter" 
        class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black py-3.5 rounded-xl text-sm transition flex items-center justify-center gap-2 shadow-lg shadow-emerald-500/20"
      >
        <span>Enter Chess Arena ⚡</span>
      </button>

      <div class="text-center pt-2">
        <p class="text-[11px] text-slate-500">
          Instant guest authentication. Starts with 5-game rating calibration.
        </p>
      </div>
    </div>

  </div>

  <script>
    document.getElementById('btnEnter').onclick = () => {
      let nickname = document.getElementById('nickInput').value.trim();
      const contact = document.getElementById('contactInput').value.trim() || 'Guest Player';

      if (!nickname || nickname.length < 2) {
        nickname = 'Player_' + Math.floor(1000 + Math.random() * 9000);
      }

      const playerTag = '#CHESS-' + Math.floor(1000 + Math.random() * 9000);

      // Save complete session locally
      localStorage.setItem('chess_auth', 'true');
      localStorage.setItem('chess_name', nickname);
      localStorage.setItem('chess_contact', contact);
      localStorage.setItem('chess_player_tag', playerTag);
      localStorage.setItem('chess_avatar', `https://api.dicebear.com/7.x/bottts/svg?seed=${encodeURIComponent(nickname)}`);
      
      // 5-Game Calibration init
      if (!localStorage.getItem('chess_calibration_games')) {
        localStorage.setItem('chess_calibration_games', '0');
        localStorage.setItem('chess_rating', 'Calibrating (?)');
        localStorage.setItem('chess_calibration_score', '0');
      }

      // Campaign mode init
      if (!localStorage.getItem('chess_max_bot_unlocked')) {
        localStorage.setItem('chess_max_bot_unlocked', '1');
      }

      window.location.href = 'index.html';
    };
  </script>
</body>
</html>
