<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Chess Universe</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0b0f17; }
  </style>
</head>
<body class="text-slate-100 min-h-screen flex items-center justify-center p-4">

  <div id="recaptcha-container"></div>

  <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-2xl p-6 sm:p-8 space-y-6 shadow-2xl">
    
    <div class="text-center space-y-1">
      <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-emerald-500/10 text-emerald-400 text-2xl border border-emerald-500/20 mb-2">
        ♞
      </div>
      <h1 class="text-xl font-bold tracking-tight text-white">CHESS UNIVERSE</h1>
      <p class="text-xs text-slate-400">Sign in to get your permanent 10-Digit Game UID</p>
    </div>

    <!-- Google 1-Tap -->
    <button id="btnGoogleSignIn" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-100 font-semibold py-3 px-4 rounded-xl text-sm border border-slate-700 flex items-center justify-center gap-3 transition">
      <svg class="w-4 h-4" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
      </svg>
      Continue with Google
    </button>

    <div class="flex items-center">
      <div class="flex-1 border-t border-slate-800"></div>
      <span class="px-3 text-[11px] text-slate-500 uppercase font-semibold tracking-wider">or mobile sms</span>
      <div class="flex-1 border-t border-slate-800"></div>
    </div>

    <!-- Mobile Input -->
    <div id="stepSend" class="space-y-4">
      <div>
        <label class="text-xs text-slate-400 block mb-1.5 font-medium">Username</label>
        <input type="text" id="nickInput" placeholder="Enter username" maxlength="16" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-emerald-500">
      </div>

      <div>
        <label class="text-xs text-slate-400 block mb-1.5 font-medium">10-Digit Mobile Number</label>
        <div class="flex">
          <span class="inline-flex items-center px-3.5 rounded-l-xl border border-r-0 border-slate-800 bg-slate-800/50 text-slate-400 text-sm font-mono">+91</span>
          <input type="tel" id="phoneInput" placeholder="9876543210" maxlength="10" class="w-full bg-slate-950 border border-slate-800 rounded-r-xl px-3.5 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-emerald-500 font-mono">
        </div>
      </div>

      <button id="btnSendOtp" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold py-2.5 rounded-xl text-sm transition">
        Send OTP
      </button>
    </div>

    <!-- Verify OTP -->
    <div id="stepVerify" class="space-y-4 hidden">
      <div class="bg-slate-950 p-2.5 rounded-xl border border-slate-800 text-center text-xs text-slate-400">
        Code sent to <span id="displayPhone" class="font-mono text-emerald-400 font-semibold"></span>
      </div>

      <div>
        <label class="text-xs text-slate-400 block mb-1.5 text-center">6-Digit SMS Code</label>
        <input type="text" id="otpInput" maxlength="6" placeholder="••••••" class="w-full bg-slate-950 border border-slate-800 rounded-xl py-2.5 text-center text-xl tracking-[0.4em] font-mono font-bold text-emerald-400 focus:outline-none focus:border-emerald-500">
      </div>

      <button id="btnVerifyOtp" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold py-2.5 rounded-xl text-sm transition">
        Verify & Continue
      </button>

      <button id="btnBack" class="w-full text-xs text-slate-500 hover:text-slate-400">← Back</button>
    </div>

  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { getAuth, RecaptchaVerifier, signInWithPhoneNumber, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBx79cUd4hX7XzCe8aCPIeqLss1d5nNzaM",
      authDomain: "chess-universe-5a7cb.firebaseapp.com",
      projectId: "chess-universe-5a7cb",
      storageBucket: "chess-universe-5a7cb.firebasestorage.app",
      messagingSenderId: "145519167856",
      appId: "1:145519167856:web:bf124bc275895447fd27b5"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const googleProvider = new GoogleAuthProvider();

    let confirmationResult = null;
    window.recaptchaVerifier = new RecaptchaVerifier(auth, 'recaptcha-container', { size: 'invisible' });

    // Generate guaranteed 10-digit numeric ID
    function generate10DigitUID() {
      const min = 1000000000;
      const max = 9999999999;
      return Math.floor(min + Math.random() * (max - min + 1)).toString();
    }

    async function syncUserWithDatabase(firebaseUser, defaultName) {
      const userRef = doc(db, "users", firebaseUser.uid);
      const userSnap = await getDoc(userRef);

      let finalUID, finalName, finalAvatar;

      if (userSnap.exists()) {
        const data = userSnap.data();
        finalUID = data.gameUID || generate10DigitUID();
        finalName = data.name || defaultName;
        finalAvatar = data.avatar || `https://api.dicebear.com/7.x/identicon/svg?seed=${finalUID}`;
      } else {
        finalUID = generate10DigitUID();
        finalName = defaultName || "Player";
        finalAvatar = firebaseUser.photoURL || `https://api.dicebear.com/7.x/identicon/svg?seed=${finalUID}`;

        await setDoc(userRef, {
          uid: firebaseUser.uid,
          gameUID: finalUID,
          name: finalName,
          email: firebaseUser.email || "",
          phone: firebaseUser.phoneNumber || "",
          avatar: finalAvatar,
          rating: 1200,
          friends: [],
          createdAt: new Date().toISOString()
        });

        // Fast lookup index by gameUID
        await setDoc(doc(db, "uids", finalUID), {
          firebaseUID: firebaseUser.uid,
          name: finalName,
          rating: 1200
        });
      }

      localStorage.setItem('chess_auth', 'true');
      localStorage.setItem('chess_firebase_uid', firebaseUser.uid);
      localStorage.setItem('chess_game_uid', finalUID);
      localStorage.setItem('chess_name', finalName);
      localStorage.setItem('chess_avatar', finalAvatar);
      localStorage.setItem('chess_rating', '1200');

      window.location.href = 'index.html';
    }

    // Google Sign-In
    document.getElementById('btnGoogleSignIn').onclick = async () => {
      try {
        const res = await signInWithPopup(auth, googleProvider);
        const name = res.user.displayName || res.user.email.split('@')[0];
        await syncUserWithDatabase(res.user, name);
      } catch (err) {
        console.error(err);
        alert("Google Login Error: " + err.message);
      }
    };

    // SMS Flow
    document.getElementById('btnSendOtp').onclick = async () => {
      const nick = document.getElementById('nickInput').value.trim();
      const phone = document.getElementById('phoneInput').value.trim();

      if (!nick || nick.length < 3) return alert("Username at least 3 characters!");
      if (!phone || phone.length !== 10 || isNaN(phone)) return alert("Valid 10-digit number required!");

      const fullPhone = '+91' + phone;
      const btn = document.getElementById('btnSendOtp');
      btn.innerText = "Sending...";
      btn.disabled = true;

      try {
        confirmationResult = await signInWithPhoneNumber(auth, fullPhone, window.recaptchaVerifier);
        document.getElementById('displayPhone').innerText = fullPhone;
        document.getElementById('stepSend').classList.add('hidden');
        document.getElementById('stepVerify').classList.remove('hidden');
      } catch (err) {
        console.error(err);
        alert("SMS Error: " + err.message);
        btn.innerText = "Send OTP";
        btn.disabled = false;
      }
    };

    document.getElementById('btnVerifyOtp').onclick = async () => {
      const code = document.getElementById('otpInput').value.trim();
      if (!code || code.length !== 6) return alert("Enter 6-digit OTP!");

      const btn = document.getElementById('btnVerifyOtp');
      btn.innerText = "Verifying...";
      btn.disabled = true;

      try {
        const res = await confirmationResult.confirm(code);
        const nick = document.getElementById('nickInput').value.trim();
        await syncUserWithDatabase(res.user, nick);
      } catch (err) {
        console.error(err);
        alert("Invalid OTP!");
        btn.innerText = "Verify & Continue";
        btn.disabled = false;
      }
    };

    document.getElementById('btnBack').onclick = () => {
      document.getElementById('stepVerify').classList.add('hidden');
      document.getElementById('stepSend').classList.remove('hidden');
      document.getElementById('btnSendOtp').disabled = false;
      document.getElementById('btnSendOtp').innerText = "Send OTP";
    };
  </script>
</body>
</html>
