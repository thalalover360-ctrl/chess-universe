<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Chess Universe</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">

  <div id="recaptcha-container"></div>

  <div class="glass-card max-w-md w-full p-6 sm:p-8 space-y-6 border border-slate-800 shadow-2xl">
    
    <div class="text-center space-y-2">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-emerald-500/10 text-emerald-400 text-3xl border border-emerald-500/20 mb-1">
        ♞
      </div>
      <h1 class="text-2xl font-black text-white tracking-wide">CHESS UNIVERSE</h1>
      <p class="text-xs text-slate-400">Play Online Multiplayer & Bots</p>
    </div>

    <!-- Step 1: Sign-In Choices -->
    <div id="stepSend" class="space-y-4">
      
      <!-- Google 1-Tap Sign-In -->
      <button id="btnGoogleSignIn" class="w-full bg-slate-900 hover:bg-slate-800 text-slate-100 font-bold py-3 px-4 rounded-xl text-sm border border-slate-700 flex items-center justify-center gap-3 transition">
        <svg class="w-5 h-5" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        Continue with Google
      </button>

      <div class="flex items-center my-3">
        <div class="flex-1 border-t border-slate-800"></div>
        <span class="px-3 text-[11px] text-slate-500 uppercase font-bold tracking-wider">or phone sms</span>
        <div class="flex-1 border-t border-slate-800"></div>
      </div>

      <!-- Phone SMS Section -->
      <div>
        <label class="text-xs font-bold uppercase tracking-wider text-slate-400 block mb-2">Username</label>
        <input type="text" id="nickInput" placeholder="Choose username" maxlength="15" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm text-slate-100 focus:outline-none focus:border-emerald-500 font-bold">
      </div>

      <div>
        <label class="text-xs font-bold uppercase tracking-wider text-slate-400 block mb-2">Mobile Number (10 Digits)</label>
        <div class="flex">
          <span class="inline-flex items-center px-4 rounded-l-xl border border-r-0 border-slate-700 bg-slate-800 text-slate-300 font-mono text-sm">+91</span>
          <input type="tel" id="phoneInput" placeholder="9876543210" maxlength="10" class="w-full bg-slate-900 border border-slate-700 rounded-r-xl px-4 py-3 text-sm text-slate-100 focus:outline-none focus:border-emerald-500 font-mono">
        </div>
      </div>

      <button id="btnSendOtp" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black py-3.5 rounded-xl text-sm transition">
        Send SMS OTP →
      </button>
    </div>

    <!-- Step 2: Verification Code -->
    <div id="stepVerify" class="space-y-4 hidden">
      <div class="bg-slate-900 p-3 rounded-xl border border-slate-800 text-center text-xs">
        SMS OTP sent to <span id="displayPhone" class="font-mono text-emerald-400 font-bold"></span>
      </div>

      <div>
        <label class="text-xs font-bold uppercase tracking-wider text-slate-400 block mb-2 text-center">Enter 6-Digit SMS Code</label>
        <input type="text" id="otpInput" maxlength="6" placeholder="••••••" class="w-full bg-slate-900 border border-slate-700 rounded-xl py-3 text-center text-2xl tracking-[0.4em] font-mono font-bold text-emerald-400 focus:outline-none focus:border-emerald-500">
      </div>

      <button id="btnVerifyOtp" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black py-3.5 rounded-xl text-sm transition">
        Verify SMS & Enter Arena ⚡
      </button>

      <button id="btnBack" class="w-full text-xs text-slate-500 hover:text-slate-300 py-1">← Change Number</button>
    </div>

  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { 
      getAuth, 
      RecaptchaVerifier, 
      signInWithPhoneNumber,
      GoogleAuthProvider,
      signInWithPopup
    } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBx79cUd4hX7XzCe8aCPIeqLss1d5nNzaM",
      authDomain: "chess-universe-5a7cb.firebaseapp.com",
      projectId: "chess-universe-5a7cb",
      storageBucket: "chess-universe-5a7cb.firebasestorage.app",
      messagingSenderId: "145519167856",
      appId: "1:145519167856:web:bf124bc275895447fd27b5"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const googleProvider = new GoogleAuthProvider();

    let confirmationResult = null;

    window.recaptchaVerifier = new RecaptchaVerifier(auth, 'recaptcha-container', {
      'size': 'invisible'
    });

    function finalizeLogin(name, contact, avatar) {
      const tag = '#CHESS-' + Math.floor(1000 + Math.random() * 9000);
      localStorage.setItem('chess_auth', 'true');
      localStorage.setItem('chess_name', name);
      localStorage.setItem('chess_contact', contact);
      localStorage.setItem('chess_player_tag', tag);
      localStorage.setItem('chess_avatar', avatar);

      if (!localStorage.getItem('chess_calibration_games')) {
        localStorage.setItem('chess_calibration_games', '0');
        localStorage.setItem('chess_rating', 'Calibrating (?)');
      }
      if (!localStorage.getItem('chess_max_bot_unlocked')) {
        localStorage.setItem('chess_max_bot_unlocked', '1');
      }

      window.location.href = 'index.html';
    }

    // Google Sign-In
    document.getElementById('btnGoogleSignIn').onclick = async () => {
      try {
        const result = await signInWithPopup(auth, googleProvider);
        const user = result.user;
        const name = user.displayName || user.email.split('@')[0];
        const avatar = user.photoURL || `https://api.dicebear.com/7.x/bottts/svg?seed=${encodeURIComponent(name)}`;
        finalizeLogin(name, user.email, avatar);
      } catch (err) {
        console.error(err);
        alert("Google Login Error: " + err.message);
      }
    };

    // Phone SMS Sign-In
    document.getElementById('btnSendOtp').onclick = async () => {
      const nick = document.getElementById('nickInput').value.trim();
      let phone = document.getElementById('phoneInput').value.trim();

      if (!nick || nick.length < 3) {
        alert("Username kam se kam 3 letters ka hona chahiye!");
        return;
      }
      if (!phone || phone.length !== 10 || isNaN(phone)) {
        alert("10-digit mobile number enter karo!");
        return;
      }

      const fullPhone = '+91' + phone;
      const btn = document.getElementById('btnSendOtp');
      btn.innerText = "Sending Real SMS...";
      btn.disabled = true;

      try {
        confirmationResult = await signInWithPhoneNumber(auth, fullPhone, window.recaptchaVerifier);
        document.getElementById('displayPhone').innerText = fullPhone;
        document.getElementById('stepSend').classList.add('hidden');
        document.getElementById('stepVerify').classList.remove('hidden');
      } catch (err) {
        console.error(err);
        alert("SMS Error: " + err.message);
        btn.innerText = "Send SMS OTP →";
        btn.disabled = false;
      }
    };

    document.getElementById('btnVerifyOtp').onclick = async () => {
      const code = document.getElementById('otpInput').value.trim();
      if (!code || code.length !== 6) {
        alert("6-digit SMS code enter karo!");
        return;
      }

      const btn = document.getElementById('btnVerifyOtp');
      btn.innerText = "Verifying...";
      btn.disabled = true;

      try {
        await confirmationResult.confirm(code);
        const nick = document.getElementById('nickInput').value.trim();
        const phone = document.getElementById('phoneInput').value.trim();
        const avatar = `https://api.dicebear.com/7.x/bottts/svg?seed=${encodeURIComponent(nick)}`;
        finalizeLogin(nick, '+91 ' + phone, avatar);
      } catch (err) {
        console.error(err);
        alert("Galat code ya verification expire ho chuka hai!");
        btn.innerText = "Verify SMS & Enter Arena ⚡";
        btn.disabled = false;
      }
    };

    document.getElementById('btnBack').onclick = () => {
      document.getElementById('stepVerify').classList.add('hidden');
      document.getElementById('stepSend').classList.remove('hidden');
      document.getElementById('btnSendOtp').disabled = false;
      document.getElementById('btnSendOtp').innerText = "Send SMS OTP →";
    };
  </script>
</body>
</html>
