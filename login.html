<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07110e">
  <title>Account | Chess Universe</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .auth-page {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 1fr 1fr;
    }
    .auth-showcase {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: clamp(28px,7vw,90px);
      background:
        radial-gradient(ellipse at 20% 30%,rgba(0,214,154,.12),transparent 55%),
        #091711;
      border-right: 1px solid var(--border);
    }
    .auth-brand { color:var(--gold); font-weight:800; font-size:1.15rem; }
    .auth-showcase h1 { margin:25px 0 15px; }
    .showcase-piece { margin-top:30px; font-size:clamp(7rem,18vw,13rem); line-height:1; color:var(--gold); text-shadow:0 0 65px rgba(231,189,105,.15); }
    .auth-side { display:grid; place-items:center; padding:28px 16px; }
    .auth-box { width:min(420px,100%); }
    .back-link { display:inline-block; margin-bottom:25px; color:var(--muted); }
    .back-link:hover { color:var(--green); }
    .tabs { display:grid; grid-template-columns:1fr 1fr; gap:8px; padding:5px; margin:22px 0; border:1px solid var(--border); border-radius:13px; background:#08140f; }
    .tab { padding:11px; border:0; border-radius:9px; color:var(--muted); background:transparent; font-weight:700; }
    .tab.active { color:#06130d; background:var(--green); }
    .field { margin-bottom:16px; }
    .password-wrap { display:flex; gap:8px; }
    .password-wrap input { flex:1; min-width:0; }
    .show-password { padding:0 12px; border:1px solid var(--border); border-radius:10px; color:var(--muted); background:var(--panel); }
    .submit-btn { width:100%; margin-top:5px; }
    .auth-message { display:none; margin-top:16px; padding:12px; border-radius:10px; color:var(--gold); background:rgba(231,189,105,.08); font-size:.88rem; }
    .auth-footnote { margin-top:20px; text-align:center; font-size:.82rem; }
    .home-link { color:var(--green); }
    @media(max-width:760px) {
      .auth-page { grid-template-columns:1fr; }
      .auth-showcase { padding:28px 22px; border-right:0; border-bottom:1px solid var(--border); }
      .auth-showcase h1 { font-size:2.5rem; }
      .showcase-piece { display:none; }
      .auth-side { padding:30px 18px 45px; }
    }
  </style>
</head>
<body>
  <main class="auth-page">
    <section class="auth-showcase">
      <a class="auth-brand" href="index.html">♟ CHESS UNIVERSE</a>
      <span class="eyebrow" style="width:max-content;margin-top:38px">YOUR NEXT CHAPTER</span>
      <h1>Every Move<br><span class="gradient-text">Tells a Story.</span></h1>
      <p>Enter the arena. Challenge your limits. Build your chess journey.</p>
      <div class="showcase-piece" aria-hidden="true">♚</div>
    </section>

    <section class="auth-side">
      <div class="auth-box">
        <a class="back-link" href="index.html">← Back to Home</a>
        <h2 id="formTitle">Welcome Back</h2>
        <p id="formSubtitle">Sign in to your Chess Universe account.</p>

        <div class="tabs">
          <button class="tab active" id="loginTab" type="button">Login</button>
          <button class="tab" id="signupTab" type="button">Sign Up</button>
        </div>

        <form id="authForm">
          <div class="field" id="usernameField" hidden>
            <label for="username">Username</label>
            <input id="username" name="username" type="text" placeholder="Choose a username" minlength="3" autocomplete="username">
          </div>

          <div class="field">
            <label for="email">Email address</label>
            <input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required>
          </div>

          <div class="field">
            <label for="password">Password</label>
            <div class="password-wrap">
              <input id="password" name="password" type="password" placeholder="Enter your password" minlength="6" autocomplete="current-password" required>
              <button class="show-password" id="togglePassword" type="button" aria-label="Show password">Show</button>
            </div>
          </div>

          <div class="field" id="confirmField" hidden>
            <label for="confirmPassword">Confirm password</label>
            <input id="confirmPassword" type="password" placeholder="Enter password again" minlength="6" autocomplete="new-password">
          </div>

          <button class="btn btn-primary submit-btn" id="submitButton" type="submit">Login →</button>
        </form>

        <div class="auth-message" id="authMessage" role="status"></div>
        <p class="auth-footnote">
          <a class="home-link" href="bot-game.html">Play as guest</a>
          <span> · </span>
          <a class="home-link" href="multiplayer.html">Multiplayer</a>
        </p>
        <p class="auth-footnote">Account security requires a real authentication backend.</p>
      </div>
    </section>
  </main>

  <script>
    const loginTab = document.getElementById("loginTab");
    const signupTab = document.getElementById("signupTab");
    const formTitle = document.getElementById("formTitle");
    const formSubtitle = document.getElementById("formSubtitle");
    const usernameField = document.getElementById("usernameField");
    const confirmField = document.getElementById("confirmField");
    const username = document.getElementById("username");
    const password = document.getElementById("password");
    const confirmPassword = document.getElementById("confirmPassword");
    const submitButton = document.getElementById("submitButton");
    const authMessage = document.getElementById("authMessage");
    const authForm = document.getElementById("authForm");

    let mode = "login";

    function setMode(nextMode) {
      mode = nextMode;
      const signup = mode === "signup";

      loginTab.classList.toggle("active", !signup);
      signupTab.classList.toggle("active", signup);
      usernameField.hidden = !signup;
      confirmField.hidden = !signup;
      username.required = signup;
      confirmPassword.required = signup;
      password.autocomplete = signup ? "new-password" : "current-password";
      formTitle.textContent = signup ? "Create Account" : "Welcome Back";
      formSubtitle.textContent = signup
        ? "Create your Chess Universe account."
        : "Sign in to your Chess Universe account.";
      submitButton.textContent = signup ? "Create Account →" : "Login →";
      authMessage.style.display = "none";
    }

    loginTab.addEventListener("click", () => setMode("login"));
    signupTab.addEventListener("click", () => setMode("signup"));

    document.getElementById("togglePassword").addEventListener("click", function () {
      const showing = password.type === "text";
      password.type = showing ? "password" : "text";
      this.textContent = showing ? "Show" : "Hide";
      this.setAttribute("aria-label", showing ? "Show password" : "Hide password");
    });

    authForm.addEventListener("submit", function (event) {
      event.preventDefault();

      if (mode === "signup" && password.value !== confirmPassword.value) {
        authMessage.textContent = "Passwords do not match. Please try again.";
        authMessage.style.display = "block";
        confirmPassword.focus();
        return;
      }

      authMessage.textContent = mode === "signup"
        ? "The form is ready, but account creation is not connected yet. Connect Firebase Authentication to enable signup."
        : "Login is not connected yet. Connect Firebase Authentication to enable real accounts.";

      authMessage.style.display = "block";
    });
  </script>
</body>
</html>
