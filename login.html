<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login & Verification | Chess Universe</title>
  
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">

  <!-- Invisible Recaptcha Container -->
  <div id="recaptcha-container"></div>

  <!-- Main Login Card -->
  <div class="glass-card max-w-md w-full p-6 sm:p-8 space-y-6 border border-slate-800 shadow-2xl relative overflow-hidden">
    
    <!-- Brand Header -->
    <div class="text-center space-y-2">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-emerald-500/10 text-emerald-400 text-3xl border border-emerald-500/20 mb-1">
        ♞
      </div>
      <h1 class="text-2xl font-black tracking-tight text-white">CHESS UNIVERSE</h1>
      <p class="text-xs text-slate-400">Official Mobile OTP Verification</p>
    </div>

    <!-- Step 1: Mobile Number Input -->
    <div id="stepRequestOtp" class="space-y-4">
      <div>
        <label class="text-xs font-bold uppercase tracking-wider text-slate-400 block mb-2">
          Mobile Number (with Country Code)
        </label>
        <div class="relative">
          <input 
            type="tel" 
            id="phoneInput" 
            placeholder="+91 9876543210" 
            class="w-full bg-slate-900/90 border border-slate-700 rounded-xl px-4 py-3.5 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-emerald-500 transition font-mono"
          >
        </div>
        <span class="text-[11px] text-slate-500 mt-1 block">Example: +91 followed by 10 digit number</span>
      </div>

      <button 
        id="btnSendOtp" 
        class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black py-3.5 rounded-xl text-sm transition flex items-center justify-center gap-2 shadow-lg shadow-emerald-500/20"
      >
        <span id="sendBtnText">Send SMS OTP</span>
        <span>→</span>
      </button>

      <div class="pt-2 text-center">
        <p class="text-[11px] text-slate-500">
          Standard SMS verification powered by Google Firebase.
        </p>
      </div>
    </div>

    <!-- Step 2: Enter Real Received SMS OTP -->
    <div id="stepVerifyOtp" class="space-y-4 hidden">
      <div class="bg-slate-900/70 border border-slate-800 rounded-2xl p-4 text-center">
        <span class="text-xs font-bold text-slate-400 block mb-1">SMS Sent To:</span>
        <span id="displayContact" class="text-sm font-mono font-bold text-emerald-400"></span>
      </div>

      <!-- 6-Digit Code Input -->
      <div>
        <label class="text-xs font-bold uppercase tracking-wider text-slate-400 block mb-2 text-center">
          Enter OTP from SMS
        </label>
        <input 
          type="text" 
          id="otpInput" 
          maxlength="6" 
          placeholder="• • • • • •" 
          class="w-full bg-slate-900 border border-slate-700 rounded-xl py-3 text-center text-xl tracking-[0.4em] font-mono font-bold text-emerald-400 focus:outline-none focus:border-emerald-500 transition"
        >
      </div>

      <!-- Username Handle -->
      <div>
        <label class="text-xs font-bold uppercase tracking-wider text-slate-400 block mb-2">
          Player Nickname
        </label>
        <input 
          type="text" 
          id="nickInput" 
          placeholder="Grandmaster" 
          maxlength="16"
          class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-emerald-500 transition"
        >
      </div>

      <!-- Action Button -->
      <button 
        id="btnVerify" 
        class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black py-3.5 rounded-xl text-sm transition shadow-lg shadow-emerald-500/20"
      >
        Verify SMS Code & Enter
      </button>

      <div class="text-center pt-1">
        <button id="btnBackToInput" class="text-xs text-slate-400 hover:text-slate-200 transition">← Change Phone Number</button>
      </div>
    </div>

  </div>

  <!-- Firebase Scripts -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { getAuth, RecaptchaVerifier, signInWithPhoneNumber } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBx79cUd4hX7XzCe8aCPIeqLss1d5nNzaM",
      authDomain: "chess-universe-5a7cb.firebaseapp.com",
      projectId: "chess-universe-5a7cb",
      storageBucket: "chess-universe-5a7cb.firebasestorage.app",
      messagingSenderId: "145519167856",
      appId: "1:145519167856:web:bf124bc275895447fd27b5"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    let confirmationResult = null;

    // Invisible Recaptcha Setup
    window.recaptchaVerifier = new RecaptchaVerifier(auth, 'recaptcha-container', {
      'size': 'invisible',
      'callback': () => {}
    });

    // Send Real SMS
    document.getElementById('btnSendOtp').onclick = async () => {
      let phone = document.getElementById('phoneInput').value.trim();
      if (!phone) {
        alert("Please enter your mobile number!");
        return;
      }

      // Auto prepend +91 if user only typed 10 digits
      if (!phone.startsWith('+')) {
        if (phone.length === 10) {
          phone = '+91' + phone;
        } else {
          alert("Please enter complete number with country code (e.g. +91 9876543210)");
          return;
        }
      }

      const btn = document.getElementById('btnSendOtp');
      const btnText = document.getElementById('sendBtnText');
      btn.disabled = true;
      btnText.innerText = "Sending Real SMS...";

      try {
        const appVerifier = window.recaptchaVerifier;
        confirmationResult = await signInWithPhoneNumber(auth, phone, appVerifier);
        
        document.getElementById('displayContact').innerText = phone;
        document.getElementById('stepRequestOtp').classList.add('hidden');
        document.getElementById('stepVerifyOtp').classList.remove('hidden');
      } catch (err) {
        console.error(err);
        alert("SMS bhejne me error: " + err.message + "\n\nMake sure Firebase console me Phone Auth enable kiya ho!");
        btn.disabled = false;
        btnText.innerText = "Send SMS OTP";
      }
    };

    // Verify Real Received SMS OTP
    document.getElementById('btnVerify').onclick = async () => {
      const code = document.getElementById('otpInput').value.trim();
      const nickname = document.getElementById('nickInput').value.trim() || `Player_${Math.floor(1000 + Math.random() * 9000)}`;

      if (!code || code.length < 6) {
        alert("Mobile par aaya 6-digit SMS code enter karein.");
        return;
      }

      const verifyBtn = document.getElementById('btnVerify');
      verifyBtn.innerText = "Verifying...";
      verifyBtn.disabled = true;

      try {
        const result = await confirmationResult.confirm(code);
        const user = result.user;

        // Session Save
        localStorage.setItem('chess_auth', 'true');
        localStorage.setItem('chess_contact', user.phoneNumber || 'Verified');
        localStorage.setItem('chess_name', nickname);
        localStorage.setItem('chess_avatar', `https://api.dicebear.com/7.x/bottts/svg?seed=${encodeURIComponent(nickname)}`);
        
        if (!localStorage.getItem('chess_calibration_games')) {
          localStorage.setItem('chess_calibration_games', '0');
          localStorage.setItem('chess_rating', 'Calibrating (?)');
        }
        if (!localStorage.getItem('chess_max_bot_unlocked')) {
          localStorage.setItem('chess_max_bot_unlocked', '1');
        }

        window.location.href = 'index.html';
      } catch (err) {
        console.error(err);
        alert("Galat OTP code! Apne SMS me check karke sahi 6-digit OTP daalein.");
        verifyBtn.innerText = "Verify SMS Code & Enter";
        verifyBtn.disabled = false;
      }
    };

    document.getElementById('btnBackToInput').onclick = () => {
      document.getElementById('stepVerifyOtp').classList.add('hidden');
      document.getElementById('stepRequestOtp').classList.remove('hidden');
      document.getElementById('btnSendOtp').disabled = false;
      document.getElementById('sendBtnText').innerText = "Send SMS OTP";
    };
  </script>
</body>
</html>
