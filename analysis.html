<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Chess Universe - Pro Game Review & Engine Breakdown</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
  <link rel="stylesheet" href="style.css">
  <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>

  <style>
    body {
      background: radial-gradient(circle at top, #14241b 0%, #060e09 100%);
      color: #e2e8f0;
      touch-action: manipulation;
    }
    .white-1e1d7 { background-color: #ebecd0 !important; color: #739552 !important; }
    .black-3c85d { background-color: #739552 !important; color: #ebecd0 !important; }
    .piece-417db { pointer-events: none !important; user-select: none !important; }

    /* Tactical Move Highlights */
    .highlight-best { background-color: rgba(16, 185, 129, 0.55) !important; }
    .highlight-mistake { background-color: rgba(245, 158, 11, 0.55) !important; }
    .highlight-blunder { background-color: rgba(239, 68, 68, 0.6) !important; }
    .highlight-normal { background-color: rgba(247, 230, 80, 0.45) !important; }

    /* Move List Badges */
    .move-chip.active {
      background: rgba(16, 185, 129, 0.25) !important;
      border-color: #10b981 !important;
      color: #34d399 !important;
      font-weight: 800;
    }
    
    .custom-scroll::-webkit-scrollbar { width: 4px; height: 4px; }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: rgba(16, 185, 129, 0.35);
      border-radius: 4px;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col font-sans select-none pb-8">

  <!-- Header -->
  <header class="border-b border-emerald-950 bg-emerald-950/40 backdrop-blur sticky top-0 z-40 px-3 py-2.5 flex items-center justify-between">
    <div class="flex items-center gap-2.5">
      <a href="index.html" class="w-8 h-8 rounded-xl bg-slate-900 border border-slate-800 flex items-center justify-center text-slate-300 hover:text-white transition">
        <i class="fa-solid fa-chevron-left text-xs"></i>
      </a>
      <div>
        <h1 class="text-xs font-black uppercase tracking-wider text-white flex items-center gap-1.5">
          <span>Game Review</span>
          <span class="text-[9px] bg-emerald-500/20 text-emerald-400 font-mono px-1.5 py-0.2 rounded border border-emerald-500/30">CENTIPAWN 2.0</span>
        </h1>
        <p id="subMatchInfo" class="text-[10px] text-slate-400 font-medium">vs Opponent</p>
      </div>
    </div>
    <div class="flex items-center gap-1.5">
      <button onclick="board.flip()" class="px-2.5 py-1 rounded-xl bg-slate-900 border border-slate-800 text-xs font-bold text-slate-300 hover:text-white transition">
        <i class="fa-solid fa-repeat"></i> Flip
      </button>
    </div>
  </header>

  <main class="max-w-md w-full mx-auto px-3 pt-3 flex flex-col gap-3">

    <!-- Board Area with Centipawn Eval Bar -->
    <div class="flex items-center justify-center gap-2.5">
      <!-- Flush-Aligned Real-Time Evaluation Bar -->
      <div class="w-3.5 h-[315px] bg-slate-950 border border-slate-800 rounded-full overflow-hidden flex flex-col justify-end relative shadow-inner">
        <div id="evalBarFill" class="w-full bg-emerald-400 transition-all duration-300" style="height: 50%;"></div>
        <span id="evalScoreText" class="absolute inset-x-0 bottom-1 text-center text-[8px] font-mono font-black text-slate-950">+0.0</span>
      </div>

      <!-- Chessboard Frame -->
      <div class="w-[315px] rounded-2xl overflow-hidden border-2 border-emerald-950 shadow-2xl relative">
        <div id="analysisBoard" class="w-full"></div>
      </div>
    </div>

    <!-- Advantage Flow Chart Canvas -->
    <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-2.5 shadow-md flex flex-col gap-1.5">
      <div class="flex items-center justify-between text-[10px] font-bold text-slate-400 uppercase">
        <span>Advantage Chart</span>
        <span id="evalPeakInfo" class="text-emerald-400 font-mono">Even</span>
      </div>
      <canvas id="evalGraphCanvas" height="42" class="w-full rounded-lg bg-slate-950"></canvas>
    </div>

    <!-- Stepper Controls & Quality Badge -->
    <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-2.5 flex items-center justify-between shadow-md">
      <div class="flex gap-1.5">
        <button onclick="firstMove()" class="w-8 h-8 rounded-xl bg-slate-950 border border-slate-800 text-slate-300 hover:text-white flex items-center justify-center text-xs">
          <i class="fa-solid fa-backward-fast"></i>
        </button>
        <button onclick="prevMove()" class="w-8 h-8 rounded-xl bg-slate-950 border border-slate-800 text-slate-300 hover:text-white flex items-center justify-center text-xs">
          <i class="fa-solid fa-chevron-left"></i>
        </button>
      </div>

      <div class="text-center font-mono">
        <div class="text-xs font-black text-white">
          Move: <span id="currentMoveIndex">0</span> / <span id="totalMovesCount">0</span>
        </div>
        <div id="moveQualityBadge" class="text-[10px] font-bold text-emerald-400 mt-0.5">
          STARTING POSITION
        </div>
      </div>

      <div class="flex gap-1.5">
        <button onclick="nextMove()" class="w-8 h-8 rounded-xl bg-slate-950 border border-slate-800 text-slate-300 hover:text-white flex items-center justify-center text-xs">
          <i class="fa-solid fa-chevron-right"></i>
        </button>
        <button onclick="lastMove()" class="w-8 h-8 rounded-xl bg-slate-950 border border-slate-800 text-slate-300 hover:text-white flex items-center justify-center text-xs">
          <i class="fa-solid fa-forward-fast"></i>
        </button>
      </div>
    </div>
        <!-- Complete Chess.com Classification Cards Grid -->
    <div class="grid grid-cols-4 gap-2 text-center">
      <div class="bg-slate-900/90 border border-slate-800 p-2 rounded-2xl shadow">
        <div class="flex items-center justify-center gap-1 text-[9px] uppercase font-bold text-slate-400">
          <span>Best</span> <span>⭐</span>
        </div>
        <span id="metricBest" class="text-xs font-mono font-black text-emerald-400">0</span>
      </div>
      <div class="bg-slate-900/90 border border-slate-800 p-2 rounded-2xl shadow">
        <div class="flex items-center justify-center gap-1 text-[9px] uppercase font-bold text-slate-400">
          <span>Accuracy</span> <span>🎯</span>
        </div>
        <span id="metricAccuracy" class="text-xs font-mono font-black text-cyan-400">0%</span>
      </div>
      <div class="bg-slate-900/90 border border-slate-800 p-2 rounded-2xl shadow">
        <div class="flex items-center justify-center gap-1 text-[9px] uppercase font-bold text-slate-400">
          <span>Mistake</span> <span>⚠️</span>
        </div>
        <span id="metricMistakes" class="text-xs font-mono font-black text-amber-400">0</span>
      </div>
      <div class="bg-slate-900/90 border border-slate-800 p-2 rounded-2xl shadow">
        <div class="flex items-center justify-center gap-1 text-[9px] uppercase font-bold text-slate-400">
          <span>Blunder</span> <span>❌</span>
        </div>
        <span id="metricBlunders" class="text-xs font-mono font-black text-rose-400">0</span>
      </div>
    </div>

    <!-- Engine Recommendation & Coach Advice -->
    <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-3 flex flex-col gap-2 shadow-md">
      <div class="flex items-center justify-between">
        <h3 class="text-xs font-black uppercase tracking-wider text-amber-400 flex items-center gap-1.5">
          <i class="fa-solid fa-brain"></i>
          <span>Engine Recommendation</span>
        </h3>
        <span id="bestAltMoveTag" class="text-[10px] font-mono font-bold px-2 py-0.5 rounded-lg bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">
          Best: -
        </span>
      </div>
      <p id="coachAdviceText" class="text-xs text-slate-300 leading-relaxed font-medium">
        Loading evaluation...
      </p>
    </div>

    <!-- Full Interactive PGN Move Table (Clickable Chips) -->
    <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-3 flex flex-col gap-2 shadow-md">
      <div class="flex items-center justify-between border-b border-slate-800/80 pb-2">
        <h3 class="text-xs font-black uppercase tracking-wider text-slate-300 flex items-center gap-1.5">
          <i class="fa-solid fa-list-ol text-emerald-400"></i>
          <span>Move History List</span>
        </h3>
        <button onclick="jumpToNextBlunder()" class="text-[9px] font-bold text-rose-400 hover:text-rose-300 bg-rose-500/10 border border-rose-500/30 px-2 py-0.5 rounded-md transition">
          Find Blunder ⚡
        </button>
      </div>

      <div id="pgnChipsFeed" class="flex flex-wrap gap-1.5 max-h-36 overflow-y-auto custom-scroll pr-1">
        <!-- Rendered via JS -->
      </div>
    </div>

  </main>
    <script>
    let report = null;
    try {
      report = JSON.parse(localStorage.getItem('last_match_analysis') || 'null');
    } catch(e) {}

    let moveHistory = report && report.moves ? report.moves : [];
    let currentStep = 0;
    let evalPositions = [];

    // Realistic Piece-Square Values
    const pieceVals = { p: 100, n: 320, b: 330, r: 500, q: 900, k: 0 };

    function calculateBoardScore(sim) {
      let score = 0;
      const b = sim.board();
      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          const p = b[r][c];
          if (p) {
            const v = pieceVals[p.type] || 0;
            score += (p.color === 'w' ? v : -v);
          }
        }
      }
      return +(score / 100).toFixed(1);
    }

    function evaluateMatchEngine() {
      let sim = new Chess();
      let prevScore = 0.0;
      let bestCount = 0;
      let mistakes = 0;
      let blunders = 0;
      let inaccuracies = 0;

      evalPositions.push({
        fen: sim.fen(),
        score: 0.0,
        label: 'START',
        from: null,
        to: null,
        suggested: '-'
      });

      moveHistory.forEach((san, idx) => {
        const turnBefore = sim.turn();
        
        // Find best alternate engine move before executing move
        const possible = sim.moves({ verbose: true });
        let engineBestMove = possible[0] ? possible[0].san : '-';
        if (possible.length > 1) {
          const captures = possible.filter(m => m.captured);
          if (captures.length) engineBestMove = captures[0].san;
        }

        const executed = sim.move(san);
        const newScore = calculateBoardScore(sim);
        const delta = (turnBefore === 'w') ? (newScore - prevScore) : (prevScore - newScore);

        let label = 'GOOD';
        if (delta <= -2.5) {
          label = 'BLUNDER';
          blunders++;
        } else if (delta <= -1.2) {
          label = 'MISTAKE';
          mistakes++;
        } else if (delta <= -0.5) {
          label = 'INACCURACY';
          inaccuracies++;
        } else if (delta >= 0.1) {
          label = 'BEST';
          bestCount++;
        }

        prevScore = newScore;
        evalPositions.push({
          fen: sim.fen(),
          score: newScore,
          label: label,
          from: executed ? executed.from : null,
          to: executed ? executed.to : null,
          san: san,
          suggested: engineBestMove
        });
      });

      const totalMoves = moveHistory.length || 1;
      const totalTurns = Math.max(1, Math.floor(totalMoves / 2));
      const penalty = (blunders * 12) + (mistakes * 6) + (inaccuracies * 3);
      const calculatedAccuracy = Math.max(50, Math.min(96, Math.round(100 - (penalty / totalTurns))));

      document.getElementById('metricBest').innerText = bestCount;
      document.getElementById('metricAccuracy').innerText = calculatedAccuracy + '%';
      document.getElementById('metricMistakes').innerText = mistakes;
      document.getElementById('metricBlunders').innerText = blunders;

      // Coach Advice Comment
      let advice = "";
      if (blunders > 1) {
        advice = `You gave away ${blunders} severe tactical blunder(s). Keep pieces defended and look out for forks & hanging queen moves.`;
      } else if (mistakes > 1) {
        advice = `Solid game! You made ${mistakes} positional mistake(s). Work on king protection and controlling center files early.`;
      } else {
        advice = `Outstanding performance! You maintained relentless control with clean coordination and minimal inaccuracies.`;
      }
      document.getElementById('coachAdviceText').innerText = advice;
    }

    if (report) {
      document.getElementById('subMatchInfo').innerText = `vs ${report.opponent || 'Opponent'} • Rating ${report.delta >= 0 ? '+' : ''}${report.delta || 0}`;
    }

    evaluateMatchEngine();
    document.getElementById('totalMovesCount').innerText = moveHistory.length;

    // Render PGN Chips Feed
    function renderPgnFeed() {
      const feed = document.getElementById('pgnChipsFeed');
      feed.innerHTML = '';
      moveHistory.forEach((san, idx) => {
        const moveNumber = Math.floor(idx / 2) + 1;
        const isWhite = idx % 2 === 0;
        const pos = evalPositions[idx + 1] || {};
        
        let labelColor = "text-slate-300";
        if (pos.label === 'BLUNDER') labelColor = "text-rose-400 font-bold";
        else if (pos.label === 'MISTAKE') labelColor = "text-amber-400";
        else if (pos.label === 'BEST') labelColor = "text-emerald-400";

        const chip = document.createElement('button');
        chip.id = 'chip-' + (idx + 1);
        chip.className = `move-chip px-2 py-1 rounded-lg bg-slate-950 border border-slate-800 text-[11px] font-mono ${labelColor} hover:border-emerald-500 transition`;
        chip.innerText = `${isWhite ? moveNumber + '.' : ''}${san}`;
        chip.onclick = () => jumpToMove(idx + 1);
        feed.appendChild(chip);
      });
    }

    // Canvas Advantage Graph Renderer
    function drawEvalGraph() {
      const canvas = document.getElementById('evalGraphCanvas');
      if (!canvas || evalPositions.length === 0) return;
      const ctx = canvas.getContext('2d');
      const w = canvas.width = canvas.parentElement.clientWidth - 20;
      const h = canvas.height = 42;

      ctx.clearRect(0, 0, w, h);
      ctx.strokeStyle = '#1e293b';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(0, h / 2);
      ctx.lineTo(w, h / 2);
      ctx.stroke();

      ctx.strokeStyle = '#10b981';
      ctx.lineWidth = 2;
      ctx.beginPath();

      const stepX = w / Math.max(1, evalPositions.length - 1);
      evalPositions.forEach((pos, i) => {
        const x = i * stepX;
        const clamped = Math.max(-5, Math.min(5, pos.score));
        const y = (h / 2) - (clamped / 5) * (h / 2.2);
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.stroke();
    }

    const board = Chessboard('analysisBoard', {
      draggable: false,
      position: 'start',
      orientation: report && report.playedSide === 'black' ? 'black' : 'white',
      pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
    });

    function highlightSquares(from, to, label) {
      $('#analysisBoard .square-55d63').removeClass('highlight-best highlight-mistake highlight-blunder highlight-normal');
      if (!from || !to) return;
      let cls = 'highlight-normal';
      if (label === 'BLUNDER') cls = 'highlight-blunder';
      else if (label === 'MISTAKE') cls = 'highlight-mistake';
      else if (label === 'BEST') cls = 'highlight-best';
      
      $('#analysisBoard .square-' + from).addClass(cls);
      $('#analysisBoard .square-' + to).addClass(cls);
    }

    function updateStepUI() {
      const cur = evalPositions[currentStep] || { fen: 'start', score: 0.0, label: 'START' };
      board.position(cur.fen);
      document.getElementById('currentMoveIndex').innerText = currentStep;

      // Evaluation Bar Fill
      const clamped = Math.max(-5, Math.min(5, cur.score));
      const percentage = Math.round(((clamped + 5) / 10) * 100);
      document.getElementById('evalBarFill').style.height = `${percentage}%`;
      document.getElementById('evalScoreText').innerText = (cur.score >= 0 ? '+' : '') + cur.score;

      // Badge Quality
      const badge = document.getElementById('moveQualityBadge');
      badge.innerText = `${cur.label} (SCORE: ${cur.score >= 0 ? '+' : ''}${cur.score})`;
      if (cur.label === 'BLUNDER') badge.className = "text-[10px] font-bold text-rose-400";
      else if (cur.label === 'MISTAKE') badge.className = "text-[10px] font-bold text-amber-400";
      else badge.className = "text-[10px] font-bold text-emerald-400";

      // Best alternate move tag
      document.getElementById('bestAltMoveTag').innerText = `Best: ${cur.suggested || '-'}`;

      highlightSquares(cur.from, cur.to, cur.label);

      // Active Chip Highlight
      document.querySelectorAll('.move-chip').forEach(c => c.classList.remove('active'));
      const activeChip = document.getElementById('chip-' + currentStep);
      if (activeChip) activeChip.classList.add('active');
    }

    function jumpToMove(step) {
      currentStep = step;
      updateStepUI();
    }

    function nextMove() {
      if (currentStep < evalPositions.length - 1) {
        currentStep++;
        updateStepUI();
      }
    }

    function prevMove() {
      if (currentStep > 0) {
        currentStep--;
        updateStepUI();
      }
    }

    function firstMove() { currentStep = 0; updateStepUI(); }
    function lastMove() { currentStep = evalPositions.length - 1; updateStepUI(); }

    function jumpToNextBlunder() {
      const blunderIdx = evalPositions.findIndex((p, i) => i > currentStep && p.label === 'BLUNDER');
      if (blunderIdx !== -1) {
        jumpToMove(blunderIdx);
      } else {
        const loopIdx = evalPositions.findIndex(p => p.label === 'BLUNDER');
        if (loopIdx !== -1) jumpToMove(loopIdx);
        else alert("No blunders detected in this game! 🎉");
      }
    }

    renderPgnFeed();
    drawEvalGraph();
    $(window).resize(() => { board.resize(); drawEvalGraph(); });
    updateStepUI();
  </script>
</body>
</html>
