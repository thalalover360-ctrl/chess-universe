<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Chess Universe - Deep Engine Analysis</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Chessboard & Chess.js dependencies -->
  <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
  <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>

  <style>
    body {
      background: radial-gradient(circle at top, #14241b 0%, #080f0c 100%);
      color: #e2e8f0;
      touch-action: manipulation;
    }
    .white-1e1d7 { background-color: #ebecd0 !important; color: #739552 !important; }
    .black-3c85d { background-color: #739552 !important; color: #ebecd0 !important; }
    .active-move { background-color: rgba(16, 185, 129, 0.25) !important; color: #34d399 !important; font-weight: bold; border-color: #10b981 !important; }
    .eval-bar-fill { transition: height 0.3s ease; }
  </style>
</head>
<body class="min-h-screen flex flex-col font-sans select-none pb-6">

  <!-- Analysis Header -->
  <header class="border-b border-emerald-950 bg-emerald-950/40 backdrop-blur sticky top-0 z-40 px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <a href="index.html" class="w-9 h-9 rounded-xl bg-slate-900 border border-slate-800 flex items-center justify-center text-slate-300 hover:text-white">
        <i class="fa-solid fa-arrow-left"></i>
      </a>
      <div>
        <h1 class="text-sm font-black uppercase text-white tracking-wider flex items-center gap-2">
          <span>Game Review</span>
          <span class="text-[9px] bg-emerald-500/20 text-emerald-400 font-mono px-2 py-0.5 rounded-full border border-emerald-500/30">DEEP EVAL</span>
        </h1>
        <p id="analysisMatchSummary" class="text-[10px] text-slate-400 font-medium">Running tactical heuristics...</p>
      </div>
    </div>
    <div id="badgeOutcome" class="px-2.5 py-1 rounded-xl text-xs font-black bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">
      REVIEW
    </div>
  </header>

  <main class="max-w-md w-full mx-auto px-3 pt-3 flex flex-col gap-3">

    <!-- Board + Live Eval Bar Row -->
    <div class="flex gap-2 items-center">
      <!-- Eval Bar -->
      <div class="w-4 h-[350px] bg-slate-900 border border-slate-800 rounded-lg overflow-hidden flex flex-col justify-end relative shadow-inner">
        <div id="evalBarWhite" class="eval-bar-fill w-full bg-emerald-400" style="height: 50%;"></div>
        <span id="evalScoreTag" class="absolute inset-x-0 bottom-1 text-[8px] font-black text-slate-950 text-center font-mono">+0.0</span>
      </div>

      <!-- Replay Board -->
      <div class="flex-1 aspect-square rounded-2xl overflow-hidden border-2 border-emerald-950 shadow-2xl relative bg-slate-950">
        <div id="analysisBoard" class="w-full h-full"></div>
      </div>
    </div>

    <!-- Navigation Stepper -->
    <div class="flex items-center justify-between bg-slate-900/90 border border-slate-800 px-3 py-2 rounded-2xl shadow-lg">
      <div class="flex items-center gap-1.5">
        <button onclick="goToMove(0)" class="w-9 h-9 rounded-xl bg-slate-950 hover:bg-slate-800 border border-slate-800 text-slate-300 flex items-center justify-center text-xs">
          <i class="fa-solid fa-backward-step"></i>
        </button>
        <button onclick="stepMove(-1)" class="w-9 h-9 rounded-xl bg-slate-950 hover:bg-slate-800 border border-slate-800 text-slate-300 flex items-center justify-center text-xs">
          <i class="fa-solid fa-chevron-left"></i>
        </button>
      </div>

      <div class="text-center font-mono text-xs font-bold text-slate-300">
        Move: <span id="currentMoveDisplay" class="text-emerald-400">0</span> / <span id="totalMovesDisplay">0</span>
        <div id="moveVerdictBadge" class="text-[10px] text-slate-400 font-sans mt-0.5">Starting Position</div>
      </div>

      <div class="flex items-center gap-1.5">
        <button onclick="stepMove(1)" class="w-9 h-9 rounded-xl bg-slate-950 hover:bg-slate-800 border border-slate-800 text-slate-300 flex items-center justify-center text-xs">
          <i class="fa-solid fa-chevron-right"></i>
        </button>
        <button onclick="goToMove(historyMoves.length)" class="w-9 h-9 rounded-xl bg-slate-950 hover:bg-slate-800 border border-slate-800 text-slate-300 flex items-center justify-center text-xs">
          <i class="fa-solid fa-forward-step"></i>
        </button>
      </div>
    </div>

    <!-- Move Classification Cards (Brilliant / Mistakes / Blunders) -->
    <section class="grid grid-cols-4 gap-1.5 text-center">
      <div class="p-2 rounded-2xl bg-slate-900 border border-slate-800">
        <span class="text-[9px] font-bold text-cyan-400 uppercase tracking-wider block">Best</span>
        <span id="metricBest" class="text-sm font-black text-white font-mono">0</span>
      </div>
      <div class="p-2 rounded-2xl bg-slate-900 border border-slate-800">
        <span class="text-[9px] font-bold text-emerald-400 uppercase tracking-wider block">Accuracy</span>
        <span id="metricAccuracy" class="text-sm font-black text-emerald-400 font-mono">--%</span>
      </div>
      <div class="p-2 rounded-2xl bg-slate-900 border border-slate-800">
        <span class="text-[9px] font-bold text-amber-400 uppercase tracking-wider block">Mistakes</span>
        <span id="metricMistakes" class="text-sm font-black text-amber-400 font-mono">0</span>
      </div>
      <div class="p-2 rounded-2xl bg-slate-900 border border-slate-800">
        <span class="text-[9px] font-bold text-rose-400 uppercase tracking-wider block">Blunders</span>
        <span id="metricBlunders" class="text-sm font-black text-rose-400 font-mono">0</span>
      </div>
    </section>

    <!-- Deep Coaching Focus Area -->
    <section class="p-3.5 rounded-2xl bg-slate-900/90 border border-slate-800 shadow-lg flex flex-col gap-1.5">
      <div class="flex items-center gap-2 text-amber-400 font-black text-xs uppercase tracking-wider">
        <i class="fa-solid fa-crosshairs"></i>
        <span>Coach's Deep Breakdown</span>
      </div>
      <p id="tacticalAdviceText" class="text-xs text-slate-300 leading-relaxed font-medium">
        Running engine evaluation on moves...
      </p>
    </section>

    <!-- Annotated Move Feed with Badges -->
    <section class="p-3 rounded-2xl bg-slate-900/90 border border-slate-800 shadow-lg flex flex-col gap-2">
      <h3 class="text-xs font-black uppercase text-slate-400 tracking-wider">Move Flow</h3>
      <div id="movesListContainer" class="flex flex-wrap gap-1.5 max-h-32 overflow-y-auto p-1 font-mono text-xs"></div>
    </section>

    <!-- Bottom Actions -->
    <div class="flex gap-2 pt-1">
      <a href="game.html" class="flex-1 py-3 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black text-xs text-center transition shadow-lg">
        Play Next Match ⚔️
      </a>
      <a href="index.html" class="flex-1 py-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-white font-black text-xs text-center transition border border-slate-700">
        Dashboard 🏠
      </a>
    </div>

  </main>

  <script>
    let matchData = null;
    try {
      matchData = JSON.parse(localStorage.getItem('last_match_analysis') || '{}');
    } catch (e) {}

    const replayGame = new Chess();
    let board = null;
    let historyMoves = matchData.moves || [];
    let currentMoveIndex = 0;
    let analysisScores = []; // Stores eval score per ply
    let moveTags = [];       // 'best', 'good', 'inaccuracy', 'mistake', 'blunder'

    // Board Setup
    const boardOrientation = matchData.playedSide === 'black' ? 'black' : 'white';
    board = Chessboard('analysisBoard', {
      draggable: false,
      position: 'start',
      orientation: boardOrientation,
      pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
    });
    $(window).resize(board.resize);

    // Deep Heuristic Evaluation Engine
    const pieceValues = { p: 100, n: 320, b: 330, r: 500, q: 900, k: 20000 };
    function evaluatePosition(gameInstance) {
      if (gameInstance.in_checkmate()) {
        return gameInstance.turn() === 'w' ? -10000 : 10000;
      }
      if (gameInstance.in_draw()) return 0;

      let score = 0;
      const b = gameInstance.board();
      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          const piece = b[r][c];
          if (piece) {
            const val = pieceValues[piece.type] || 0;
            // Center control bonus
            const centerBonus = (r >= 3 && r <= 4 && c >= 3 && c <= 4) ? 25 : 0;
            score += piece.color === 'w' ? (val + centerBonus) : -(val + centerBonus);
          }
        }
      }
      return score;
    }

    // Run Full Match Analysis Loop
    function runMatchReview() {
      const simGame = new Chess();
      let prevScore = 0;
      let bestCount = 0, mistakeCount = 0, blunderCount = 0;
      let worstBlunderMove = null;

      analysisScores.push(0);

      historyMoves.forEach((moveStr, i) => {
        simGame.move(moveStr);
        const curScore = evaluatePosition(simGame);
        analysisScores.push(curScore);

        const delta = (i % 2 === 0) ? (curScore - prevScore) : (prevScore - curScore);

        let tag = 'good';
        if (delta >= -15) {
          tag = 'best';
          bestCount++;
        } else if (delta < -250) {
          tag = 'blunder';
          blunderCount++;
          if (!worstBlunderMove) worstBlunderMove = { move: moveStr, ply: i + 1 };
        } else if (delta < -120) {
          tag = 'mistake';
          mistakeCount++;
        } else if (delta < -50) {
          tag = 'inaccuracy';
        }

        moveTags.push(tag);
        prevScore = curScore;
      });

      const totalMoves = historyMoves.length;
      document.getElementById('totalMovesDisplay').innerText = totalMoves;
      document.getElementById('metricBest').innerText = bestCount;
      document.getElementById('metricMistakes').innerText = mistakeCount;
      document.getElementById('metricBlunders').innerText = blunderCount;

      const accuracy = totalMoves > 0 
        ? Math.max(50, Math.min(98, Math.round(100 - (blunderCount * 8 + mistakeCount * 4) / Math.max(1, totalMoves / 2) * 10))) 
        : 80;
      document.getElementById('metricAccuracy').innerText = accuracy + '%';

      // Coaching Takeaways
      if (worstBlunderMove) {
        document.getElementById('tacticalAdviceText').innerText = 
          `Move ${Math.ceil(worstBlunderMove.ply / 2)} (${worstBlunderMove.move}) par decisive blunder hua jisse piece exchange me loss hua. Tactically defend karein.`;
      } else if (mistakeCount > 0) {
        document.getElementById('tacticalAdviceText').innerText = 
          "Opening aur center setup solid tha! Middle-game transitions me opponent ke tactical forks par thoda aur dhyan dein.";
      } else {
        document.getElementById('tacticalAdviceText').innerText = 
          "Master-grade game! Clean coordination, minimum inaccuracies aur accurate endgame execution.";
      }

      renderMovesList();
      goToMove(totalMoves);
    }

    function renderMovesList() {
      const container = document.getElementById('movesListContainer');
      container.innerHTML = '';

      historyMoves.forEach((m, idx) => {
        const btn = document.createElement('button');
        const moveNumber = idx % 2 === 0 ? `${Math.floor(idx / 2) + 1}. ` : '';
        const tag = moveTags[idx];

        let tagColor = "border-slate-800 text-slate-300";
        if (tag === 'best') tagColor = "border-cyan-500/40 text-cyan-400";
        if (tag === 'mistake') tagColor = "border-amber-500/40 text-amber-400";
        if (tag === 'blunder') tagColor = "border-rose-500/60 text-rose-400 font-bold";

        btn.id = `move-btn-${idx + 1}`;
        btn.className = `px-2 py-1 rounded-lg bg-slate-950 border text-xs transition ${tagColor}`;
        btn.innerText = moveNumber + m;
        btn.onclick = () => goToMove(idx + 1);
        container.appendChild(btn);
      });
    }

    function goToMove(targetIndex) {
      if (targetIndex < 0 || targetIndex > historyMoves.length) return;
      currentMoveIndex = targetIndex;

      replayGame.reset();
      for (let i = 0; i < currentMoveIndex; i++) {
        replayGame.move(historyMoves[i]);
      }
      board.position(replayGame.fen());
      document.getElementById('currentMoveDisplay').innerText = currentMoveIndex;

      // Update Evaluation Bar UI
      const rawScore = analysisScores[currentMoveIndex] || 0;
      const cpScore = (rawScore / 100).toFixed(1);
      const scoreStr = (rawScore >= 0 ? '+' : '') + cpScore;
      document.getElementById('evalScoreTag').innerText = scoreStr;

      // Clamp percentage for bar fill (50% is equal)
      const clampedScore = Math.max(-1000, Math.min(1000, rawScore));
      const whitePct = Math.min(95, Math.max(5, 50 + (clampedScore / 20)));
      document.getElementById('evalBarWhite').style.height = whitePct + '%';

      // Move Tag Badge
      const verdict = document.getElementById('moveVerdictBadge');
      if (currentMoveIndex === 0) {
        verdict.innerText = "Starting Position";
        verdict.className = "text-[10px] text-slate-400 font-sans mt-0.5";
      } else {
        const t = moveTags[currentMoveIndex - 1];
        verdict.innerText = t.toUpperCase() + ` (Score: ${scoreStr})`;
        verdict.className = `text-[10px] font-black uppercase mt-0.5 ${
          t === 'best' ? 'text-cyan-400' : t === 'blunder' ? 'text-rose-400' : t === 'mistake' ? 'text-amber-400' : 'text-emerald-400'
        }`;
      }

      // Highlight active pill
      document.querySelectorAll('#movesListContainer button').forEach(b => b.classList.remove('active-move'));
      if (currentMoveIndex > 0) {
        const activeBtn = document.getElementById(`move-btn-${currentMoveIndex}`);
        if (activeBtn) {
          activeBtn.classList.add('active-move');
          activeBtn.scrollIntoView({ block: 'nearest', inline: 'center' });
        }
      }
    }

    function stepMove(dir) {
      goToMove(currentMoveIndex + dir);
    }

    if (matchData && historyMoves.length > 0) {
      document.getElementById('analysisMatchSummary').innerText = `vs ${matchData.opponent || 'Opponent'} • Rating ${matchData.delta > 0 ? '+' : ''}${matchData.delta || 0}`;
      runMatchReview();
    }
  </script>
</body>
</html>
