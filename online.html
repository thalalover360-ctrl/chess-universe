<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Online Arena | Chess Universe</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">

  <style>
    body {
      background: radial-gradient(circle at top, #14241b 0%, #060e09 100%);
      color: #e2e8f0;
      touch-action: manipulation;
    }
    .glass-card {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(16, 185, 129, 0.2);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col font-sans select-none pb-10">

  <!-- Header -->
  <header class="border-b border-emerald-950 bg-emerald-950/40 backdrop-blur sticky top-0 z-40 px-3 py-2.5 flex items-center justify-between">
    <div class="flex items-center gap-2.5">
      <a href="index.html" class="w-8 h-8 rounded-xl bg-slate-900 border border-slate-800 flex items-center justify-center text-slate-300 hover:text-white transition">
        <i class="fa-solid fa-chevron-left text-xs"></i>
      </a>
      <div>
        <h1 class="text-xs font-black uppercase text-white tracking-wider flex items-center gap-1.5">
          <span>Live Arena</span>
          <span class="text-[9px] bg-emerald-500/20 text-emerald-400 font-mono px-1.5 py-0.2 rounded border border-emerald-500/30">FIRESTORE</span>
        </h1>
        <p class="text-[10px] text-slate-400 font-medium">Real-Time Multiplayer</p>
      </div>
    </div>
    <div class="flex items-center gap-1 bg-slate-950 border border-amber-500/40 px-2.5 py-1 rounded-xl font-mono text-xs">
      <span>🪙</span>
      <span id="displayCoins" class="font-bold text-amber-400">350</span>
    </div>
  </header>

  <main class="max-w-md w-full mx-auto px-3 pt-3 flex flex-col gap-3.5">

    <!-- Player Profile Card -->
    <div class="glass-card rounded-2xl p-3 flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div class="w-10 h-10 rounded-xl bg-emerald-500/20 border border-emerald-500/40 flex items-center justify-center font-bold text-emerald-400" id="userAvatarText">H</div>
        <div>
          <h2 id="displayUserName" class="text-xs font-black text-white leading-tight">Player</h2>
          <div class="flex items-center gap-2 text-[10px] text-slate-400 font-mono mt-0.5">
            <span>UID: <strong id="displayUserUID" class="text-emerald-400">Loading...</strong></span>
            <span>•</span>
            <span id="displayUserElo" class="text-slate-300 font-bold">1200 Elo</span>
          </div>
        </div>
      </div>
      <a href="music.html" class="w-8 h-8 rounded-xl bg-slate-950 border border-slate-800 flex items-center justify-center text-emerald-400 hover:text-white transition">
        <i class="fa-solid fa-music text-xs"></i>
      </a>
    </div>

    <!-- Mode 1: WhatsApp Private Room -->
    <div class="glass-card rounded-3xl p-4 flex flex-col gap-3 shadow-xl">
      <div class="flex items-center gap-3">
        <div class="w-11 h-11 rounded-2xl bg-emerald-500/20 border border-emerald-500/40 flex items-center justify-center text-emerald-400 text-xl">
          <i class="fa-brands fa-whatsapp text-2xl"></i>
        </div>
        <div>
          <h3 class="text-xs font-black text-white uppercase tracking-wider">WhatsApp Duel Pool</h3>
          <p class="text-[10px] text-slate-400">Instant link share for friends</p>
        </div>
      </div>

      <div class="p-3 bg-slate-950 rounded-2xl border border-slate-800 flex flex-col items-center gap-2">
        <span class="text-[9px] uppercase font-bold text-slate-500 tracking-wider">Your Room Code</span>
        <div id="liveRoomCodeText" class="font-mono text-xl font-black text-emerald-400 tracking-widest py-1 px-4 bg-slate-900 rounded-xl border border-emerald-950">
          GENERATING...
        </div>
        <button onclick="shareWhatsAppInvite()" class="w-full py-2.5 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black rounded-xl text-xs uppercase tracking-wider flex items-center justify-center gap-2 shadow-lg transition">
          <i class="fa-brands fa-whatsapp text-sm"></i>
          <span>Share Room to WhatsApp</span>
        </button>
      </div>

      <!-- Join with Code -->
      <div class="flex items-center gap-2 pt-0.5">
        <input type="text" id="inputRoomCode" placeholder="Enter Friend's Room Code" class="flex-1 uppercase font-mono bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white placeholder:text-slate-600 focus:outline-none focus:border-emerald-500">
        <button onclick="joinRoomByCode()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-white font-bold rounded-xl text-xs uppercase transition border border-slate-700">
          Join
        </button>
      </div>
    </div>

    <!-- Mode 2: Quick Queue Matchmaking -->
    <div class="glass-card rounded-3xl p-4 flex flex-col gap-3 shadow-xl">
      <div class="flex items-center gap-3">
        <div class="w-11 h-11 rounded-2xl bg-cyan-500/20 border border-cyan-500/40 flex items-center justify-center text-cyan-400 text-xl">
          <i class="fa-solid fa-globe"></i>
        </div>
        <div>
          <h3 class="text-xs font-black text-white uppercase tracking-wider">Global Quick Match</h3>
          <p class="text-[10px] text-slate-400">Pairs with online players in your Elo bracket</p>
        </div>
      </div>

      <button id="btnFindGlobal" onclick="startGlobalMatch()" class="w-full py-3 bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white font-black rounded-2xl text-xs uppercase tracking-wider shadow-lg transition flex items-center justify-center gap-2">
        <i class="fa-solid fa-bolt"></i>
        <span>Find Match (±100 Elo)</span>
      </button>

      <!-- Searching Banner -->
      <div id="queueStatusBox" class="hidden p-3 rounded-2xl bg-slate-950 border border-cyan-500/40 flex items-center justify-between">
        <div class="flex items-center gap-2.5">
          <i class="fa-solid fa-spinner animate-spin text-cyan-400 text-sm"></i>
          <span class="text-xs text-slate-300 font-bold">Searching pool...</span>
        </div>
        <button onclick="cancelGlobalMatch()" class="text-[10px] font-bold text-rose-400 hover:text-rose-300">Cancel</button>
      </div>
    </div>

  </main>
    <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { getFirestore, doc, setDoc, getDoc, updateDoc, onSnapshot, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBx79cUd4hX7XzCe8aCPIeqLss1d5nNzaM",
      authDomain: "chess-universe-5a7cb.firebaseapp.com",
      projectId: "chess-universe-5a7cb",
      storageBucket: "chess-universe-5a7cb.firebasestorage.app",
      messagingSenderId: "145519167856",
      appId: "1:145519167856:web:bf124bc275895447fd27b5"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Profile Hydration
    const myName = localStorage.getItem('chess_name') || 'Player';
    const myUID = localStorage.getItem('chess_game_uid') || '0000000000';
    const myFirebaseUID = localStorage.getItem('chess_firebase_uid') || '';
    const myElo = parseInt(localStorage.getItem('chess_rating'), 10) || 1200;
    const myCoins = parseInt(localStorage.getItem('chess_coins'), 10) || 350;

    document.getElementById('displayUserName').innerText = myName;
    document.getElementById('userAvatarText').innerText = myName.charAt(0).toUpperCase();
    document.getElementById('displayUserUID').innerText = myUID;
    document.getElementById('displayUserElo').innerText = myElo + ' Elo';
    document.getElementById('displayCoins').innerText = myCoins;

    // Generate Guaranteed 6-char Room Code
    const generatedRoomId = 'CU-' + Math.floor(1000 + Math.random() * 9000);
    document.getElementById('liveRoomCodeText').innerText = generatedRoomId;

    let unsubscribeRoomListener = null;

    // Create Host Room in Firestore
    async function initHostRoom() {
      try {
        const roomRef = doc(db, "rooms", generatedRoomId);
        await setDoc(roomRef, {
          roomId: generatedRoomId,
          hostName: myName,
          hostUID: myUID,
          hostElo: myElo,
          guestName: null,
          guestUID: null,
          guestElo: null,
          status: 'waiting', // waiting -> active -> concluded
          currentTurn: 'w',
          fen: 'start',
          lastMove: null,
          createdAt: Date.now()
        });

        // Listen for guest join
        unsubscribeRoomListener = onSnapshot(roomRef, (snapshot) => {
          if (!snapshot.exists()) return;
          const data = snapshot.data();
          if (data.status === 'active' && data.guestName) {
            window.location.href = `game.html?mode=pvp&room=${generatedRoomId}&side=white&oppName=${encodeURIComponent(data.guestName)}&oppElo=${data.guestElo || 1200}`;
          }
        });
      } catch (err) {
        console.error("Firestore room creation error:", err);
      }
    }

    initHostRoom();

    // WhatsApp Invite Share
    window.shareWhatsAppInvite = () => {
      const origin = window.location.origin;
      const path = window.location.pathname.replace('online.html', '') + 'game.html';
      const inviteLink = `${origin}${path}?mode=pvp&room=${generatedRoomId}&side=black&oppName=${encodeURIComponent(myName)}&oppElo=${myElo}`;
      const msg = encodeURIComponent(`⚔️ *Chess Universe Duel Challenge!*\n\n${myName} invited you to a real-time chess match.\n\nRoom Code: *${generatedRoomId}*\nTap to join battle:\n${inviteLink}`);
      window.open(`https://api.whatsapp.com/send?text=${msg}`, '_blank');
    };

    // Join with Code
    window.joinRoomByCode = async () => {
      const code = document.getElementById('inputRoomCode').value.trim().toUpperCase();
      if (!code) return alert("Please enter room code!");

      try {
        const roomRef = doc(db, "rooms", code);
        const snap = await getDoc(roomRef);
        if (!snap.exists()) return alert("Room not found! Check code.");

        const data = snap.data();
        if (data.status === 'concluded') return alert("This match is already over!");

        await updateDoc(roomRef, {
          guestName: myName,
          guestUID: myUID,
          guestElo: myElo,
          status: 'active'
        });

        window.location.href = `game.html?mode=pvp&room=${code}&side=black&oppName=${encodeURIComponent(data.hostName)}&oppElo=${data.hostElo || 1200}`;
      } catch (err) {
        console.error(err);
        alert("Error joining room: " + err.message);
      }
    };

    // Global Matchmaking Pool
    let searchTimer = null;
    window.startGlobalMatch = async () => {
      document.getElementById('queueStatusBox').classList.remove('hidden');
      document.getElementById('btnFindGlobal').disabled = true;

      try {
        // Check for any waiting room created in the last 45 seconds by another player
        const q = query(collection(db, "rooms"), where("status", "==", "waiting"));
        const snapshot = await getDocs(q);
        let foundRoom = null;

        snapshot.forEach(docSnap => {
          const d = docSnap.data();
          if (d.hostUID !== myUID && (Date.now() - d.createdAt < 45000)) {
            foundRoom = d;
          }
        });

        if (foundRoom) {
          const rRef = doc(db, "rooms", foundRoom.roomId);
          await updateDoc(rRef, {
            guestName: myName,
            guestUID: myUID,
            guestElo: myElo,
            status: 'active'
          });
          window.location.href = `game.html?mode=pvp&room=${foundRoom.roomId}&side=black&oppName=${encodeURIComponent(foundRoom.hostName)}&oppElo=${foundRoom.hostElo || 1200}`;
          return;
        }
      } catch (e) {
        console.warn("Queue lookup error:", e);
      }

      // If no live player in 4s, fallback to realistic peer match
      searchTimer = setTimeout(() => {
        const bots = [
          { name: "Aarav_Tactics", elo: 1220 },
          { name: "Grandmaster_Vikram", elo: 1280 },
          { name: "Rohan_Defense", elo: 1190 }
        ];
        const randomOpp = bots[Math.floor(Math.random() * bots.length)];
        window.location.href = `game.html?mode=online&oppName=${encodeURIComponent(randomOpp.name)}&oppElo=${randomOpp.elo}&side=white`;
      }, 4000);
    };

    window.cancelGlobalMatch = () => {
      if (searchTimer) clearTimeout(searchTimer);
      document.getElementById('queueStatusBox').classList.add('hidden');
      document.getElementById('btnFindGlobal').disabled = false;
    };
  </script>
</body>
</html>
